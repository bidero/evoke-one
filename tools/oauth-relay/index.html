<!DOCTYPE html>
<!--
  Evoke ONE — strona przekierowująca logowania Google Drive.

  GDZIE: https://evoke.pl/evk-oauth/index.html (wgrać przez FTP; serwer
  podaje istniejący plik przed WordPressem). Ten sam adres,
  https://evoke.pl/evk-oauth/, jest wpisany w Google Cloud jako
  „Authorized redirect URI" aplikacji Evoke ONE.

  PO CO. Google odsyła po zgodzie użytkownika wyłącznie na adres wpisany
  w konsoli — a stron z wtyczką jest wiele. Ta strona odczytuje z parametru
  `state` adres powrotu strony, która zaczęła łączenie, i przekazuje tam
  `code` (i `state`, `error`). Niczego nie zapisuje i nie wysyła nigdzie
  indziej.

  BEZPIECZEŃSTWO:
  - przepuszcza WYŁĄCZNIE adresy http/https kończące się na
    /wp-admin/admin-post.php?action=evk_backup_gdrive_callback, bez loginu
    w adresie i bez kotwicy — nie da się jej użyć do przekierowania gdzie
    indziej ani do javascript:;
  - kod bez weryfikatora PKCE, który zna tylko strona zaczynająca łączenie,
    jest bezużyteczny; podpis `state` sprawdza ta strona, nie ta.

  OBOK LEŻY token.php — pośrednik tokenów (1.229.1). Zna sekret klienta
  Google (z pliku evk-oauth-config.php nad public_html, nigdy z repozytorium)
  i robi za strony z wtyczką wymianę kodu i odświeżanie tokenu. Opis w nim.
-->
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Evoke ONE — powrót do panelu</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f6f7fb; color: #1e2233; }
  p { max-width: 32em; padding: 24px; text-align: center; }
</style>
</head>
<body>
<p id="stan">Wracam do panelu WordPressa…</p>
<script>
(function () {
  'use strict';
  var zapytanie = new URLSearchParams(window.location.search);
  function blad(tekst) { document.getElementById('stan').textContent = tekst; }
  try {
    // state = base64url(JSON{u: adres powrotu, n: …}) + "." + podpis (sprawdza go strona powrotu).
    var czesc = (zapytanie.get('state') || '').split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
    var dane = JSON.parse(window.atob(czesc + '==='.slice((czesc.length + 3) % 4)));
    var cel = new URL(dane.u);
    var dobry = /^https?:$/.test(cel.protocol)
      && /\/wp-admin\/admin-post\.php$/.test(cel.pathname)
      && cel.searchParams.get('action') === 'evk_backup_gdrive_callback'
      && !cel.hash && !cel.username && !cel.password;
    if (!dobry) throw new Error('adres');
    ['code', 'state', 'error'].forEach(function (k) {
      if (zapytanie.has(k)) cel.searchParams.set(k, zapytanie.get(k));
    });
    window.location.replace(cel.toString());
  } catch (e) {
    blad('Nie rozpoznaję adresu powrotu. Zamknij tę kartę i połącz się z Google Drive jeszcze raz z panelu WordPressa (Kopie zapasowe).');
  }
})();
</script>
</body>
</html>
