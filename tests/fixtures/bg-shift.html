<style>
  :root { --marka: #1f6feb; }                       /* odpowiednik koloru globalnego Bricks */
  :root[data-theme="dark"] { --marka: #0b1f45; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px system-ui; }
  section { min-height: 100vh; display: grid; place-items: center; font-size: 2rem; color: #fff; }
  /* Przejście na `section` jak w domyślnych global_selectors trybu ciemnego —
     to ono psuło odczyt koloru w 1.29.1 (regresja trybu ciemnego). */
  [data-brx-theme], body, #brx-content, section { transition: background-color .4s ease; }
  #s1 { background-color: #0b2a1a; }
  #s2 { background-color: var(--marka); }
  #s3 { background-color: rgb(180, 40, 60); }
  #s4 { background-image: linear-gradient(#333, #777); }   /* bez własnego koloru — do pominięcia */
  #s5 { background-color: #f0e6d2; color: #222; }
  /* Kolor ustawiony „w builderze" — dziedziczenie go nie przebije. */
  #own, #own-follow { color: rgb(255, 0, 255); }
  :root[data-theme="dark"] #s1 { background-color: #12161d; }
  :root[data-theme="dark"] #s5 { background-color: #1a1512; }
</style>

<section id="s1" data-evk-bg>1
  <span id="own">własny kolor</span>
  <span id="own-follow" class="evk-bg-text">własny, ale podąża</span>
</section>
<section id="s2" data-evk-bg>2 — kolor globalny</section>
<section id="s3" data-evk-bg data-evk-bg-text="rgb(0, 200, 0)">3 — jawny kolor liter</section>
<section id="s4" data-evk-bg>4 — gradient, do pominięcia</section>
<section id="s5" data-evk-bg>5</section>

<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script>
  var q = new URLSearchParams(location.search);
  window.evkBgShift = {
    length: +(q.get('length') || 0.5),
    smooth: 0,
    // Procent wysokości okna, na którym zaczyna się przejście. 100 = górna
    // krawędź nadchodzącej sekcji dotyka dołu okna, czyli zachowanie sprzed
    // 1.53.0. Mniej = przełączenie następuje PÓŹNIEJ, gdy sekcja jest już wyżej.
    start: +(q.get('start') || 100),
  };
</script>
<script>
  // Nadpisanie per sekcja wpisujemy PRZED silnikiem — atrybut jest odczytywany
  // przy budowie łańcucha, więc dopisany później nie miałby żadnego znaczenia.
  (function () {
    var per = new URLSearchParams(location.search).get('sekcja');
    if (!per) return;
    var parts = per.split(':');           // np. „s3:40"
    var el = document.getElementById(parts[0]);
    if (el) el.setAttribute('data-evk-bg', parts[1]);
  })();
</script>
<script src="../../assets/js/bg-shift.js"></script>
<script>
  // Odwzorowanie updateTheme() z includes/93-darkmode.php
  window.__setTheme = function (mode) {
    var h = document.documentElement;
    h.setAttribute('data-theme', mode);
    if (mode === 'dark') h.classList.add('dark'); else h.classList.remove('dark');
    document.dispatchEvent(new CustomEvent('evk:theme-change', { detail: { mode: mode } }));
  };

  /** Kolor liter: zmienna na <html> i to, co realnie widać na sekcjach.
   *
   *  Mierzymy OBA, bo każde z osobna kłamie: sama zmienna nie mówi, czy
   *  dotarła do sekcji (a zasięg jest tu połową funkcji), a sam kolor sekcji
   *  nie odróżnia „silnik ustawił" od „tak było w arkuszu". */
  window.__text = function () {
    var cs = function (id) { return getComputedStyle(document.getElementById(id)).color; };
    return {
      zmienna: getComputedStyle(document.documentElement).getPropertyValue('--evk-bg-text').trim(),
      s1: cs('s1'), s3: cs('s3'), s4: cs('s4'), s5: cs('s5'),
      wlasny:  cs('own'),
      furtka:  cs('own-follow'),
    };
  };
  window.__m = function () {
    var l = document.querySelector('.evk-bg-layer');
    var cs = l && getComputedStyle(l);
    return {
      exists: !!l, color: cs ? cs.backgroundColor : null,
      pos: cs ? cs.position : null, z: cs ? cs.zIndex : null,
      firstChild: l ? document.body.firstElementChild === l : false,
      handoff: ['s1','s2','s3','s4','s5'].map(function (id) {
        return document.getElementById(id).classList.contains('evk-bg-handoff');
      }),
    };
  };
</script>
