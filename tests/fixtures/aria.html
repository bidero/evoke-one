<!-- ?mode=sr|anim-one|anim-many -->
<div id="host"></div>
<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../assets/vendor/gsap/SplitText.min.js"></script>
<script>
  var mode = new URLSearchParams(location.search).get('mode') || 'sr';
  var RICH = '<h2>Projektujemy</h2><p>Robimy strony i <a href="/x">piszemy o tym</a>.</p>';
  var host = document.getElementById('host');

  if (mode === 'sr') {
    host.innerHTML = '<div class="evk-scroll-reading" data-evk-sr=\'' + JSON.stringify({
      colorActive: 'rgb(0, 0, 0)', colorDim: 'rgb(187, 187, 187)',
      splitType: 'words', start: 'top 90%', end: 'bottom 20%', scrub: 1, stagger: 0.05,
    }) + '\'>' + RICH + '</div>';
  } else {
    window.evkAnimator = {
      library: { split: { slug: 'split', preset: 'split-lines', trigger: 'viewport',
                          duration: 0.8, easing: 'power2.out' } },
      presets: { 'split-lines': { split: 'lines', from: { opacity: 0, y: 20 },
                                  to: { opacity: 1, y: 0 }, stagger: 0.08 } },
      reducedMotion: false, needsFonts: false,
    };
    host.innerHTML = mode === 'anim-one'
      ? '<h2 class="evk-anim-split">Projektujemy strony i piszemy o tym po polsku</h2>'
      : '<div class="evk-anim-split">' + RICH + '</div>';
  }

  var css = document.createElement('link');
  css.rel = 'stylesheet';
  css.href = '../../includes/bricks-elements/evoke-scroll-reading/assets/scroll-reading.css';
  document.head.appendChild(css);

  var js = document.createElement('script');
  js.src = mode === 'sr'
    ? '../../includes/bricks-elements/evoke-scroll-reading/assets/scroll-reading.js'
    : '../../assets/js/animator.js';
  document.body.appendChild(js);
</script>
