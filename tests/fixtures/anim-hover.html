<!--
  Animator — wyzwalacz najechania.

  Zgłoszone z użycia: „chciałbym użyć niektórych predefiniowanych animacji, ale
  większość powoduje, że element jest niewidoczny przed hover". Powodem było
  `fromTo` w ścieżce interaktywnej: renderuje stan początkowy natychmiast,
  a `from` presetu WEJŚCIOWEGO to stan ukryty.

  Dlatego na stronie stoją obok siebie trzy rodzaje: preset wejściowy pod
  hoverem (usterka), preset stanowy pod hoverem (rozwiązanie) i preset wejściowy
  pod wejściem w kadr (kontrola negatywna — tam parkowanie MA zostać).

  Biblioteka presetów wstrzykiwana jest z PHP przez `head` (patrz
  tests/php/presets.php), a nie przepisana tutaj — kopia zaczęłaby żyć własnym
  życiem i test przestałby sprawdzać to, co realnie jedzie na front.
-->
<style>
  body { margin: 0; font: 16px system-ui; }
  div[id] { padding: 14px; background: #234; color: #fff; }
  /* Kontrola negatywna musi startować POZA kadrem, inaczej ScrollTrigger
     rozstrzygnie ją przy pierwszym odświeżeniu i parkowania nie zobaczymy. */
  .spacer { height: 1400px; }
</style>

<div id="wejsciowy" data-evk-anim='{"animation":"wej"}'>PRESET WEJŚCIOWY NA HOVERZE</div>
<div id="stanowy"   data-evk-anim='{"animation":"stan"}'>PRESET STANOWY NA HOVERZE</div>
<div id="tekstowy"  data-evk-anim='{"animation":"tekst"}'>tekstowy</div>
<div id="stanwkadrze" data-evk-anim='{"animation":"stanvp"}'>STANOWY POD WEJŚCIEM W KADR</div>
<div class="spacer"></div>
<div id="kontrola"  data-evk-anim='{"animation":"kontrola"}'>KONTROLA — WEJŚCIE W KADR</div>

<!-- Miejsce na treść wstawianą PO STARCIE — odwzorowanie tego, co robi filtr
     pętli zapytania w Bricksie: wymienia zawartość kontenera na świeży znacznik
     z serwera. Elementy stąd nigdy nie przeszły `initAll()` przy wczytaniu. -->
<div id="pojemnik"></div>

<!-- Podkreślenie: preset STANOWY, którego `from` nadaje gradient tła. Bez
     nałożonego `from` animowałby rozmiar nieistniejącego obrazu. -->
<a id="podkreslenie" href="#" data-evk-anim='{"animation":"podkr"}'>Podkreślenie</a>

<!-- Ikona pojawiająca się na najechaniu NA PRZYCISK. Animacja siedzi na
     przycisku, a rusza się `svg` w środku — wyzwalacz i cel są w silniku
     rozdzielone od początku. Ikona ma własne id tylko po to, żeby dało się
     ją zmierzyć. -->
<button id="przycisk" data-evk-anim='{"animation":"ikona"}'>Zobacz więcej<svg id="ikonka" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h10M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>

<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../assets/vendor/gsap/TextPlugin.min.js"></script>
<script>
(function () {
  var row = function (preset, trigger) {
    return { preset: preset, trigger: trigger, duration: 0.5, delay: 0,
             stagger: 0, easing: 'power2.out', order: 0 };
  };
  window.evkAnimator = {
    library: {
      wej:      row('fade-up',     'hover'),
      stan:     row('hover-scale', 'hover'),
      tekst:    row('typewriter',  'hover'),
      stanvp:   row('hover-dim',   'viewport'),
      kontrola: row('fade-up',     'viewport'),
      podkr:    row('underline-sweep', 'hover'),
      // Cel inny niż wyzwalacz: najechanie na przycisk, ruch ikony w środku.
      ikona:    Object.assign(row('hover-icon-right', 'hover'),
                              { targets: 'selector', selector: 'svg', duration: 0.3 }),
    },
    // Prawdziwa tablica presetów, wstrzyknięta przez `head` z PHP.
    presets: (window.__presets && window.__presets.presets) || {},
    reducedMotion: false,
    needsFonts: false,
  };
})();
</script>
<script src="../../assets/js/animator.js"></script>
<script>
  /**
   * Podmiana treści kontenera — tak samo, jak robi to filtr pętli zapytania.
   *
   * `innerHTML`, nie `appendChild`: filtr wymienia CAŁĄ zawartość, więc stare
   * węzły znikają razem ze swoimi nasłuchami, a nowe przychodzą bez niczego.
   */
  window.__podmien = function (ile) {
    var html = '';
    for (var i = 0; i < (ile || 1); i++) {
      html += '<div id="nowy' + i + '" data-evk-anim=\'{"animation":"stan"}\'>NOWY ' + i + '</div>';
    }
    document.getElementById('pojemnik').innerHTML = html;
  };

  /** Tło elementu — do presetów rysujących gradientem (podkreślenie). */
  window.__tlo = function (id) {
    var cs = getComputedStyle(document.getElementById(id));
    return { obraz: cs.backgroundImage, rozmiar: cs.backgroundSize };
  };

  /** Szerokość elementu — do sprawdzenia, czy układ nie skacze przy najechaniu. */
  window.__szer = function (id) {
    return Math.round(document.getElementById(id).getBoundingClientRect().width * 100) / 100;
  };

  /** Ile węzłów silnika jest na stronie — do wykrycia zapętlenia obserwatora. */
  window.__wezly = function () {
    return {
      wszystkie: document.querySelectorAll('[class*="evk-anim-"], [data-evk-anim]').length,
      gotowe:    document.querySelectorAll('[data-evk-anim-ready="1"]').length,
    };
  };

  window.__stan = function (id) {
    var el = document.getElementById(id);
    var cs = getComputedStyle(el);
    return {
      opacity:   +parseFloat(cs.opacity).toFixed(3),
      transform: cs.transform,
      text:      el.textContent,
    };
  };

  /* Najechanie i zjechanie zdarzeniem, nie kursorem: silnik słucha
     mouseenter/mouseleave wprost na elemencie, a pięć pudełek naraz nie da się
     objechać jednym wskaźnikiem. */
  window.__najedz = function (id) {
    document.getElementById(id).dispatchEvent(new MouseEvent('mouseenter', { bubbles: false }));
  };
  window.__zjedz = function (id) {
    document.getElementById(id).dispatchEvent(new MouseEvent('mouseleave', { bubbles: false }));
  };

  /** Czy silnik dokończył to, co zaczął — patrz komentarz w presets.html. */
  window.__bezRuchu = function () {
    if (!window.gsap) return true;
    return !gsap.globalTimeline.getChildren(true, true, false)
      .some(function (t) { return t.isActive(); });
  };
</script>
