<!--
  Lista snippetów W PRAWDZIWEJ POWŁOCE PANELU.

  Dwa wstrzyknięcia, oba z PHP wtyczki, żadnego znacznika przepisanego tutaj:

    window.__panel  — `evoke_one_render_settings()` dla zakładki Narzędzia,
                      czyli pasek boczny, nagłówek i karta treści;
    window.__tresc  — `evk_snippets_render_tab()` z tests/php/tab.php.

  Treść ląduje w `.evo-panel`, bo o to właśnie chodzi w tym sprawdzeniu:
  tabela dostaje dokładnie tyle miejsca, ile zostaje po pasku bocznym
  (236 px) i marginesach karty. Zmierzona w gołym `<body>` mieściłaby się
  zawsze — i sprawdzenie nie zauważyłoby usterki, dla której powstało.
-->
<meta charset="utf-8">
<link rel="stylesheet" href="../../assets/admin/admin.css">
<style>
  /* Namiastka otoczki wp-admin — panel siedzi w niej na żywo. */
  body { margin: 0; background: #f0f0f1; font: 13px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif; }
  #wpbody-content { padding: 0; }

  /* Arkuszy wp-admin w repozytorium nie ma, więc reguł rdzenia dla
     `.wp-list-table` tutaj nie widać. Nieobecności tej klasy w znaczniku
     pilnuje osobne sprawdzenie w tests/snippety.test.js — odtwarzanie tu
     cudzego CSS-u dawałoby tylko złudzenie pokrycia. */
</style>

<div id="wpbody-content"></div>

<script>
  document.getElementById('wpbody-content').innerHTML = window.__panel || '';
  var panel = document.querySelector('.evo-panel');
  if (panel) panel.innerHTML = window.__tresc || '';
</script>
<script src="../../node_modules/jquery/dist/jquery.min.js"></script>
<script src="../../assets/admin/admin.js"></script>
<script>
  /** Czy tabela mieści się w karcie i ile miejsca zostaje kolumnie „Nazwa". */
  window.__tabela = function () {
    var tbl = document.querySelector('.evo-snippety-tbl');
    var box = document.querySelector('.evo-panel');
    if (!tbl || !box) return null;

    var t = tbl.getBoundingClientRect();
    var s = getComputedStyle(box);
    var b = box.getBoundingClientRect();
    /* Prawa krawędź TREŚCI karty, nie jej ramki — padding to nie miejsce
       dla tabeli. */
    var prawaTresci = b.right - parseFloat(s.paddingRight);

    var naglowki = Array.prototype.slice.call(tbl.querySelectorAll('thead th'))
      .map(function (th) {
        return { tekst: th.textContent.trim(), szer: Math.round(th.getBoundingClientRect().width) };
      });

    return {
      prawaTabeli:  Math.round(t.right),
      prawaTresci:  Math.round(prawaTresci),
      szerTabeli:   Math.round(t.width),
      naglowki:     naglowki,
      // Poziome przewijanie strony to objaw rozpychania, nie mieszczenia się.
      stronaPrzewija: document.documentElement.scrollWidth > document.documentElement.clientWidth,
    };
  };

  /** Układ listy na wąskim ekranie: karta na wpis, podpisy przy wartościach. */
  window.__mobil = function () {
    var tbl = document.querySelector('.evo-snippety-tbl');
    if (!tbl) return null;
    var wiersz = tbl.querySelector('tbody tr');
    var st = getComputedStyle(wiersz);
    var r = wiersz.getBoundingClientRect();

    var podpisy = Array.prototype.slice.call(wiersz.querySelectorAll('td'))
      .map(function (td) {
        var c = getComputedStyle(td, '::before').content;
        return (c === 'none' || c === 'normal') ? '' : c.replace(/^"|"$/g, '').trim();
      })
      .filter(Boolean);

    var przelacznik = wiersz.querySelector('.evo-switch');
    var pr = przelacznik ? przelacznik.getBoundingClientRect() : null;

    /* Przełącznik: kształt osobno, pole trafienia osobno. Nakładka `::after`
       ma rozszerzać obszar klikalny bez ruszania wymiarów samego elementu. */
    var po = przelacznik ? getComputedStyle(przelacznik, '::after') : null;
    /* Bez nakładki `content` jest `none`, a `top` bywa `auto` — wtedy pole
       trafienia równa się samemu przełącznikowi, i tak ma to zostać zgłoszone
       liczbą, a nie NaN-em. */
    var dotyk = (po && po.content !== 'none') ? {
      gora: Math.abs(parseFloat(po.top))  || 0,
      bok:  Math.abs(parseFloat(po.left)) || 0,
    } : { gora: 0, bok: 0 };

    return {
      naglowekWidoczny: getComputedStyle(tbl.querySelector('thead')).display !== 'none',
      // Ramka tabeli obrysowywałaby wszystkie karty naraz — na wąskim ekranie ma jej nie być.
      ramkaTabeli:  Math.round(parseFloat(getComputedStyle(tbl).borderTopWidth)),
      przelacznik:  pr ? { szer: Math.round(pr.width), wys: Math.round(pr.height) } : null,
      poleDotyku:   pr ? Math.round(pr.height + 2 * dotyk.gora) : 0,
      wierszBlokiem:    st.display === 'block',
      ramkaWiersza:     Math.round(parseFloat(st.borderTopWidth)),
      podpisy:          podpisy,
      // Przełącznik ma siedzieć w lewym górnym rogu karty, a nie w słupku treści.
      przelacznikWRogu: !!pr && (pr.left - r.left) < 30 && (pr.top - r.top) < 30,
      stronaPrzewija:   document.documentElement.scrollWidth > document.documentElement.clientWidth,
      // Kolumny na całą szerokość karty — nic nie wystaje poza jej treść.
      poza: Array.prototype.slice.call(wiersz.querySelectorAll('td'))
        .filter(function (td) { return td.getBoundingClientRect().right > r.right + 1; }).length,
    };
  };

  /** Przycisk po napisie: wysokość i odchylenie napisu od środka w pionie. */
  window.__przycisk = function (poczatek) {
    var el = Array.prototype.slice.call(document.querySelectorAll('.evo-panel a, .evo-panel button'))
      .filter(function (b) { return b.textContent.trim().indexOf(poczatek) === 0; })[0];
    if (!el) return null;
    var r = el.getBoundingClientRect();
    /* Pudełko SAMEGO NAPISU, nie elementu — to ono jeździło do góry, gdy
       `min-height` rozciągało przycisk, a nic nie centrowało treści. */
    var z = document.createRange();
    z.selectNodeContents(el);
    var t = z.getBoundingClientRect();
    return {
      wys:        Math.round(r.height),
      szer:       Math.round(r.width),
      odchylenie: Math.round(Math.abs((t.top + t.height / 2) - (r.top + r.height / 2))),
    };
  };

  /** Co naprawdę dostanie kliknięcie w danym punkcie karty. */
  window.__celKlikniecia = function () {
    var wiersz = document.querySelector('.evo-snippety-tbl tbody tr');
    var r = wiersz.getBoundingClientRect();
    var nazwij = function (el) {
      if (!el) return 'nic';
      if (el.closest('.evo-switch'))     return 'przełącznik';
      if (el.closest('.evo-btn-remove')) return 'kosz';
      if (el.closest('.evo-col-nazwa'))  return 'edycja';
      return el.tagName.toLowerCase() + '.' + (el.className || '');
    };
    var prz = wiersz.querySelector('.evo-switch').getBoundingClientRect();
    var kosz = wiersz.querySelector('.evo-btn-remove').getBoundingClientRect();
    return {
      /* Punkt w komórce „Grupa" — treść karty z dala od przełącznika i kosza.
         Prawa część tej komórki jest pusta, więc trafia w nakładkę odnośnika,
         a nie w sam napis. */
      pusteMiejsce: (function () {
        var g = wiersz.querySelector('[data-etykieta="Grupa"]').getBoundingClientRect();
        return nazwij(document.elementFromPoint(g.right - 20, g.top + g.height / 2));
      })(),
      naPrzelaczniku: nazwij(document.elementFromPoint(prz.left + prz.width / 2, prz.top + prz.height / 2)),
      naKoszu:        nazwij(document.elementFromPoint(kosz.left + kosz.width / 2, kosz.top + kosz.height / 2)),
    };
  };

  /** Wysokość odnośnika powrotu wobec pigułek widoków. */
  window.__powrot = function () {
    var back = document.querySelector('.evo-viewtab-back');
    /* Pierwsza pigułka, która NIE jest powrotem — porównujemy z widokiem. */
    var pig  = document.querySelector('.evo-viewtab:not(.evo-viewtab-back)');
    if (!back || !pig) return null;
    var b = back.getBoundingClientRect(), p = pig.getBoundingClientRect();
    return { powrot: Math.round(b.height), pigulka: Math.round(p.height),
             wJednejLinii: Math.abs(b.top - p.top) < 4 };
  };

  /** Czy cokolwiek w logach wyjeżdża poza kartę wpisu albo poza panel. */
  window.__logi = function () {
    var box = document.querySelector('.evo-panel');
    var karta = document.querySelector('.evo-log');
    if (!box || !karta) return null;
    var s = getComputedStyle(box);
    var b = box.getBoundingClientRect();
    var prawaTresci = b.right - parseFloat(s.paddingRight);
    var k = karta.getBoundingClientRect();

    var poza = Array.prototype.slice.call(karta.querySelectorAll('*'))
      .filter(function (el) { return el.getBoundingClientRect().right > k.right + 1; })
      .map(function (el) { return el.className || el.tagName; });

    var kod = karta.querySelector('.evo-log-kod');
    return {
      kartaWKarcie:   Math.round(k.right) <= Math.round(prawaTresci) + 1,
      prawaKarty:     Math.round(k.right),
      prawaTresci:    Math.round(prawaTresci),
      pozaKarta:      poza,
      // Kod ma przewijać się W SOBIE, a nie rozpychać kartę.
      kodPrzewija:    !!kod && kod.scrollWidth > kod.clientWidth,
      stronaPrzewija: document.documentElement.scrollWidth > document.documentElement.clientWidth,
    };
  };

  /** Wygląd przycisku usuwania — do porównania między ekranami. */
  window.__kosz = function () {
    var el = document.querySelector('.evo-btn-remove');
    if (!el) return null;
    var s = getComputedStyle(el);
    var r = el.getBoundingClientRect();
    return {
      wys:    Math.round(r.height),
      ramka:  Math.round(parseFloat(s.borderTopWidth)),
      tlo:    s.backgroundColor,
      kolor:  s.color,
      promien: s.borderTopLeftRadius,
    };
  };

  /** Szerokości pól w siatce edytora. */
  window.__pola = function () {
    var siatka = document.querySelector('.evo-pola-rowne');
    if (!siatka) return null;
    return Array.prototype.slice.call(siatka.querySelectorAll('input[type=text], input[type=number], select'))
      .map(function (el) {
        var r = el.getBoundingClientRect();
        var pole = el.closest('.evo-field');
        return {
          nazwa: pole ? pole.querySelector('label').textContent.trim() : '?',
          szer:  Math.round(r.width),
          // Szerokość slotu siatki, w którym pole siedzi.
          slot:  pole ? Math.round(pole.getBoundingClientRect().width) : 0,
        };
      });
  };

  /** Wysokości kart wyboru stojących obok siebie. */
  window.__karty = function () {
    var rzad = document.querySelector('.evo-toolbar-top');
    if (!rzad) return null;
    /* Grupujemy po NAKŁADANIU SIĘ W PIONIE, nie po równym „top".
       Równy „top" wygląda na oczywisty klucz i jest pułapką: dopóki karty nie
       są rozciągnięte, rząd centruje je w pionie, więc wyższa karta zaczyna się
       WYŻEJ od sąsiadek. Grupowanie po „top" rozbijało wtedy jedną linię na
       dwie grupy — każda wewnętrznie równa — i sprawdzenie świeciło na zielono
       dokładnie w przypadku, dla którego powstało. */
    var karty = Array.prototype.slice.call(rzad.querySelectorAll(':scope > .evo-choice'))
      .map(function (el) {
        var r = el.getBoundingClientRect();
        return { gora: r.top, dol: r.bottom, wys: Math.round(r.height) };
      })
      .sort(function (a, b) { return a.gora - b.gora; });

    var linie = [];
    karty.forEach(function (k) {
      var linia = linie[linie.length - 1];
      // Nachodzą na siebie w pionie = stoją obok siebie.
      if (linia && k.gora < linia.dol - 1) {
        linia.karty.push(k.wys);
        linia.dol = Math.max(linia.dol, k.dol);
      } else {
        linie.push({ dol: k.dol, karty: [k.wys] });
      }
    });
    return linie.map(function (l) { return l.karty; });
  };

  /** Wymiary i barwa przełącznika w pierwszym i drugim wierszu. */
  window.__przelaczniki = function () {
    return Array.prototype.slice.call(document.querySelectorAll('.evo-switch'))
      .map(function (el) {
        var r = el.getBoundingClientRect();
        var g = el.querySelector('.evo-switch-knob');
        var st = getComputedStyle(g);
        return {
          znacznik: el.tagName,
          wlaczony: el.classList.contains('is-on'),
          aria:     el.getAttribute('aria-checked'),
          szer:     Math.round(r.width),
          wys:      Math.round(r.height),
          tlo:      getComputedStyle(el).backgroundColor,
          // Przesunięcie gałki: macierz `matrix(1,0,0,1,X,0)` albo `none`.
          przesuniecie: st.transform === 'none' ? 0
            : Math.round(parseFloat((st.transform.match(/[-\d.]+/g) || [0,0,0,0,0])[4])),
        };
      });
  };
</script>
