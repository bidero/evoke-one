<!--
  Animacja PO przypiętej sekcji.

  Przypięcie zmienia położenia wszystkiego pod sobą: ScrollTrigger wstawia
  zapas o wysokości sekcji plus całą drogę taśmy. Wyzwalacz policzony ZANIM pin
  się założył ma punkt startu ze starego układu — za mały o tę drogę — więc
  odpala, zanim element wjedzie w kadr.

  Animator ładuje się TU PRZED hscrollem, czyli w kolejności niekorzystnej.
  W odwrotnej błąd nie ma jak wyjść i sprawdzenie świeciłoby na zielono
  z powodu, który z niego nie wynika.
-->
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px system-ui; }
  .przed { height: 900px; background: #eee; }
  .sekcja { background: #4c1d95; color: #fff; padding: 20px 0; }
  .karta { width: 500px; height: 260px; margin-right: 24px;
           background: rgba(255, 255, 255, .12); padding: 16px; }
  .po  { height: 300px; background: #ddd; }
  #cel, #daleko { height: 200px; background: #345; color: #fff; }
  .ogon { height: 1500px; background: #eee; }
</style>

<link rel="stylesheet" href="../../includes/bricks-elements/evoke-horizontal-scroll/assets/hscroll.css">

<div class="przed">treść przed sekcją</div>

<section class="sekcja" id="sekcja-1">
  <div class="evk-hscroll" id="hs-1">
    <div class="evk-hscroll__track">
      <div class="karta">01</div>
      <div class="karta">02</div>
      <div class="karta">03</div>
      <div class="karta">04</div>
    </div>
  </div>
</section>

<div class="po">tuż pod sekcją</div>
<div id="cel">CEL — ANIMACJA W KADRZE</div>
<div class="ogon"></div>
<!-- Element, którego punkt startu i tak wypada ZA przypięciem — dociąganie ma
     go nie ruszać. Bez niego „dociągamy do końca pinu" byłoby prawdą także
     wtedy, gdyby dociągało wszystko jak leci. -->
<div id="daleko">DALEKO — MA ZOSTAĆ NIETKNIĘTY</div>
<div class="ogon"></div>

<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>

<script>
/* `top 100%` daje arytmetykę bez reszty: punkt startu ma wyjść dokładnie
   „pozycja elementu w dokumencie minus wysokość okna". Każda inna wartość
   wnosiłaby procent do porównania i rozmywała pomiar. */
window.evkAnimator = {
  library: {
    wkadrze: { slug: 'wkadrze', preset: 'fade-up', trigger: 'viewport',
               duration: 0.4, delay: 0, stagger: 0, easing: 'none', order: 0,
               start: 'top 100%', targets: 'self', selector: '', pin: 0 },
  },
  /* Preset BEZ przesunięcia — sama przezroczystość.
     `y` w stanie początkowym sam zniekształca prostokąt mierzony przez
     ScrollTriggera i wnosiłby do porównania czterdzieści pikseli, których ten
     test nie bada. Tu chodzi o zniekształcenie przez PODGLĄD, więc reszta ma
     być czysta. */
  presets: { 'fade-up': { from: { opacity: 0 }, to: { opacity: 1 }, duration: 0.4 } },
  reducedMotion: false, needsFonts: false,
};
document.getElementById('cel').setAttribute('data-evk-anim', 'wkadrze');
document.getElementById('daleko').setAttribute('data-evk-anim', 'wkadrze');

/* `start=` podmienia zapis punktu startu — do sprawdzenia, że zapisu, którego
   nie rozpoznajemy, dociąganie NIE RUSZA. */
(function () {
  var wlasny = new URLSearchParams(location.search).get('start');
  if (wlasny) window.evkAnimator.library.wkadrze.start = wlasny;
})();
</script>

<!-- ANIMATOR PRZED HSCROLLEM — patrz komentarz na górze. -->
<script src="../../assets/js/animator.js"></script>

<script>
/* `peek=1` włącza podgląd treści pod sekcją (1.105.0). To ON przesuwa
   rodzeństwo za zapasem transformacją — a `getBoundingClientRect()`, którym
   ScrollTrigger mierzy pozycje, transformację WLICZA. Bez tego parametru
   sprawdzenie biegłoby w jedynej konfiguracji, w której błędu nie ma. */
document.getElementById('hs-1').setAttribute('data-evk-hscroll', JSON.stringify({
  widthMode: 'auto', pinTarget: 'selector', pinSelector: '.sekcja',
  scrub: 0, startOffset: 'top top', snap: false, disableBelow: 0,
  progressBar: false,
  peekNext: new URLSearchParams(location.search).get('peek') === '1',
}));
</script>
<script src="../../includes/bricks-elements/evoke-horizontal-scroll/assets/hscroll.js"></script>

<script>
/**
 * Punkt startu wyzwalacza CELU wobec jego prawdziwej pozycji w dokumencie.
 *
 * Mierzone z `ScrollTrigger.getAll()`, a nie z tego, czy animacja zagrała:
 * różnica jest tu liczbą, a „zagrała za wcześnie" trzeba by dopiero łapać
 * w odpowiedniej klatce.
 */
/**
 * Prawdziwa pozycja w dokumencie — z łańcucha `offsetTop`, NIE z prostokąta.
 *
 * `getBoundingClientRect()` wlicza transformację, a podgląd treści właśnie
 * transformacją przesuwa rodzeństwo pod przypięciem. Prostokątem mierzona
 * „prawdziwa pozycja" byłaby przesunięta dokładnie tak samo jak punkt startu
 * wyzwalacza — i sprawdzenie przechodziłoby PUSTO, porównując dwie zniekształcone
 * liczby. `offsetTop` liczy się z układu i transformacji nie widzi.
 */
function pozycjaUkladu(el) {
  var y = 0;
  for (var n = el; n; n = n.offsetParent) y += n.offsetTop;
  return Math.round(y);
}

window.__cel = function () {
  var cel = document.getElementById('cel');
  var doc = pozycjaUkladu(cel);
  var st  = ScrollTrigger.getAll().filter(function (t) { return t.trigger === cel; })[0];
  var hs  = ScrollTrigger.getAll().filter(function (t) { return t.pin; })[0];

  return {
    pozycjaWDokumencie: doc,
    // `top 100%` znaczy „górna krawędź dochodzi do dolnej krawędzi okna".
    oczekiwanyStart: doc - window.innerHeight,
    start:  st ? Math.round(st.start) : null,
    droga:  hs ? Math.round(hs.end - hs.start) : null,
    // Przezroczystość celu — do sprawdzenia, czy animacja już zagrała.
    opacity: +parseFloat(getComputedStyle(cel).opacity).toFixed(2),
    // Czy podgląd naprawdę przesuwa treść. Bez tego „punkt startu się zgadza"
    // byłoby prawdą także wtedy, gdyby podgląd w ogóle nie zadziałał.
    przesuniecie: getComputedStyle(document.querySelector('.po')).transform,

    // Przypięcie i element daleko w dole — do sprawdzenia, co dociągnięte,
    // a co nietknięte.
    pinKoniec: (function () {
      var t = ScrollTrigger.getAll().filter(function (x) { return x.pin; })[0];
      return t ? Math.round(t.end) : null;
    })(),
    startDaleko: (function () {
      var d = document.getElementById('daleko');
      var t = ScrollTrigger.getAll().filter(function (x) { return x.trigger === d; })[0];
      return t ? Math.round(t.start) : null;
    })(),
    pozycjaDaleko: pozycjaUkladu(document.getElementById('daleko')),
  };
};

window.__doPozycji = function (y) { window.scrollTo(0, y); };
window.__gdzieSekcja = function () {
  var s = document.getElementById('sekcja-1');
  return Math.round(s.getBoundingClientRect().top + window.scrollY);
};
</script>
