<script>
  var q = new URLSearchParams(location.search);
  // Bricks wystawia tę zmienną na stronie; JS elementu rozpoznaje po niej builder.
  /* `builder=1` udaje kanwę buildera. Bricks ustawia tam tę flagę na fałsz
     i sam woła evk_circular_menu_init() — na froncie robi to nasz własny
     nasłuch na DOMContentLoaded, który przy tej fladze celowo odpuszcza.
     Bez tego przełącznika nie da się zmierzyć ANI JEDNEJ z dwóch stron
     zachowania „otwórz w builderze": widać by było tylko front. */
  window.bricksIsFrontend = q.get('builder') !== '1';
</script>

<div id="root" class="evk-cm">
  <!-- Trigger jest OPAKOWANIEM przycisku, nie przyciskiem: element szuka
       `button` w środku `.evk-cm-trigger` i to jemu przestawia aria-expanded. -->
  <div class="evk-cm-trigger" id="tw">
    <button class="burger" id="trigger">Menu</button>
  </div>

  <div class="evk-cm-content" id="panel">
    <a href="#a" id="anim" data-evk-anim='{"animation":"wjazd","trigger":"viewport"}'>Wjeżdża</a>
    <!-- Element z DWIEMA animacjami: wejściową i własną wyjściową. Na nim widać
         różnicę między „cofnij wejście" a „zagraj preset zamknięcia" — cofnięcie
         nie rusza osi X, więc przesunięcie w bok jest dowodem, że zagrał preset. -->
    <a href="#b" id="oba"
       data-evk-anim='[{"animation":"wjazd","trigger":"viewport"},{"animation":"wyjazd","trigger":"menu-close"}]'>Własne wyjście</a>
    <a href="#c" id="zwykly">Bez animacji</a>
  </div>
</div>

<!-- Zewnętrzny przełącznik: selektor celuje WPROST w przycisk, nie w opakowanie.
     Tak zwykle wygląda burger zbudowany osobno w nagłówku — i tą drogą element
     nie robił wcześniej NIC, bo szukał `button` w środku przycisku. -->
<button class="brxe-toggle moj-burger" id="zew">Burger z nagłówka</button>

<!-- I druga postać: selektor na OPAKOWANIU. Obie muszą działać. -->
<div class="moje-opakowanie" id="zew-wrap"><button class="inny-burger" id="zew-btn">W pudełku</button></div>

<!-- Trzecia, i to ta z żywej strony: burger BRICKSA nie jest przyciskiem,
     tylko divem bez roli. Arkusz Bricksa z animacją kresek wisi na
     `.brxe-toggle`, więc klasa musi trafić TAM, a nie na opakowanie. -->
<div class="pudlo-bricks" id="zew-bricks-wrap">
  <div class="brxe-toggle" id="zew-bricks"><span class="kreska"></span></div>
</div>

<!-- Nagłówek dokładnie jak w zgłoszeniu: w <body>, NIE fixed i NIE absolute,
     ale tworzy KONTEKST UKŁADANIA (position: relative z własnym z-index).
     Wszystko w środku jest wtedy zamknięte w tej jednej warstwie — z panelem
     rywalizuje cały nagłówek, a nie jego dzieci. Dlatego przełącznik dostaje
     tu absurdalnie wysoki z-index: żeby było widać, że to NIE liczba decyduje.
     Obok stoi sąsiad, po którym poznamy, czy nagłówek się nie przebudował. -->
<!-- Rozmiar i przejście NA IDENTYFIKATORZE, a nie w atrybucie `style` — tak
     stylizuje elementy Bricks. To rozróżnienie jest tu sednem: styl wpisany
     wprost w atrybut jedzie z kopią przekładki sam z siebie, więc przekładka
     bez identyfikatora wyglądałaby na sprawną. Reguła po identyfikatorze jej
     NIE dotyczy i dopiero to obnaża zapadnięcie pudełka. -->
<style>
  #zew-naglowek { width: 44px; height: 44px; padding: 10px; font-size: 20px;
                  background: rgb(255, 0, 0);
                  transition: background-color .4s linear; }
  #zew-naglowek.brx-open { background: rgb(0, 0, 255); }
</style>
<header id="naglowek" style="position:relative;z-index:1;background:#eee;padding:10px">
  <button class="brxe-toggle w-naglowku" id="zew-naglowek"
          style="position:relative;z-index:99999">Menu</button>
  <span id="sasiad" style="display:inline-block;width:60px;height:20px;background:#999"></span>
</header>

<script>
  var root = document.getElementById('root');
  root.setAttribute('data-portal',        q.get('portal') === '0' ? '0' : '1');
  root.setAttribute('data-duration',      q.get('dur')    || '0.4');
  root.setAttribute('data-easing',        q.get('ease')   || 'none');
  root.setAttribute('data-content-delay', q.get('cdelay') || '0');
  root.setAttribute('data-anim-exit',     q.get('exit')   === '1' ? '1' : '0');
  // Puste = „cały czas animacji". Jawne zero MUSI przejść jako '0'.
  root.setAttribute('data-exit-wait',     q.get('exitwait') === null ? '' : q.get('exitwait'));
  root.setAttribute('data-customtoggle',  q.get('toggle') || '');
  root.setAttribute('data-toggle-class',  q.get('tclass') || '');
  /* Blokada przewijania parametrem, bo od 1.94.0 jest co mierzyć: do tej wersji
     element ustawiał atrybut, którego nie czytała żadna reguła CSS, więc
     „blokuje" nie dało się odróżnić od „nie blokuje". */
  root.setAttribute('data-lock-scroll',   q.get('lock') === '1' ? '1' : '0');
  root.setAttribute('data-raise-toggle',  q.get('raise')  === '1' ? '1' : '0');
  // Co dokładnie ma stanąć nad panelem: 'przelacznik' (domyślnie), 'wskazane',
  // 'naglowek'. Puste zostawiamy puste, żeby domyślna wartość jechała z kodu
  // elementu, a nie z fixture'a.
  root.setAttribute('data-raise-mode',     q.get('raisemode') || '');
  root.setAttribute('data-raise-selector', q.get('raisesel')  || '');
  root.setAttribute('data-open-builder',  q.get('ob') === '1' ? '1' : '0');
  root.setAttribute('data-close-on-esc',  q.get('esc')    === '0' ? '0' : '1');
</script>

<script>
var panel = function () { return document.getElementById('panel'); };

window.__open  = function () { document.getElementById('trigger').click(); };
window.__key   = function (key) {
  document.dispatchEvent(new KeyboardEvent('keydown', { key: key, bubbles: true, cancelable: true }));
};
window.__aria  = function () { return document.getElementById('trigger').getAttribute('aria-expanded'); };
window.__opened = function () { return document.getElementById('trigger').classList.contains('burger--opened'); };

/** Klik w zewnętrzny przełącznik — ten wskazany selektorem `data-customtoggle`. */
window.__zew     = function (id) { document.getElementById(id || 'zew').click(); };

/**
 * Stan przełącznika o podanym ID: klasy i aria.
 *
 * `brx-open` to klasa, na której wisi cała animacja burgera zbudowanego
 * w Bricksie. Bez niej przycisk zostaje burgerem przy otwartym menu.
 */
window.__stanPrzycisku = function (id) {
  var el = document.getElementById(id);
  return {
    klasy: el.className,
    brx:   el.classList.contains('brx-open'),
    // Konwencja samych burgerów — na niej stoi większość animacji kresek.
    act:   el.classList.contains('is-active'),
    aria:  el.getAttribute('aria-expanded'),
  };
};

/** Gdzie wylądował panel — portal przenosi go wprost do <body>. */
window.__panelParent = function () { return panel().parentElement.tagName.toLowerCase(); };

/**
 * Promień obcięcia panelu — jedyna miara, po której widać stan menu.
 *
 * Panel jest `position: fixed; inset: 0`, więc jego prostokąt jest ZAWSZE
 * prostokątem okna, otwarty czy zamknięty. Chowa go `clip-path: circle(0px)`,
 * a rozwija GSAP do `circle(150%)` — i to jest jedyne, co się tu naprawdę
 * rusza. Jednostki mieszają się w trakcie (px na starcie, % u celu), więc
 * zwracamy samą liczbę razem z jednostką i test porównuje po liczbie.
 */
window.__clip = function () {
  var v = getComputedStyle(panel()).clipPath || '';
  var m = v.match(/circle\(\s*([\d.]+)\s*(px|%)/);
  return { raw: v, r: m ? parseFloat(m[1]) : null, unit: m ? m[2] : null };
};

/** Czy kadr jest rozwinięty — bez zgadywania jednostki. */
window.__rozwiniety = function () {
  var c = window.__clip();
  return c.r !== null && c.r > 1;
};

window.__pe = function () { return panel().style.pointerEvents || ''; };

/** Klasa stanu na panelu — zaczep dla własnego CSS-a. */
window.__panelOpen  = function () { return panel().classList.contains('is-open'); };
window.__panelKlasy = function () { return panel().className; };

/** Stan na KORZENIU — tym językiem mówi Bricks o otwartym elemencie. */
window.__rootKlasy = function () { return document.getElementById('root').className; };

/** Czy panel niesie znacznik „odsłoń, bo builder" — nakładany WYŁĄCZNIE skryptem. */
window.__builderKlasa = function () {
  return panel().classList.contains('evk-cm-builder');
};
window.__rootBrx   = function () {
  return document.getElementById('root').classList.contains('brx-open');
};

window.__op = function (id) {
  return +parseFloat(getComputedStyle(document.getElementById(id)).opacity).toFixed(2);
};

/** Przesunięcia z macierzy transformacji — kolumna 4 to X, 5 to Y. */
function mat(id) {
  var m = getComputedStyle(document.getElementById(id)).transform;
  if (!m || m === 'none') return [0, 0];
  var p = m.replace(/^matrix\(|\)$/g, '').split(',').map(parseFloat);
  return [p[4] || 0, p[5] || 0];
}
window.__tx = function (id) { return Math.round(mat(id)[0]); };
window.__ty = function (id) { return Math.round(mat(id)[1]); };

/** Inline'owy zapis stylu — po `clearProps` transformacji tu nie ma. */
window.__inline = function (id) {
  return document.getElementById(id).getAttribute('style') || '';
};

/** Czy silnik animacji w ogóle zbudował coś na tym elemencie. */
window.__osie = function (id) {
  var el = document.getElementById(id);
  return { wejscia: (el._evkTls || []).length, wyjscia: (el._evkCloseTls || []).length };
};

/** Krzywe z listy — czy GSAP rozumie każdą z nich wprost, bez tłumaczenia. */
window.__ease = function (name) {
  var f = gsap.parseEase(name);
  return typeof f === 'function' ? +f(0.5).toFixed(4) : null;
};

/**
 * CO JEST NA WIERZCHU w środku danego elementu.
 *
 * To jest jedyny uczciwy pomiar dla „przełącznik nad panelem": pytanie brzmi,
 * w co trafi kliknięcie, a `elementFromPoint` odpowiada na nie tak samo jak
 * przeglądarka użytkownikowi. Porównywanie `z-index` niczego by nie dowiodło —
 * cała rzecz w tym, że przy kontekście układania liczba jest bez znaczenia.
 *
 * Zwracamy identyfikator elementu ALBO jego przodka, bo trafienie może wypaść
 * w dziecko przycisku (kreskę burgera), a to nadal znaczy „przełącznik".
 */
window.__naWierzchu = function (id) {
  var el = document.getElementById(id);
  var r  = el.getBoundingClientRect();
  var t  = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
  if (!t) return null;
  if (el.contains(t)) return id;
  return t.id || t.className || t.tagName;
};

/** Prostokąt elementu w kadrze — do porównań „nie drgnął". */
window.__rect = function (id) {
  var r = document.getElementById(id).getBoundingClientRect();
  return { x: Math.round(r.left), y: Math.round(r.top),
           w: Math.round(r.width), h: Math.round(r.height) };
};

/** Kolor tła — do złapania PRZEJŚCIA w locie, a nie stanu docelowego. */
window.__tlo = function (id) {
  return getComputedStyle(document.getElementById(id)).backgroundColor;
};

/** Rodzic elementu — po nim widać, czy przełącznik wrócił na miejsce. */
window.__rodzic = function (id) {
  var p = document.getElementById(id).parentElement;
  return p ? (p.id || p.tagName.toLowerCase()) : null;
};
</script>
