<style>
  body { margin: 0; font: 16px system-ui; }
  /* Wyzwalacz stoi NISKO, a cel WYSOKO i poza nim — to jest cała istota tej
     funkcji. Gdyby cel siedział w wyzwalaczu, dzisiejszy `selector` by wystarczył. */
  #gora   { height: 200px; background: #eee; }
  #cel    { height: 120px; background: #345; color: #fff; }
  #luka   { height: 1800px; }
  #wyzwalacz { height: 300px; background: #cde; }
  #ogon   { height: 1200px; }
</style>

<div id="gora">góra strony</div>
<div id="cel">CEL — animuje się, choć scroll dotyczy kogoś innego</div>
<div id="luka"></div>
<div id="wyzwalacz" data-evk-anim='{"animation":"zewn","trigger":"viewport","targets":"external","selector":"#cel"}'>
  WYZWALACZ
</div>
<div id="ogon"></div>

<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script>
  // Odwzorowanie payloadu z includes/anim/animator.php
  window.evkAnimator = {
    library: { zewn: { slug: 'zewn', preset: 'fade', trigger: 'viewport',
                       duration: 0.4, delay: 0, stagger: 0, easing: 'power2.out', order: 0 } },
    presets: { fade: { from: { opacity: 0 }, to: { opacity: 1 }, duration: 0.4 } },
    reducedMotion: false, needsFonts: false,
  };
</script>
<script src="../../assets/js/animator.js"></script>
<script>
window.__opacity = function (id) {
  return +parseFloat(getComputedStyle(document.getElementById(id)).opacity).toFixed(2);
};

/** Czy cel LEŻY POZA wyzwalaczem — bez tego test przechodziłby także dla
 *  dzisiejszego `selector`, który szuka wyłącznie wśród potomków. */
window.__celPozaWyzwalaczem = function () {
  return !document.getElementById('wyzwalacz').contains(document.getElementById('cel'));
};

window.__doWyzwalacza = function () {
  document.getElementById('wyzwalacz').scrollIntoView({ block: 'center' });
};

/** Czy sam wyzwalacz został nietknięty. Cel zewnętrzny znaczy „animuj TAMTEGO",
 *  a nie „animuj obu". */
window.__wyzwalaczTknięty = function () {
  var s = getComputedStyle(document.getElementById('wyzwalacz'));
  return s.opacity !== '1' || (s.transform !== 'none' && s.transform !== 'matrix(1, 0, 0, 1, 0, 0)');
};
</script>
