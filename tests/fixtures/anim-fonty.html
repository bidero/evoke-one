<!--
  Animator — start w dwóch fazach i koniec czekania na webfonty.

  HISTORIA, bo bez niej ta atrapa wygląda na przerost formy:
  do 1.96.0 `needsFonts` wstrzymywało CAŁE uruchomienie silnika — podział
  tekstu, zwykłe animacje i zdjęcie zasłony lądowały po `document.fonts.ready`.
  1.96.0 zawęziło czekanie do samego podziału. **1.126.0 zdejmuje je zupełnie**:
  zmierzone na lustrze przy dławieniu 6×, fonty były gotowe o 1932 ms, czyli
  w środku pierwszego przebiegu — więc odłożenie nie tyle czekało, ile rozbijało
  pracę na dwa pełne przebiegi i pierwsze kawałki podziału wychodziły o 6137 ms.
  Poprawki po wczytaniu fontów robi dziś sam SplitText, przez `loadingdone`
  i tylko przy podziale na linie.

  Zamiast tego pierwszy przebieg dzieli się na FAZY: tania (stan początkowy)
  → zdjęcie zasłony → klatka → droga (podział, osie czasu, ScrollTriggery).
  Ta atrapa mierzy jedno i drugie, bo to ta sama zmiana.

  Fixture podstawia własne `document.fonts.ready` — obietnicę, której test
  CELOWO nie rozwiązuje. Bez tego „silnik nie czeka na fonty" jest w przeglądarce
  nie do uchwycenia: fonty systemowe są gotowe natychmiast i oba zachowania
  wyglądają tak samo.
-->
<style>
  body { margin: 0; font: 16px system-ui; }
  p, div[id] { padding: 10px; background: #234; color: #fff; }
</style>
<!--
  ZASŁONA IDZIE Z PHP, nie z kopii tutaj — wstrzykiwana przez `head`
  (tests/php/anim-preveil.php). To ona jest przedmiotem tej wersji: reguła
  przepisana do fixture'a przechodziłaby na zielono nawet wtedy, gdyby wtyczka
  przestała ją drukować. Razem z regułami przychodzi mikroskrypt, który zakłada
  `evk-veil` na <html> i pilnuje bezpiecznika czasowego.
-->

<script>
/* Fonty pod kontrolą testu: obietnica, której nikt nie rozwiązuje.
   Od 1.126.0 silnik `document.fonts.ready` w ogóle nie czyta — i właśnie to
   tu sprawdzamy: podział ma powstać MIMO nierozwiązanej obietnicy.

   `?fontyOdRazu=1` rozwiązuje ją natychmiast — zostaje do przypadku wyścigu
   z późnym GSAP-em. */
window.__fontyGotowe = null;
(function () {
  var obietnica = new Promise(function (res) { window.__fontyGotowe = res; });
  try {
    Object.defineProperty(document.fonts, 'ready', {
      configurable: true,
      get: function () { return obietnica; },
    });
  } catch (e) {
    /* Gdyby przeglądarka na to nie pozwoliła, pomiar byłby fikcją — lepiej
       niech test pada głośno niż przechodzi na atrapie. */
    window.__fontyGotowe = null;
  }
  if (new URLSearchParams(location.search).get('fontyOdRazu') === '1') {
    window.__fontyGotowe();
  }
})();
</script>

<!-- Bez podziału: stan początkowy da się nałożyć od razu, w fazie 1. -->
<div id="zwykly" data-evk-anim='{"animation":"z"}'>zwykła animacja</div>
<!-- Z podziałem: stan początkowy leży na kawałkach, których w fazie 1 jeszcze
     nie ma — ten element czeka pod znacznikiem do końca fazy 2. -->
<p id="dzielony" data-evk-anim='{"animation":"d"}'>Projektujemy strony, które
  wyglądają jak marka, a działają jak narzędzie — od pierwszego szkicu po
  wdrożenie i opiekę nad wynikami w wyszukiwarce.</p>

<script>
/* GSAP wczytywany Z OPÓŹNIENIEM, sterowanym z `?gsapPozno=<ms>`.
   
   Domyślne zero to zwykła strona. Wartość dodatnia odtwarza wolne łącze: fonty
   bywają wtedy gotowe ZANIM dojedzie biblioteka, a silnik ma wtedy NIE ruszać
   przebudowy — `initAll()` bez GSAP-a to błąd wykonania i martwy Animator.
   Kolejność jest zamierzona: ScrollTrigger na końcu, bo to na niego czeka
   silnik, a SplitText musi już wtedy być.

   Statyczne <script src> nie dałyby się opóźnić, stąd wczytywanie z kodu także
   w przypadku domyślnym — inaczej ta gałąź byłaby nie do zmierzenia. */
(function () {
  var pliki = ['gsap.min.js', 'SplitText.min.js', 'ScrollTrigger.min.js'];
  var po = parseInt(new URLSearchParams(location.search).get('gsapPozno'), 10) || 0;
  var dalej = function (i) {
    if (i >= pliki.length) return;
    var s = document.createElement('script');
    s.src = '../../assets/vendor/gsap/' + pliki[i];
    s.onload = function () { dalej(i + 1); };
    document.head.appendChild(s);
  };
  setTimeout(function () { dalej(0); }, po);
})();
</script>
<script>
(function () {
  var row = function (extra) {
    /* Czas DŁUGI, bo pytanie brzmi „czy animacja w ogóle powstała", a tween,
       który zdążył się skończyć, znika z GSAP-a i wygląda jak nigdy niebyły. */
    return Object.assign({ preset: 'fade-up', trigger: 'load', duration: 4,
                           delay: 0, stagger: 0, easing: 'none', order: 0 }, extra);
  };
  window.evkAnimator = {
    library: {
      z: row({}),
      d: row({ preset: 'split-lines' }),
    },
    /* Presety PRAWDZIWE, z PHP (tests/php/presets.php przez `head`). To one
       niosą `from`/`to` i znacznik `split` — na atrapie `buildConfig()` zwraca
       null i nic się nie buduje, więc pomiar mierzyłby własną atrapę. */
    presets: (window.__presets && window.__presets.presets) || {},
    reducedMotion: false,
  };
})();
</script>
<script src="../../assets/js/animator.js"></script>
<script>
  window.__stan = function (id) {
    var el = document.getElementById(id);
    var cs = getComputedStyle(el);
    return {
      /* Czy element JEST WIDOCZNY. Element bez nałożonego stanu początkowego,
         pokazany w międzyczasie, mrugnie treścią i dopiero skoczy do „from" —
         ten sam błysk, dla którego w 1.27.2 powstała zasłona. */
      widoczny: cs.visibility === 'visible' && parseFloat(cs.opacity) > 0.01,
      czeka:    el.hasAttribute('data-evk-anim-czeka'),
      /* Znacznik gotowości. Jego BRAK znaczy „silnik jeszcze tego nie zbudował
         i wróci do tego później" — tą samą drogą, którą wraca po zmianie progu
         szerokości. */
      gotowy:  el.dataset.evkAnimReady === '1',
      tweenow: window.gsap ? gsap.getTweensOf(el).length : 0,
      /* Kawałki podziału istnieją tylko wtedy, gdy SplitText naprawdę pobiegł. */
      linie:   el.querySelectorAll('.evk-anim-line').length,
    };
  };

  /** Czy zasłona zeszła. Treść nie ma czekać na fonty, żeby stać się widoczna. */
  window.__zaslona = function () {
    return document.documentElement.classList.contains('evk-veil');
  };

  /* MIGAWKA Z CHWILI ODSŁONIĘCIA — sedno podziału na fazy.
   *
   * Zasłona ma schodzić PO nałożeniu stanów początkowych, ale PRZED budowaniem
   * osi czasu i wyzwalaczy. Z zewnątrz to nie do zmierzenia: po ustaniu ruchu
   * oba porządki wyglądają identycznie. Dlatego zapisujemy stan dokładnie
   * w chwili, w której klasa `evk-veil` schodzi z <html>. */
  window.__wMomencieOdslony = null;
  (function () {
    var obs = new MutationObserver(function () {
      if (document.documentElement.classList.contains('evk-veil')) return;
      if (window.__wMomencieOdslony) return;
      var zwykly = document.getElementById('zwykly');
      var dzielony = document.getElementById('dzielony');
      window.__wMomencieOdslony = {
        /* Stan początkowy `fade-up` to opacity 0 — jeśli jest nałożony, faza 1
           zdążyła. */
        zwyklyOpacity: parseFloat(getComputedStyle(zwykly).opacity),
        /* A osi czasu jeszcze BYĆ NIE MOŻE: to ona kosztuje sekundę na wolnym
           procesorze i to po nią przesunęliśmy zasłonę. */
        zwyklyTweenow: window.gsap ? gsap.getTweensOf(zwykly).length : -1,
        /* Podzielony tekst nie ma czego nałożyć — kawałków jeszcze nie ma —
           więc zostaje pod własnym znacznikiem. */
        dzielonyCzeka: dzielony.hasAttribute('data-evk-anim-czeka'),
        dzielonyLinii: dzielony.querySelectorAll('.evk-anim-line').length,
      };
      obs.disconnect();
    });
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
  })();
</script>
