<!--
  Wave Background — POMIAR KOSZTU KLATKI.

  Znacznik pochodzi z PRAWDZIWEGO `render()` elementu (`tests/php/wave-bg-colors.php … html`),
  więc mierzony jest ten kod, który jedzie na stronę — nie jego odtworzenie.

  DWIE RZECZY WYMAGAJĄ WYJAŚNIENIA:

  1. GSAP ŁADUJEMY TAK, JAK ROBI TO STRONA — z `assets/vendor/gsap`, tym samym
     plikiem, który wtyczka enqueue'uje handlem `evk-gsap`. Element od 1.156.0
     nie importuje własnej kopii, tylko sięga po `window.gsap`; fixture musi
     więc postawić go tak samo jak WordPress, inaczej sprawdzalibyśmy coś innego,
     niż jedzie na stronę.

     Do 1.155.1 stała tu MAPA IMPORTÓW i przepisywanie adresów esm.sh na
     `node_modules`. Jedno i drugie było potrzebne wyłącznie dlatego, że
     biblioteka szła z cudzego serwera i pliki postprocessingu importowały
     `three` jako NAZWĘ PAKIETU. Odkąd three.js leży w `assets/vendor/three`,
     a paczka dodatków ma podmieniony specyfikator na ścieżkę względną, nie ma
     czego przepisywać — fixture prosi o dokładnie te pliki co strona.

  2. MODUŁ WSTAWIAMY PRZEZ createElement, nie innerHTML. Skrypty doklejone przez `innerHTML`
     się nie wykonują — element by nie wystartował, a pomiar pokazałby zero pracy i wyszedł
     na zielono z najgorszego możliwego powodu.
-->
<meta charset="utf-8">
<!-- Puste źródło ikony. Bez tego przeglądarka pyta serwer o `/favicon.ico`,
     dostaje 404 i wpisuje błąd do konsoli — a sprawdzenie „konsola czysta"
     zapalałoby się na czymś, co nie ma z badanym kodem nic wspólnego. -->
<link rel="icon" href="data:,">


<style>
  html, body { margin: 0; height: 100%; background: #111; }
  #scena { position: relative; width: 100%; height: 100vh; }
  #dalej { height: 300vh; }
</style>

<!-- Ten sam plik, który wtyczka podaje handlem `evk-gsap`. -->
<script src="/assets/vendor/gsap/gsap.min.js"></script>

<div id="scena"></div>
<div id="dalej"></div>

<script>
  /* Długie zadania — ta sama waluta, którą liczy Lighthouse: wszystko ponad 50 ms
     wchodzi do Total Blocking Time. */
  window.__dlugie = [];
  try {
    new PerformanceObserver(function (l) {
      l.getEntries().forEach(function (e) {
        window.__dlugie.push({ start: e.startTime, dur: e.duration });
      });
    }).observe({ entryTypes: ['longtask'] });
  } catch (e) { window.__brakObserwatora = e.message; }

  /* Odstępy między klatkami. Własna pętla rAF mierzy CAŁY koszt klatki — jeśli fala
     zajmuje 130 ms, kolejne wywołania są od siebie o tyle właśnie oddalone. */
  window.__klatki = [];
  (function tik(poprzednia) {
    requestAnimationFrame(function (t) {
      if (poprzednia) window.__klatki.push(t - poprzednia);
      tik(t);
    });
  })(0);

  /**
   * Udaje przeglądarkę, która UKRYWA nazwę sterownika.
   *
   * `WEBGL_debug_renderer_info` bywa wyłączone ze względu na prywatność i jest
   * wyłączane w kolejnych przeglądarkach. Element ma wtedy nie zgadywać, tylko
   * zdać się na zmierzony koszt klatki — a bez tej atrapy tego przypadku nie da
   * się w ogóle wywołać w środowisku, w którym nazwa sterownika JEST dostępna.
   */
  window.__ukryjSterownik = function () {
    [window.WebGLRenderingContext, window.WebGL2RenderingContext].forEach(function (K) {
      if (!K) return;
      var oryg = K.prototype.getExtension;
      K.prototype.getExtension = function (nazwa) {
        if (nazwa === 'WEBGL_debug_renderer_info') return null;
        return oryg.call(this, nazwa);
      };
    });
  };

  /**
   * Chowa sterownik tylko przed PIERWSZYMI `ile` pytaniami.
   *
   * Element pyta o akcelerację dwa razy: raz jednorazowym płótnem przed
   * pobraniem three.js, drugi raz kontekstem, którego naprawdę używa.
   * `__ukryjSterownik()` zasłania oba naraz, więc nie da się nim sprawdzić
   * DRUGIEJ linii obrony. Ta atrapa odtwarza sytuację, która zdarza się
   * naprawdę: jednorazowe płótno nie dowiaduje się niczego (kontekst odmówiony,
   * rozszerzenie niedostępne), a prawdziwy renderer już tak.
   */
  window.__ukryjSterownikRaz = function (ile) {
    var zostalo = ile || 1;
    [window.WebGLRenderingContext, window.WebGL2RenderingContext].forEach(function (K) {
      if (!K) return;
      var oryg = K.prototype.getExtension;
      K.prototype.getExtension = function (nazwa) {
        if (nazwa === 'WEBGL_debug_renderer_info' && zostalo > 0) { zostalo--; return null; }
        return oryg.call(this, nazwa);
      };
    });
  };

  /**
   * Udaje przeglądarkę z CAŁKOWICIE wyłączonym WebGL-em.
   *
   * Firefox z `webgl.disabled`, Safari z odznaczonym WebGL-em, sprzęt bez
   * sterownika. Nie ma wtedy nawet kontekstu, więc nie ma kogo pytać o nazwę
   * — a three.js nie ma na czym rysować.
   */
  window.__wylaczWebGL = function () {
    var oryg = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (rodzaj) {
      if (rodzaj === 'webgl' || rodzaj === 'webgl2' || rodzaj === 'experimental-webgl') return null;
      return oryg.apply(this, arguments);
    };
  };

  /** Wstawia moduł elementu, przepisując importy na lokalne. */
  window.__start = function () {
    var html = window.__tresc || '';

    var tmp = document.createElement('div');
    tmp.innerHTML = html;

    Array.prototype.forEach.call(tmp.childNodes, function (n) {
      if (n.tagName === 'SCRIPT') return;          // skrypty dokładamy niżej
      document.getElementById('scena').appendChild(n.cloneNode(true));
    });
    Array.prototype.forEach.call(tmp.querySelectorAll('script'), function (s) {
      var n = document.createElement('script');
      if (s.type) n.type = s.type;
      n.textContent = s.textContent;
      document.body.appendChild(n);
    });
  };

  /**
   * Udaje stronę, na której GSAP przychodzi PÓŹNIEJ niż moduł fali.
   *
   * Element nie importuje już własnej kopii — bierze `window.gsap` postawiony
   * przez WordPressa. Kolejność „skrypt ze stopki przed modułem" jest własnością
   * układu strony, a nie gwarancją: przy odroczonym ładowaniu albo skrypcie
   * przeniesionym do nagłówka przestaje obowiązywać. Bez tej atrapy czekanie
   * na GSAP-a nie ma jak zapalić — w fixturze biblioteka jest zawsze na miejscu.
   */
  window.__gsapPozniej = function (ms) {
    var g = window.gsap;
    delete window.gsap;
    setTimeout(function () { window.gsap = g; }, ms || 700);
  };

  /**
   * Rysuje kadr w USTALONEJ chwili animacji i oddaje sterowanie.
   *
   * Bez tego porównywanie zrzutów nie ma sensu: `time` rośnie o 0,01 przy każdym
   * wywołaniu `render()`, więc kadr zależy od tego, ile klatek zdążyło wypaść —
   * czyli od obciążenia maszyny. Zmierzone: dwa przebiegi tego samego kodu
   * różniły się średnio o 10 poziomów jasności przy maksimum 129.
   */
  window.__kadr = function (chwila) {
    var w = window.__evkWave;
    if (!w) return false;
    w.wstrzymaj('zrzut');          // pętla ma stanąć, inaczej zaraz nadpisze kadr
    w.time  = chwila;
    w.uTime = 0.1;
    w.ustawStanKoncowy();
    w.rysujRaz();
    return true;
  };

  /** Zeruje próbkę, żeby zmierzyć wybrany odcinek osobno. */
  window.__zerujKlatki = function () { window.__klatki.length = 0; };

  /** Mediana odstępu między klatkami w tym, co zebrano od ostatniego zerowania. */
  window.__medianaKlatki = function () {
    var k = window.__klatki.slice(3).sort(function (a, b) { return a - b; });
    return k.length ? Math.round(k[Math.floor(k.length / 2)] * 10) / 10 : null;
  };

  /** Podsumowanie pomiaru. `okno` obcina początek — start elementu nas nie interesuje. */
  window.__wynik = function (odKiedy) {
    odKiedy = odKiedy || 0;
    var dl = window.__dlugie.filter(function (z) { return z.start >= odKiedy; });
    var kl = window.__klatki.slice(10);
    var pos = kl.slice().sort(function (a, b) { return a - b; });
    return {
      plotno:       !!document.querySelector('#scena canvas'),
      klatek:       kl.length,
      medianaKlatki: pos.length ? Math.round(pos[Math.floor(pos.length / 2)] * 10) / 10 : null,
      najgorszaKlatka: pos.length ? Math.round(pos[pos.length - 1]) : null,
      dlugichZadan: dl.length,
      sumaDlugich:  Math.round(dl.reduce(function (s, z) { return s + z.dur; }, 0)),
      /* TBT liczone tak, jak liczy je Lighthouse: nadwyżka ponad 50 ms. */
      tbt:          Math.round(dl.reduce(function (s, z) { return s + Math.max(0, z.dur - 50); }, 0)),
      brakObserwatora: window.__brakObserwatora || null,
    };
  };
</script>
