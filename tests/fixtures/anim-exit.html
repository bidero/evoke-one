<style>
  body { margin: 0; font: 16px system-ui; }
  .spacer { height: 1600px; }
  #cel  { height: 140px; background: #345; color: #fff; }
  #menu { height: 140px; background: #534; color: #fff; }
</style>

<div class="spacer" id="nad"></div>
<div id="cel" data-evk-anim='{"animation":"znika","trigger":"exit"}'>ZNIKA PRZY WYJŚCIU</div>
<!-- Ten sam preset, ale wyzwalacz „zamknięcie menu": ma NIE reagować na
     scroll. Leży obok wychodzącego z kadru, żeby oba przechodziły dokładnie
     tę samą drogę przewijania. -->
<div id="menu" data-evk-anim='{"animation":"zamyka","trigger":"menu-close"}'>ZNIKA PRZY ZAMKNIĘCIU MENU</div>
<!-- POMYŁKA DO WYŁAPANIA, zakładana z `?pomylka=1`: animacja WEJŚCIOWA pod
     wyzwalaczem „zamknięcie menu". Grana do przodu najpierw gasi element,
     a potem przywraca go do widoczności — w chwili, gdy panel wyjeżdża.
     Zgłoszone z użycia jako „tło znika, napisy zostają". Atrybut nadaje
     skrypt niżej, żeby domyślna strona została czysta dla reszty sprawdzeń. -->
<div id="pomylka">WEJŚCIE PODPIĘTE POD ZAMKNIĘCIE</div>
<div class="spacer" id="pod"></div>
<script>
  /* Ten sam wiersz WEJŚCIOWY pod dwoma wyzwalaczami — i to jest tu sedno.
     Pod „zamknięciem menu" ma paść ostrzeżenie, pod „wejściem w kadr" ma go
     NIE być. Bez tej drugiej strony bramka po wyzwalaczu jest w testach
     nierozróżnialna: zmierzone — jej usunięcie przechodziło na zielono, bo
     na stronie kontrolnej nie było żadnej animacji wejściowej. */
  var pom = new URLSearchParams(location.search).get('pomylka');
  if (pom) {
    document.getElementById('pomylka').setAttribute('data-evk-anim',
      JSON.stringify({ animation: 'wjazd',
                       trigger: pom === 'wejscie' ? 'viewport' : 'menu-close' }));
  }
</script>

<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script>
  // Odwzorowanie payloadu z includes/anim/animator.php
  window.evkAnimator = {
    library: {
      znika:  { slug: 'znika',  preset: 'fade-out', trigger: 'exit',
                duration: 0.3, delay: 0, stagger: 0, easing: 'power2.out', order: 0 },
      zamyka: { slug: 'zamyka', preset: 'fade-out', trigger: 'menu-close',
                duration: 0.3, delay: 0, stagger: 0, easing: 'power2.out', order: 0 },
      // Wiersz WEJŚCIOWY — sam w sobie poprawny, zły jest dopiero wyzwalacz,
      // pod który go podpięto (patrz `#pomylka`).
      wjazd:  { slug: 'wjazd',  preset: 'fade', trigger: 'viewport',
                duration: 0.3, delay: 0, stagger: 0, easing: 'power2.out', order: 0 },
    },
    presets: {
      'fade-out': { from: { opacity: 1 }, to: { opacity: 0 }, duration: 0.3, exit: true },
      'fade':     { from: { opacity: 0 }, to: { opacity: 1 }, duration: 0.3 },
    },
    reducedMotion: false, needsFonts: false,
  };
</script>
<script src="../../assets/js/animator.js"></script>
<script>
window.__op = function () {
  return +parseFloat(getComputedStyle(document.getElementById('cel')).opacity).toFixed(2);
};

/** Przezroczystość elementu z wyzwalaczem „zamknięcie menu". */
window.__opMenu = function () {
  return +parseFloat(getComputedStyle(document.getElementById('menu')).opacity).toFixed(2);
};

/** Ręczne wyprowadzenie treści — to, co robi menu tuż przed zamknięciem. */
window.__wyjscie = function () { return window.evkAnimatorExit(document.body); };

/** Element w środku okna — stan spoczynku, „jestem w kadrze". */
window.__doCelu = function () {
  document.getElementById('cel').scrollIntoView({ block: 'center' });
};

/** Daleko w dół: cel ucieka GÓRĄ. */
window.__hen = function () { window.scrollTo(0, document.body.scrollHeight); };

/** Na sam początek: cel ucieka DOŁEM (przewijamy w górę ponad niego). */
window.__naGore = function () { window.scrollTo(0, 0); };
</script>
