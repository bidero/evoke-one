<link rel="stylesheet" href="../../assets/admin/admin.css">
<style>
  /* Tyle otoczki wp-admin, ile realnie wpływa na mierzone komponenty.
     Poniżej 782 px WordPress powiększa pola dotykowe — i to właśnie tam
     wychodziło spłaszczenie checkboxów w Animatorze. */
  body { margin: 0; background: #f0f0f1; font: 13px -apple-system, system-ui, sans-serif; }
  @media screen and (max-width: 782px) {
    input[type=checkbox] { -webkit-appearance: none; appearance: none; border: 1px solid #8c8f94;
      background: #fff; height: 1.5625rem; width: 1.5625rem; }
  }
</style>

<div class="wrap"><div class="evo-panel" id="panel"></div></div>

<!-- Próbki komponentów, które nadal żyją w innych zakładkach, ale wypadły
     z Animatora (opisy przeszły na sekcje zwijane w 1.42.0). Bez nich token
     dla nich przestałby być pilnowany przez cokolwiek. -->
<div class="wrap">
  <div class="evo-panel">
    <div class="evo-info-box"><span class="dashicons dashicons-info"></span><div>Próbka</div></div>
    <div class="evo-anim-grid"><div class="evo-anim-hint">Próbka</div></div>
    <details class="evo-note"><summary>Próbka</summary><div class="evo-note-body">Treść</div></details>
  </div>
</div>

<!-- Wymuszony ciasny układ. Spłaszczenie checkboxa zależy od tego, czy długa
     etykieta trafi w wąską kolumnę siatki — a to przetasowuje się przy każdej
     zmianie liczby pól w wierszu. Tu ściskamy jawnie, żeby sprawdzenie miało
     zęby niezależnie od tego, ile pól akurat ma Animator. -->
<div class="wrap">
  <div class="evo-panel" style="width:260px">
    <div class="evo-anim-grid" id="tight">
      <div><label class="checkbox-label"><input type="checkbox"> Powtarzaj przy każdym wejściu w kadr</label></div>
    </div>
  </div>
</div>

<script>
/* Markup zakładki z PRAWDZIWEGO tab-animator.php (window.__tab z testu). */
document.getElementById('panel').innerHTML = window.__tab;

/** Wyliczone wartości kluczowych komponentów — punkt odniesienia refaktoru. */
window.__styles = function () {
  var out = {};
  [['panel', '.evo-panel'], ['card', '.evo-status-card'], ['info', '.evo-info-box'],
   ['row', '.evo-anim-row'], ['header', '.evo-anim-row-header'],
   ['title', '.evo-anim-row-title'], ['badge', '.evo-anim-class'],
   ['hint', '.evo-anim-hint'], ['note', '.evo-note'],
   // Przycisk główny i pole niosą akcent oraz jednolitą wysokość kontrolki —
   // dwie rzeczy, po których najszybciej widać, że skóra się rozjechała.
   ['btn', '.evo-panel .button-primary'], ['field', '.evo-anim-grid input[type=text]']
  ].forEach(function (pair) {
    var el = document.querySelector(pair[1]);
    if (!el) { out[pair[0]] = null; return; }
    var s = getComputedStyle(el);
    out[pair[0]] = {
      bg: s.backgroundColor, color: s.color,
      border: s.borderTopColor + ' ' + s.borderTopWidth,
      radius: s.borderTopLeftRadius, size: s.fontSize, h: s.height,
    };
  });
  return out;
};

/* Geometria paska zwiniętego wiersza. „Nierówny pasek" to była asymetria
 * paddingu: 12 px u góry, 0 u dołu — treść siedziała 6 px za nisko. */
window.__bar = function () {
  var row = document.querySelector('#panel .evo-anim-row');
  row.classList.add('is-collapsed');
  var hd = row.querySelector('.evo-anim-row-header');
  var ti = hd.querySelector('.evo-anim-row-title');
  var s  = getComputedStyle(hd);
  var hb = hd.getBoundingClientRect(), tb = ti.getBoundingClientRect();
  var out = {
    padTop:    parseFloat(s.paddingTop),
    padBottom: parseFloat(s.paddingBottom),
    barMid:    hb.top + hb.height / 2,
    titleMid:  tb.top + tb.height / 2,
  };
  row.classList.remove('is-collapsed');
  return out;
};

/* Lista rozwijana musi mieć strzałkę I miejsce na nią. Skrót `background`
 * kasował obraz tła, a skrót `padding` — zapas po prawej. */
window.__select = function () {
  var s = getComputedStyle(document.querySelector('#panel .evo-anim-grid select'));
  return { image: s.backgroundImage, padRight: parseFloat(s.paddingRight) };
};

/* Kontrolki i checkboxy stojące w tym samym wierszu siatki muszą kończyć się
 * na tej samej wysokości. Grupujemy po DOLNEJ krawędzi KOMÓRKI — to ona jest
 * wspólna przy align-items:end; górna różni się, bo komórki mają różną wysokość
 * (pole ma nad sobą etykietę, checkbox nie). */
window.__rowAlign = function () {
  var rows = {};
  document.querySelectorAll('#panel .evo-anim-grid > div').forEach(function (c) {
    var cb = c.querySelector('.checkbox-label');
    var ct = c.querySelector('input[type=text], input[type=number], select');
    var el = cb || ct;
    if (!el) return;
    var key = Math.round(c.getBoundingClientRect().bottom);
    (rows[key] = rows[key] || []).push({
      kind: cb ? 'cb' : 'fld',
      bottom: Math.round(el.getBoundingClientRect().bottom * 2) / 2,
    });
  });
  return Object.keys(rows).map(function (k) {
    var v = rows[k];
    return {
      mixed: v.some(function (x) { return x.kind === 'cb'; })
          && v.some(function (x) { return x.kind === 'fld'; }),
      spread: Math.max.apply(null, v.map(function (x) { return x.bottom; }))
            - Math.min.apply(null, v.map(function (x) { return x.bottom; })),
    };
  });
};

/* Niezmiennik, nie przypadek układu: pole wyboru nie ma prawa się kurczyć.
 * Sam pomiar prostokąta zależy od tego, czy długa etykieta trafi akurat
 * w wąską kolumnę — a to zmienia się przy każdym dołożeniu pola do wiersza. */
window.__shrink = function () {
  return Array.prototype.map.call(
    document.querySelectorAll('.evo-anim-grid .checkbox-label input[type=checkbox]'),
    function (el) { return getComputedStyle(el).flexShrink; }
  );
};

/** Wymiary wszystkich checkboxów — kwadratowość mierzymy, nie zakładamy. */
window.__checkboxes = function () {
  return Array.prototype.map.call(
    document.querySelectorAll('.evo-anim-grid .checkbox-label input[type=checkbox]'),
    function (el) {
      var r = el.getBoundingClientRect();
      return { w: Math.round(r.width), h: Math.round(r.height) };
    }
  );
};
</script>
