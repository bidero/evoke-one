<script>
  // Galeria: `styles=cross:3,minus-2:2` → po jednym burgerze na styl.
  (q.get('styles') || '').split(',').filter(Boolean).forEach(function (wpis) {
    var czesci = wpis.split(':');
    var styl   = czesci[0];
    var kresek = parseInt(czesci[1], 10) || 3;
    var b = document.createElement('button');
    b.className = 'evk-burger evk-burger--' + styl;
    b.id = 's-' + styl;
    b.type = 'button';
    b.setAttribute('aria-expanded', 'false');
    b.setAttribute('aria-label', 'Menu');
    var box = document.createElement('span');
    box.className = 'evk-burger__box';
    for (var i = 0; i < kresek; i++) {
      var l = document.createElement('span');
      l.className = 'evk-burger__line';
      box.appendChild(l);
    }
    b.appendChild(box);
    document.getElementById('galeria').appendChild(b);
  });

  /* Zrzuty z render(): identyfikator z opakowania schodzi na sam przycisk,
     dzięki czemu wszystkie pomocnicze funkcje niżej działają na nich bez
     żadnego wyjątku. Musi się wykonać PRZED pętlą ustawień, inaczej wstawione
     burgery zostałyby bez czasu przejścia i pomiary trafiałyby w ruch. */
  (function () {
    var box = document.getElementById('zrzut');
    box.innerHTML = q.get('html') || '';
    Array.prototype.forEach.call(box.children, function (w) {
      var b = w.querySelector('.evk-burger');
      if (b) { b.id = w.id; w.removeAttribute('id'); }
    });
  }());

  /* Ustawienia idą na WSZYSTKIE burgery, nie tylko na pierwszy. Przy czasie
     nałożonym na jeden pomiary na pozostałych trafiały w trwające przejście
     i wychodziły kąty pośrednie (18° zamiast 45°) — pomiar mówił wtedy
     o momencie odczytu, a nie o stanie docelowym. */
  document.querySelectorAll('.evk-burger').forEach(function (b) {
    b.style.setProperty('--evk-burger-size',   q.get('size')   || '44px');
    b.style.setProperty('--evk-burger-stroke', q.get('stroke') || '2px');
    b.style.setProperty('--evk-burger-gap',    q.get('gap')    || '7px');
    b.style.setProperty('--evk-burger-time',   q.get('dur')    || '400ms');
    b.style.setProperty('--evk-burger-color',  q.get('color')  || 'rgb(0, 0, 0)');
    if (q.get('coloropen')) b.style.setProperty('--evk-burger-color-open', q.get('coloropen'));
    if (q.get('rotate')) b.style.setProperty('--evk-burger-open-rotate', q.get('rotate'));
    if (q.get('short'))  b.style.setProperty('--evk-burger-short', q.get('short'));
  });

  /* Padding napisu wpisujemy WPROST we `padding` slotu, bo tą samą drogą idzie
     na stronie: to nie jest zmienna, tylko kontrolka `dimensions` celująca
     w `.evk-burger__text`. Że celuje właśnie tam, dowodzi osobno test w PHP —
     tu sprawdzamy, co arkusz z tym robi. */
  if (q.get('textpad')) {
    document.querySelectorAll('.evk-burger__text').forEach(function (s) {
      s.style.padding = q.get('textpad');
    });
  }

  /* Odstęp napisu i kolor napisu po otwarciu — zmienne na przycisku, tak jak
     wpisuje je Bricks. Nazwy zmiennych są tu wpisane z ręki, więc literówki
     w kontrolce ta droga NIE złapie — od tego jest zrzut `css` w teście PHP. */
  document.querySelectorAll('.evk-burger').forEach(function (b) {
    /* Kolor NIE DO UŻYCIA — tak jak Bricks zapisuje kolor z palety, której
       zmienna nie dociera do elementu. Podstawiona wartość jest wtedy
       nieprawidłowa na etapie wartości obliczonej, a to zupełnie co innego niż
       zmienna niezdefiniowana: zapas w `var()` NIE wchodzi. */
    if (q.get('zlykolor')) b.style.setProperty('--evk-burger-color-open', 'var(--nie-ma-takiej-zmiennej)');
    if (q.get('textgap'))   b.style.setProperty('--evk-burger-text-gap', q.get('textgap'));
    if (q.get('textopen'))  b.style.setProperty('--evk-burger-text-color-open', q.get('textopen'));
    if (q.get('linewidth')) b.style.setProperty('--evk-burger-line-width', q.get('linewidth'));
  });

  var root = document.getElementById('root');
  root.setAttribute('data-portal',        '1');
  root.setAttribute('data-duration',      '0.2');
  root.setAttribute('data-easing',        'none');
  root.setAttribute('data-content-delay', '0');
  root.setAttribute('data-anim-exit',     '0');
  root.setAttribute('data-exit-wait',     '');
  // Przełącznikiem menu jest burger — dokładnie tak, jak na stronie.
  root.setAttribute('data-customtoggle',  '#burger');
  root.setAttribute('data-toggle-class',  '');
  root.setAttribute('data-lock-scroll',   '0');
  root.setAttribute('data-open-builder',  '0');
  root.setAttribute('data-close-on-esc',  '1');
</script>

<script>
function linie(id) {
  return Array.prototype.slice.call(
    document.getElementById(id).querySelectorAll('.evk-burger__line'));
}

/** Macierz transformacji kreski — [a, b, c, d, tx, ty]. */
function mat(el) {
  var m = getComputedStyle(el).transform;
  if (!m || m === 'none') return [1, 0, 0, 1, 0, 0];
  return m.replace(/^matrix\(|\)$/g, '').split(',').map(parseFloat);
}

/**
 * Stan kreski w liczbach, które da się porównać.
 *
 * `kat` liczymy z macierzy (atan2 z pierwszej kolumny), bo `rotate(45deg)`
 * w computed style i tak wychodzi macierzą. `ty` to przesunięcie w pionie —
 * po nim widać rozsunięcie kresek w stanie zamkniętym.
 */
window.__linia = function (id, i) {
  var el = linie(id)[i];
  var m  = mat(el);
  var cs = getComputedStyle(el);
  return {
    kat:     Math.round(Math.atan2(m[1], m[0]) * 180 / Math.PI),
    ty:      Math.round(m[5]),
    opacity: +parseFloat(cs.opacity).toFixed(2),
    kolor:   cs.backgroundColor,
    czas:    cs.transitionDuration.split(',')[0].trim(),
    h:       Math.round(parseFloat(cs.height)),
  };
};

window.__ile     = function (id) { return linie(id).length; };

/**
 * Pełna geometria WSZYSTKICH kresek jednego burgera.
 *
 * Do sprawdzenia generycznego „każdy styl naprawdę się rusza": porównujemy ten
 * zrzut przed otwarciem i po nim i żądamy, żeby różnił się choć jedną wartością.
 * Bez tego dopisanie stylu do rejestru bez reguł w arkuszu dałoby nieruchome
 * kreski i nic by tego nie złapało.
 */
window.__geo = function (id) {
  return linie(id).map(function (el) {
    var m  = mat(el);
    var cs = getComputedStyle(el);
    var r  = el.getBoundingClientRect();
    return {
      kat:     Math.round(Math.atan2(m[1], m[0]) * 180 / Math.PI),
      skalaX:  +Math.hypot(m[0], m[1]).toFixed(2),
      tx:      Math.round(m[4]),
      ty:      Math.round(m[5]),
      opacity: +parseFloat(cs.opacity).toFixed(2),
      szer:    Math.round(parseFloat(cs.width)),
      top:     Math.round(parseFloat(cs.top)),
      // Prawy koniec kreski na ekranie — po nim widać, czy ostrza się schodzą.
      prawy:   Math.round(r.right),
      srodekY: Math.round(r.top + r.height / 2),
    };
  });
};

/**
 * Ustawia stan wprost klasą, z pominięciem kliknięcia.
 *
 * Burgery z galerii nie mają żadnego trybu przełączania — i tak ma być, bo
 * mierzymy w nich ARKUSZ, a nie skrypt. Klasa `brx-open` jest jedynym wejściem,
 * którego arkusz słucha, więc podanie jej wprost jest tu wierniejsze niż
 * dorabianie im trybu tylko na potrzeby testu.
 */
window.__ustawOtwarty = function (id, otwarty) {
  document.getElementById(id).classList.toggle('brx-open', otwarty);
};

/** Lewa krawędź kreski WZGLĘDEM pudełka — po niej widać, do czego przylega. */
window.__lewaKreski = function (id, i) {
  var el = linie(id)[i];
  var box = el.parentElement.getBoundingClientRect();
  return Math.round(el.getBoundingClientRect().left - box.left);
};

/** To samo od PRAWEJ — dla stylów dosuwanych do prawej krawędzi. */
window.__prawaKreski = function (id, i) {
  var el = linie(id)[i];
  var box = el.parentElement.getBoundingClientRect();
  return Math.round(box.right - el.getBoundingClientRect().right);
};

/**
 * Napisy przycisku: treść i to, czy naprawdę są widoczne.
 *
 * `checkVisibility({ visibilityProperty: true })` mówi to, o co tu chodzi
 * naprawdę: czy element jest dla przeglądarki widoczny, a więc czy zostaje
 * w drzewie dostępności. Przezroczystości NIE liczy — i to jest cecha, nie
 * brak: napis z `opacity: 0` nadal jest w drzewie i czytnik ekranu przeczyta
 * wtedy oba naraz, „MENU ZAMKNIJ". (Samo `checkVisibility()` bez tej opcji
 * pyta wyłącznie o `display` i nie odróżniłoby niczego.) Sam `visibility`
 * podajemy obok, żeby przy błędzie było widać, którym mechanizmem to zrobiono.
 */
var WIDOCZNY = { visibilityProperty: true };

window.__napisy = function (id) {
  return Array.prototype.map.call(
    document.getElementById(id).querySelectorAll('.evk-burger__label'),
    function (el) {
      return {
        tekst:      el.textContent,
        widoczny:   el.checkVisibility(WIDOCZNY),
        visibility: getComputedStyle(el).visibility,
        opacity:    +parseFloat(getComputedStyle(el).opacity).toFixed(2),
      };
    });
};

/** To samo dla własnych ikon — przełącza je ta sama klasa co napisy. */
window.__ikony = function (id) {
  return Array.prototype.map.call(
    document.getElementById(id).querySelectorAll('.evk-burger__icon'),
    function (el) {
      return {
        klasy:    (el.querySelector('i') || { className: '' }).className,
        widoczny: el.checkVisibility(WIDOCZNY),
        kolor:    getComputedStyle(el).color,
      };
    });
};

/**
 * Wypełnienie i obrys KSZTAŁTU w środku ikony, a nie samego `<svg>`.
 *
 * Mierzymy dziecko, bo o to właśnie chodzi w tej usterce: reguła trafiała
 * w korzeń `<svg>`, kasowała jego `fill="none"`, a wypełnienie DZIEDZICZYŁO
 * SIĘ w dół na kształty. Pomiar na korzeniu pokazałby połowę prawdy.
 */
window.__ksztalt = function (id) {
  var el = document.getElementById(id).querySelector('.ksztalt');
  var cs = getComputedStyle(el);
  return { fill: cs.fill, stroke: cs.stroke };
};

/**
 * Slot napisu i środek WIDOCZNEGO napisu — do pomiaru paddingu.
 *
 * `srodek` liczymy względem środka przycisku, bo tylko przesunięcie względem
 * niego jest tym, o co chodzi: przycisk środkuje pudełko napisu, więc nierówna
 * góra i dół przesuwają treść o połowę różnicy.
 */
window.__slotTekstu = function (id) {
  var b    = document.getElementById(id);
  var slot = b.querySelector('.evk-burger__text');
  var wid  = Array.prototype.filter.call(
    b.querySelectorAll('.evk-burger__label'),
    function (el) { return el.checkVisibility(WIDOCZNY); })[0];
  var rb = b.getBoundingClientRect();
  var rs = slot.getBoundingClientRect();
  var rw = wid.getBoundingClientRect();
  return {
    w:      Math.round(rs.width),
    h:      Math.round(rs.height),
    // Dodatnia wartość = napis niżej niż środek przycisku.
    srodek: Math.round((rw.top + rw.height / 2) - (rb.top + rb.height / 2)),
  };
};

/**
 * Odległość napisu od KRESKI i od pudełka, plus kolor widocznego napisu.
 *
 * Od kreski, bo to o nią chodzi w zgłoszeniu: pudełko jest kwadratem o boku
 * pola klikalnego, więc kreski węższe niż pełna szerokość zostawiają w nim
 * pustkę, której nie widać — a napis stoi wtedy dalej, niż mówi ustawienie.
 * Pomiar od pudełka pokazałby zero i niczego by nie wykrył.
 *
 * `odleglosc` liczy się wzdłuż osi układu, więc jedna funkcja obsługuje
 * wszystkie cztery pozycje napisu: przy „za"/„przed" mierzymy w poziomie,
 * przy „nad"/„pod" w pionie, i zawsze od BLIŻSZEJ krawędzi.
 */
window.__napisWzgledemIkony = function (id) {
  var b     = document.getElementById(id);
  var box   = b.querySelector('.evk-burger__box, .evk-burger__icons');
  var linia = b.querySelector('.evk-burger__line');
  var slot  = b.querySelector('.evk-burger__text');
  var wid   = Array.prototype.filter.call(
    b.querySelectorAll('.evk-burger__label'),
    function (el) { return el.checkVisibility(WIDOCZNY); })[0];

  var rb = box.getBoundingClientRect();
  var rl = (linia || box).getBoundingClientRect();
  var rs = slot.getBoundingClientRect();
  var pion = b.classList.contains('evk-burger--tekst-nad')
          || b.classList.contains('evk-burger--tekst-pod');

  // Odległość między pudełkami, niezależnie od tego, które jest pierwsze.
  function przerwa(a, c) {
    return pion ? Math.round(Math.max(c.top - a.bottom, a.top - c.bottom))
                : Math.round(Math.max(c.left - a.right, a.left - c.right));
  }
  return {
    odPudelka: przerwa(rb, rs),
    odKreski:  przerwa(rl, rs),
    szer:      Math.round(b.getBoundingClientRect().width),
    wys:       Math.round(b.getBoundingClientRect().height),
    kolor:     wid ? getComputedStyle(wid).color : null,
  };
};

/** Bok pudełka z rysunkiem — osobno od pola klikalnego całego przycisku. */
window.__pudelko = function (id) {
  var b = document.getElementById(id)
    .querySelector('.evk-burger__box, .evk-burger__icons');
  if (!b) return null;
  var r = b.getBoundingClientRect();
  return { w: Math.round(r.width), h: Math.round(r.height) };
};

/** Nazwa dostępna przycisku z atrybutu — `null`, gdy go nie ma. */
window.__ariaLabel = function (id) {
  return document.getElementById(id).getAttribute('aria-label');
};

/** Obrót całego pudełka — kontrolka „Obrót po otwarciu". */
window.__obrotPudelka = function (id) {
  var box = document.getElementById(id).querySelector('.evk-burger__box');
  var m = mat(box);
  return Math.round(Math.atan2(m[1], m[0]) * 180 / Math.PI);
};
window.__aria    = function (id) { return document.getElementById(id).getAttribute('aria-expanded'); };
window.__brx     = function (id) { return document.getElementById(id).classList.contains('brx-open'); };
window.__klik    = function (id) { document.getElementById(id).click(); };
window.__pole    = function (id) {
  var r = document.getElementById(id).getBoundingClientRect();
  return { w: Math.round(r.width), h: Math.round(r.height) };
};
/** Stan CELU — po nim widać, czy burger naprawdę nim steruje. */
window.__cel = function () {
  var c = document.getElementById('cel');
  return { brx: c.classList.contains('brx-open'), klasy: c.className };
};

/** Zamknięcie celu CZYMŚ INNYM — burger ma za tym pójść. */
window.__zamknijCel = function () {
  document.getElementById('cel').classList.remove('brx-open');
};

window.__ariaControls = function (id) {
  return document.getElementById(id).getAttribute('aria-controls');
};

window.__key = function (key) {
  document.dispatchEvent(new KeyboardEvent('keydown', { key: key, bubbles: true, cancelable: true }));
};

/** Czy panel Circular Menu jest rozwinięty — po promieniu obcięcia. */
window.__menuOtwarte = function () {
  var v = getComputedStyle(document.getElementById('panel')).clipPath || '';
  var m = v.match(/circle\(\s*([\d.]+)\s*(px|%)/);
  return !!m && parseFloat(m[1]) > 1;
};
</script>
