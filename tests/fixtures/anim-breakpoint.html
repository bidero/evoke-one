<!--
  Animator — zakres szerokości okna.

  Zgłoszone jako „media query dla animacji": ciężkie wejścia i podział tekstu
  mają nie grać na telefonie. Poza zakresem silnik NIE BUDUJE osi czasu — więc
  nie ma też kosztu SplitTextów i ScrollTriggerów.

  Najgroźniejsza możliwa regresja to nie „animacja gra tam, gdzie nie powinna",
  tylko „treść została ukryta na stałe": zasłona `evk-veil` chowa wszystko
  z atrybutem, dopóki silnik jej nie zdejmie. Dlatego fixture odtwarza zasłonę
  dokładnie tak, jak robi to render_preveil() w includes/anim/animator.php.

  Wszystkie animacje mają wyzwalacz „load", żeby grały bez przewijania — tu
  chodzi o to, CZY powstały, a nie kiedy.
-->
<style>
  /* Odwzorowanie <style id="evk-anim-preveil"> z includes/anim/animator.php. */
  .evk-veil [data-evk-anim],
  .evk-veil [class*="evk-anim-"] { visibility: hidden !important; }

  body { margin: 0; font: 16px system-ui; }
  div[id] { padding: 10px; background: #234; color: #fff; }
</style>
<script>document.documentElement.classList.add('evk-veil');</script>

<!-- Wąski: gra TYLKO do 700 px. -->
<div id="waski" data-evk-anim='{"animation":"w"}'>tylko wąskie okno</div>
<!-- Szeroki: gra TYLKO od 900 px. Dwa progi z dwóch stron, bo jeden nie
     odróżnia „granica działa" od „granica działa akurat w tę stronę". -->
<div id="szeroki" data-evk-anim='{"animation":"s"}'>tylko szerokie okno</div>
<!-- Bez ograniczeń — kontrola negatywna: pokazuje, że silnik w ogóle działa
     na tej szerokości i że pominięcia biorą się z zakresu, a nie z awarii. -->
<div id="zawsze" data-evk-anim='{"animation":"z"}'>zawsze</div>
<!-- Dwie animacje na jednym elemencie: jedna w zakresie, druga poza nim.
     Znacznik gotowości nie może zablokować dobudowania tej drugiej. -->
<div id="dwie" data-evk-anim='[{"animation":"z"},{"animation":"s"}]'>dwie animacje</div>

<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script>
(function () {
  var row = function (extra) {
    /* Czas celowo DŁUGI. Test pyta „czy animacja w ogóle powstała", a tween,
       który zdążył się skończyć, znika z GSAP-a i wygląda tak samo jak ten,
       którego nigdy nie było. Cztery sekundy trzymają go żywym przez cały
       pomiar. */
    return Object.assign({ preset: 'fade-up', trigger: 'load', duration: 4,
                           delay: 0, stagger: 0, easing: 'none', order: 0 }, extra);
  };
  window.evkAnimator = {
    library: {
      w: row({ maxW: 700 }),
      s: row({ minW: 900 }),
      z: row({}),
    },
    presets: (window.__presets && window.__presets.presets) || {},
    reducedMotion: false,
    needsFonts: false,
  };
})();
</script>
<script src="../../assets/js/animator.js"></script>
<script>
  window.__bp = function (id) {
    var el = document.getElementById(id);
    var cs = getComputedStyle(el);
    return {
      /* Znacznik gotowości. Jego BRAK znaczy „silnik jeszcze tego nie zbudował
         i wróci do tego przy zmianie progu" — to on niesie całą mechanikę
         dobudowywania. */
      gotowy:     el.dataset.evkAnimReady === '1',
      opacity:    +parseFloat(cs.opacity).toFixed(2),
      visibility: cs.visibility,
      /* Ile tweenów GSAP-a dotyczy tego elementu. Zero = animacja nie powstała.
         Żeby to znaczyło właśnie to, a nie „powstała i już się skończyła",
         wiersze mają długi czas trwania — patrz komentarz przy `row` wyżej. */
      tweenow: window.gsap ? gsap.getTweensOf(el).length : 0,
    };
  };

  /** Czy zasłona zeszła z dokumentu. Bez tego treść zostaje niewidoczna. */
  window.__zaslona = function () {
    return document.documentElement.classList.contains('evk-veil');
  };
</script>
