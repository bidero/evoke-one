<!--
  Odwrotna strona tej samej monety co `anim-po-hs.html`.
  Tam przypinał Horizontal Scroll, a wyzwalacz pod nim tworzył Animator.
  Tu przypina ANIMATOR (konfiguracja ze `scrub` i pinem), a wyzwalacz pod nim
  tworzy Horizontal Scroll — i dlatego skrypty ładują się w ODWROTNEJ
  kolejności: hscroll PRZED animatorem.

  Bez tej odwrotności `refreshPriority` na pinie Animatora byłby nie do
  sprawdzenia: wyzwalacze, które Animator tworzy sam, powstają w kolejności
  drzewa — czyli od razu w tej, której GSAP oczekuje — więc błąd nie ma jak
  wyjść. Wychodzi dopiero wtedy, gdy wyzwalacz niżej pochodzi z INNEGO skryptu,
  wczytanego wcześniej.
-->
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px system-ui; }
  .przed { height: 600px; background: #eee; }
  #przypinany { height: 500px; background: #234; color: #fff; padding: 20px; }
  .sekcja { background: #4c1d95; color: #fff; padding: 20px 0; }
  .karta { width: 500px; height: 200px; margin-right: 24px;
           background: rgba(255, 255, 255, .12); padding: 16px; }
  .ogon { height: 1500px; background: #eee; }
</style>

<link rel="stylesheet" href="../../includes/bricks-elements/evoke-horizontal-scroll/assets/hscroll.css">

<div class="przed">treść przed</div>
<div id="przypinany">PRZYPINANY PRZEZ ANIMATOR</div>

<section class="sekcja" id="sekcja-1">
  <div class="evk-hscroll" id="hs-1">
    <div class="evk-hscroll__track">
      <div class="karta">01</div>
      <div class="karta">02</div>
      <div class="karta">03</div>
    </div>
  </div>
</section>

<div class="ogon"></div>

<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>

<script>
document.getElementById('hs-1').setAttribute('data-evk-hscroll', JSON.stringify({
  widthMode: 'auto', pinTarget: 'selector', pinSelector: '.sekcja',
  scrub: 0, startOffset: 'top top', snap: false, disableBelow: 0,
  progressBar: false, peekNext: false,
}));
</script>
<!-- HSCROLL PRZED ANIMATOREM — patrz komentarz na górze. -->
<script src="../../includes/bricks-elements/evoke-horizontal-scroll/assets/hscroll.js"></script>

<script>
window.evkAnimator = {
  library: {
    trzymaj: { slug: 'trzymaj', preset: 'fade-up', trigger: 'scrub',
               duration: 0.4, delay: 0, stagger: 0, easing: 'none', order: 0,
               start: 'top top', end: '+=600', scrub: 1, pin: 1,
               targets: 'self', selector: '' },
  },
  presets: { 'fade-up': { from: { opacity: 0, y: 40 }, to: { opacity: 1, y: 0 }, duration: 0.4 } },
  reducedMotion: false, needsFonts: false,
};
document.getElementById('przypinany').setAttribute('data-evk-anim', 'trzymaj');
</script>
<script src="../../assets/js/animator.js"></script>

<script>
/**
 * Punkt startu wyzwalacza HSCROLLA wobec prawdziwej pozycji sekcji.
 *
 * Sekcja jest przypinana z `start: 'top top'`, więc punkt startu ma wyjść
 * dokładnie jej pozycją w dokumencie.
 */
window.__pod = function () {
  var sek = document.getElementById('sekcja-1');
  var doc = Math.round(sek.getBoundingClientRect().top + window.scrollY);
  var hs  = ScrollTrigger.getAll().filter(function (t) { return t.trigger === sek; })[0];
  var an  = ScrollTrigger.getAll().filter(function (t) {
    return t.trigger === document.getElementById('przypinany');
  })[0];

  return {
    pozycjaWDokumencie: doc,
    start: hs ? Math.round(hs.start) : null,
    drogaAnimatora: an ? Math.round(an.end - an.start) : null,
  };
};
</script>
