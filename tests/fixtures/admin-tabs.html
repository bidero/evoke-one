<link rel="stylesheet" href="../../assets/admin/admin.css">
<style>
  /* Tyle otoczki wp-admin, ile realnie wpływa na mierzone kontrolki. WordPress
     nadaje polom własną wysokość i ramkę — bez tego test mierzyłby pola nagie,
     a więc łatwiejsze do „naprawienia" niż w prawdziwym panelu. */
  body { margin: 0; background: #f0f0f1; font: 13px -apple-system, system-ui, sans-serif; }
  input[type=text], input[type=search], input[type=url], input[type=email],
  input[type=number], input[type=password], select, textarea {
    border: 1px solid #8c8f94; border-radius: 3px; background: #fff; color: #2c3338;
    padding: 0 8px; line-height: 2; min-height: 30px; box-shadow: 0 0 0 transparent;
  }
  select { padding: 0 24px 0 8px; }
  textarea { padding: 6px 8px; }
  .button { display: inline-block; border: 1px solid #2271b1; border-radius: 3px;
    background: #f6f7f7; color: #2271b1; padding: 0 10px; line-height: 2.15384615;
    min-height: 30px; font-size: 13px; cursor: pointer; }
  .button-primary { background: #2271b1; border-color: #2271b1; color: #fff; }
</style>

<div class="wrap">
  <h1>Evoke ONE</h1>
  <div class="evo-panel" id="panel"></div>
</div>

<script>
/* Markup zakładki z PRAWDZIWEGO pliku (window.__tab z testu, przez tests/php/tab.php).
   Skrypty zakładki nie są uruchamiane — mierzymy wygląd, nie zachowanie, a jQuery
   i tak nie ma tu być. */
document.getElementById('panel').innerHTML = window.__tab;

/** Czy element jest w ogóle rysowany. Ukryta podzakładka ma zerowe prostokąty
 *  i zmierzona wysokość 0 wyglądałaby jak usterka skóry. */
function shown(el) {
  return el.getClientRects().length > 0;
}

/** Krótki, jednoznaczny opis elementu — po nim odnajduje się go w pliku. */
function where(el) {
  var n = el.getAttribute('name') || el.id || el.className || '';
  return el.tagName.toLowerCase() + (el.type ? '[' + el.type + ']' : '') +
         (n ? ' „' + String(n).slice(0, 42) + '"' : '');
}

/**
 * Kontrolki jednoliniowe: pola tekstowe i listy rozwijane.
 *
 * Skóra Fields daje im JEDNOLITĄ wysokość i promień — to po nich najszybciej
 * widać, że zakładka poszła własną drogą. Pola koloru, checkboxy i pola ukryte
 * mają w Fields osobny kształt i tu nie należą.
 */
window.__controls = function () {
  var sel = '#panel input[type=text], #panel input[type=url], #panel input[type=email], ' +
            '#panel input[type=number], #panel input[type=search], #panel input[type=tel], ' +
            '#panel input:not([type]), #panel select';
  return Array.prototype.filter.call(document.querySelectorAll(sel), shown).map(function (el) {
    var s = getComputedStyle(el);
    return {
      where:  where(el),
      h:      Math.round(el.getBoundingClientRect().height),
      radius: s.borderTopLeftRadius,
      border: s.borderTopColor,
      size:   s.fontSize,
      /* Inline'owy wygląd jest przyczyną, a nie objawem — raportujemy go obok
         pomiaru, żeby komunikat wskazywał, co dokładnie zdjąć z pliku. */
      inline: el.getAttribute('style') || '',
    };
  });
};

/** Wieloliniowe: promień i ramka; wysokość ustala liczba wierszy. */
window.__textareas = function () {
  return Array.prototype.filter.call(document.querySelectorAll('#panel textarea'), shown)
    .map(function (el) {
      var s = getComputedStyle(el);
      return { where: where(el), radius: s.borderTopLeftRadius, border: s.borderTopColor,
               inline: el.getAttribute('style') || '' };
    });
};

/** Przyciski — promień 7 px i akcent na primary. */
/* Przełączniki. Są zakładki zbudowane WYŁĄCZNIE z nich — „Czyszczenie" nie ma
   ani jednego pola ani przycisku — a strażnik „jest co mierzyć" ma pilnować,
   że zakładka się wyrenderowała, nie że ma akurat pola tekstowe. */
window.__toggles = function () {
  return Array.prototype.filter.call(document.querySelectorAll('#panel .evo-toggle'), shown)
    .map(function (el) { return { where: where(el) }; });
};

/* Karty — status i użytkownik. Są zakładki złożone WYŁĄCZNIE z nich („Avatar"
   to lista kafelków bez ani jednego pola), a strażnik „jest co mierzyć" ma
   pilnować, że zakładka się wyrenderowała, nie że ma akurat pola. */
window.__cards = function () {
  return Array.prototype.filter.call(
    document.querySelectorAll('#panel .evo-status-card, #panel .evo-user-card'), shown)
    .map(function (el) { return { where: where(el) }; });
};

window.__buttons = function () {
  return Array.prototype.filter.call(document.querySelectorAll('#panel .button'), shown)
    .map(function (el) {
      var s = getComputedStyle(el);
      return {
        where:   where(el),
        radius:  s.borderTopLeftRadius,
        primary: el.classList.contains('button-primary'),
        bg:      s.backgroundColor,
      };
    });
};

/**
 * Elementy malujące się literałem koloru w atrybucie `style`.
 *
 * To jest właściwa cena inline'a: token przestaje cokolwiek znaczyć. Zmiana
 * `--evo-accent` przemalowuje panel wszędzie POZA takim miejscem, a rozjazd
 * wychodzi dopiero na zrzucie ekranu. `var(--evo-…)` w inline jest w porządku
 * — zmienna nadal wiąże element z paletą.
 */
window.__hardColors = function () {
  var LITERAL = /(?:^|[:\s,(])(#[0-9a-f]{3,8}\b|rgba?\()/i;
  return Array.prototype.map.call(document.querySelectorAll('#panel [style]'), function (el) {
    var decls = el.getAttribute('style').split(';').map(function (d) { return d.trim(); })
      .filter(function (d) {
        return /^(color|background|background-color|border|border-[a-z-]*color|box-shadow|outline)\s*:/i.test(d)
            && LITERAL.test(d.slice(d.indexOf(':')));
      });
    return decls.length ? { where: where(el), decls: decls } : null;
  }).filter(Boolean);
};

/**
 * Boksy sekcji — wzorzec przejęty z zakładki OpenGraph.
 *
 * Mierzymy tło, ramkę, promień i nagłówek. Nagłówek jest tu równie ważny jak
 * pudełko: to wersalikowa etykieta 11 px, a nie zwykły `h3` — bez niej boks
 * wygląda jak przypadkowa ramka wokół treści.
 */
window.__boxes = function () {
  return Array.prototype.filter.call(document.querySelectorAll('#panel .evo-box'), shown)
    .map(function (el) {
      var s  = getComputedStyle(el);
      var h  = el.querySelector(':scope > h3, :scope > .evo-box-title');
      var hs = h && getComputedStyle(h);
      return {
        bg:     s.backgroundColor,
        border: s.borderTopColor + ' ' + s.borderTopWidth,
        radius: s.borderTopLeftRadius,
        title:  hs && { size: hs.fontSize, weight: hs.fontWeight, transform: hs.textTransform },
        text:   (h ? h.textContent : '').trim().slice(0, 28),
      };
    });
};

/**
 * Co WYSTAJE poza szerokość okna.
 *
 * Element w kontenerze z własnym przewijaniem w poziomie (tabela w `overflow-x:
 * auto`) NIE jest usterką — przewija się wtedy tabela, a nie cały ekran.
 * Bez tego rozróżnienia sprawdzenie zapalałoby się na poprawnym układzie.
 */
window.__overflow = function () {
  var out = [];
  document.querySelectorAll('#panel *').forEach(function (el) {
    var r = el.getBoundingClientRect();
    if (r.right <= window.innerWidth + 1) return;
    for (var n = el.parentElement; n; n = n.parentElement) {
      var ox = getComputedStyle(n).overflowX;
      if (ox === 'auto' || ox === 'scroll') return;
    }
    out.push({
      tag: el.tagName.toLowerCase(),
      cls: String(el.className || '').slice(0, 32),
      over: Math.round(r.right - window.innerWidth),
    });
  });
  return { items: out.slice(0, 5), count: out.length,
           doc: document.documentElement.scrollWidth, win: window.innerWidth };
};

/**
 * Opisy schowane w akordeony i ramki, które mają zostać widoczne.
 *
 * Neutralna ramka informacyjna to treść dla kogoś, kto pyta — nie dla kogoś,
 * kto przyszedł zmienić jedno pole. Trzydzieści osiem takich ramek zajmowało
 * kawał każdej zakładki. Ramki ze STANEM (`is-ok`, `is-warn`, `is-err`)
 * i renderowane warunkowo zostają widoczne: ostrzeżenie w akordeonie jest
 * bezużyteczne, bo nikt go nie rozwinie, zanim nie zobaczy problemu.
 */
window.__notes = function () {
  return Array.prototype.map.call(document.querySelectorAll('#panel .evo-note'), function (d) {
    var sum  = d.querySelector('summary');
    /* Widoczność mierzona WYSOKOŚCIĄ, nie prostokątem treści.
       `getClientRects()` na zwiniętym `<details>` NADAL zwraca prostokąt:
       Chromium trzyma treść w `::details-content` z `content-visibility:
       hidden`, więc pudełko istnieje, choć nic nie widać. Sprawdzenie po
       prostokącie świeciło się na czerwono przy poprawnym markupie.
       Zwinięty `<details>` jest dokładnie tak wysoki jak jego `summary`. */
    return {
      open: d.hasAttribute('open'),
      visible: !!(sum && d.offsetHeight > sum.offsetHeight + 4),
      label: ((sum || {}).textContent || '').trim(),
    };
  });
};

/**
 * Dymki podpowiedzi — długie opisy zdjęte z widoku.
 *
 * Dymek jest bezużyteczny dla kogoś, kto nie może go najechać myszą, więc
 * liczy się nie tylko to, że istnieje: musi mieć nazwę dostępną i dać się
 * osiągnąć klawiaturą. `data-tip` jest treścią dla oka, `aria-label` dla
 * czytnika — rozjazd między nimi znaczy, że jedna z tych dróg pokazuje
 * co innego.
 */
window.__tips = function () {
  return Array.prototype.map.call(document.querySelectorAll('#panel .evo-tip'), function (el) {
    var cs = getComputedStyle(el, '::after');
    return {
      tip:      el.getAttribute('data-tip') || '',
      aria:     el.getAttribute('aria-label') || '',
      tabbable: el.getAttribute('tabindex') === '0',
      // Dymek w spoczynku ma być schowany — inaczej „schowaliśmy opis"
      // znaczyłoby tylko tyle, że zmienił kształt.
      hidden:   cs.visibility === 'hidden' || cs.opacity === '0',
    };
  });
};

/** Ramki, które MAJĄ być widoczne od razu. */
window.__stateBoxes = function () {
  var sel = '#panel .evo-info-box.is-ok, #panel .evo-info-box.is-warn, #panel .evo-info-box.is-err';
  return Array.prototype.map.call(document.querySelectorAll(sel), function (b) {
    return { visible: b.getClientRects().length > 0, cls: String(b.className).slice(0, 40) };
  });
};

/**
 * Co zostaje ODCIĘTE przez kontener chowający nadmiar.
 *
 * `__overflow()` mierzy wyjście poza OKNO i tego nie zobaczy: karta ma
 * `overflow-x: hidden`, więc pasek, który się w niej nie mieści, nie rozpycha
 * strony — po prostu znika za jej krawędzią. Zmierzone w „Logach zdarzeń":
 * przy oknie 360 px wiersz potrzebował 324 px, a miał 300, i „Wyczyść logi"
 * było nie do kliknięcia. Sprawdzenie wystawania poza okno świeciło na zielono.
 *
 * `text-overflow: ellipsis` jest wyłączone z pomiaru — tam ucinanie jest
 * właśnie tym, o co chodzi. Bez tego wyjątku każda skrócona nazwa listy
 * zgłaszałaby się jako usterka.
 */
window.__clipped = function () {
  /* Pole formularza przewija swoją WARTOŚĆ i `scrollWidth` mierzy tam długość
     wpisanego tekstu, nie usterkę układu. Zmierzone: pole nadawcy na 360 px
     zgłaszało 346 px „ucięcia", bo trzyma długi adres URL. */
  var NATIVE = { INPUT: 1, TEXTAREA: 1, SELECT: 1 };
  var out = [];
  document.querySelectorAll('#panel *').forEach(function (el) {
    if (NATIVE[el.tagName]) return;
    var s = getComputedStyle(el);
    if (s.overflowX !== 'hidden' && s.overflowX !== 'clip') return;
    if (s.textOverflow === 'ellipsis') return;
    if (!el.clientWidth) return;                 // elementy inline nie mają boksu
    var cut = el.scrollWidth - el.clientWidth;
    if (cut <= 1) return;

    /* Sam kontener nic nie mówi — szukamy dziecka, które realnie wystaje,
       bo to jego treść prowadzi do miejsca w pliku. Krawędź liczymy po boksie
       WEWNĘTRZNYM (padding box), bo to na nim przycina `overflow`. */
    var r = el.getBoundingClientRect();
    var edge = r.left + el.clientLeft + el.clientWidth;
    var victim = Array.prototype.filter.call(el.querySelectorAll('*'), function (c) {
      return c.getBoundingClientRect().right > edge + 1;
    }).pop();

    out.push({
      cls:  String(el.className || '').slice(0, 32),
      cut:  cut,
      what: victim ? (victim.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 24)
                   : '(brak dziecka)',
    });
  });
  return { items: out.slice(0, 5), count: out.length };
};

/** Szerokości kafelków statystyk — poniżej ~110 px etykieta łamie się
 *  na trzy linie i kafelek przestaje być czytelny. */
window.__stats = function () {
  return Array.prototype.map.call(
    document.querySelectorAll('#panel .evk-nl-stats > *'),
    function (el) { return Math.round(el.getBoundingClientRect().width); });
};

/** Ile inline'owych atrybutów style zostało w wyrenderowanej zakładce. */
window.__inlineCount = function () {
  return document.querySelectorAll('#panel [style]').length;
};
</script>
