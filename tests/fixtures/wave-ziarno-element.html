       skrypty ze stopki wykonują się przed modułem, ale to jest własność
       układu strony, a nie gwarancja, i przy odroczonym ładowaniu przestaje

/**
 * Czeka, aż Animator odegra wejście strony — najwyżej `LIMIT_WEJSCIA` ms.
 *
 * ZGŁOSZONE Z UŻYCIA: „potrzebne jest dodanie opóźnienia uruchamiania wave bg,
 * bo jeśli są na stronie animacje animatora, to jest przeskok".
 *
 * CZEKA BUDOWA SCENY, NIE POBIERANIE BIBLIOTEKI. Pobranie 287 KB three.js idzie
 * siecią i wątku głównego prawie nie dotyka; blokuje dopiero to, co po nim —
 * wykonanie modułu, kompilacja shaderów (zmierzone: 152 ms) i pierwsze klatki
 * pętli rAF. Dlatego `evkWbBoot()` startuje import OD RAZU, a czeka dopiero
 * przed `new EvkWaveBackground()`: opóźnienie nic nie kosztuje w czasie dojazdu.
 *
 * Efekt uboczny, też pożądany: automat jakości (`zmierzKlatke()`) przestaje
 * mierzyć medianę klatki w trakcie cudzej blokady. Schodzi on TYLKO W DÓŁ
 * i nigdy nie wraca, więc pomiar na starcie potrafił trwale zepchnąć falę na pół
 * rozdzielczości albo na nieruchomy kadr — z powodu, który minął po sekundzie.
 *
 * TRZY DROGI WYJŚCIA, każda na inny przypadek:
 * — Animatora na stronie nie ma (`window.evkAnimator`) → nie czekamy wcale;
 * — wejście już się odegrało → flaga, bo zdarzenie dawno przepadło;
 * — wejście trwa i trwa (długa sekwencja, awaria GSAP-a) → limit czasu.
 *   Fala jest tłem i ma się pojawić nawet wtedy, gdy Animator nie dojedzie.
 */
const LIMIT_WEJSCIA = 1200;

function evkWbPoczekajNaWejscie() {
    if (!window.evkAnimator)             return Promise.resolve('bez animatora');
    if (window.evkAnimatorWejscieKoniec) return Promise.resolve('wejście już było');

    return new Promise((ok) => {
        let zrobione = false;
        const koniec = (powod) => {
            if (zrobione) return;
            zrobione = true;
            document.removeEventListener('evk-animator-wejscie', poZdarzeniu);
            ok(powod);
        };
        const poZdarzeniu = () => koniec('po wejściu');

        document.addEventListener('evk-animator-wejscie', poZdarzeniu);
        setTimeout(() => koniec('limit czasu'), LIMIT_WEJSCIA);
    });
}

/** Czeka na `window.gsap` najwyżej dwie sekundy. Potem się poddaje. */
function evkWbPoczekajNaGsap(proba = 0) {
    if (window.gsap) return Promise.resolve(window.gsap);
    if (proba > 40)  return Promise.reject(new Error('GSAP nie pojawił się na stronie'));
    return new Promise((ok, nie) => setTimeout(
        () => evkWbPoczekajNaGsap(proba + 1).then(ok, nie), 50));
}

/**
 * Czy ta przeglądarka rasteryzuje PROGRAMOWO, bez akceleracji sprzętowej.
 *
 * PO CO. Fala rysuje piksele w `requestAnimationFrame`. Na maszynie z GPU robi to
 * karta i wątek główny prawie tego nie widzi. Bez GPU tę samą pracę wykonuje
 * procesor — i wtedy sama animacja, nawet zbita do trzydziestu klatek na sekundę,
 * zjada wątek główny bez przerwy. Zmierzone na żywej stronie porównaniem
 * z wyłączonym modułem: 7119 ms w kategorii „Other" wobec 200 ms bez fali.
 *
 * Zejście pod próg długiego zadania to NIE JEST to samo, co przestać obciążać
 * procesor — pierwsze zbija Total Blocking Time, drugie dopiero uwalnia maszynę.
 * Dlatego tutaj nie schodzimy o szczebel, tylko zatrzymujemy animację na jednym
 * kadrze, tak samo jak przy `prefers-reduced-motion`.
 *
 * ZWRACA `false`, GDY NIE WIADOMO. Rozszerzenie `WEBGL_debug_renderer_info` bywa
 * wyłączone ze względu na prywatność i z czasem będzie coraz częściej. Brak
 * odpowiedzi nie może znaczyć „zamroź" — od zgadywania jest drabina jakości,
 * która mierzy rzeczywisty koszt klatki i nie potrzebuje niczyjej deklaracji.
 */
function evkWbBezAkceleracji(gl) {
    try {
        const ext = gl && gl.getExtension('WEBGL_debug_renderer_info');
        if (!ext) return false;
        const nazwa = String(gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) || '').toLowerCase();
        if (!nazwa) return false;
        return ['swiftshader', 'llvmpipe', 'software', 'microsoft basic render', 'mesa offscreen']
            .some((s) => nazwa.indexOf(s) !== -1);
    } catch (e) {
        return false;
    }
}

/**
 * To samo pytanie co `evkWbBezAkceleracji()`, ale PRZED pobraniem three.js.
 *
 * Tworzy jednorazowe płótno tylko po to, żeby zapytać sterownik, i zaraz je
 * porzuca. Kontekst zwalniamy wprost przez `WEBGL_lose_context`.
 *
 * UCZCIWIE O TEJ LINII: pierwotnie stało tu, że bez zwolnienia można wyczerpać
 * limit kontekstów WebGL na stronie z kilkoma falami. NIE UDAŁO SIĘ TEGO
 * ODTWORZYĆ — w Chromium udało się otworzyć 64 konteksty i przeciek jednego nie
 * zmieniał niczego mierzalnego. Linia zostaje jako porządek (zwolnienie jest
 * natychmiastowe zamiast czekać na sprzątanie pamięci), a nie jako naprawa
 * zmierzonej usterki. Żadne sprawdzenie jej nie pilnuje i mutacja usuwająca ją
 * przechodzi na zielono — jest to zapisane świadomie, nie przeoczone.
 */
function evkWbBezAkceleracjiWstepnie() {
    let c = null, gl = null;
    try {
        c  = document.createElement('canvas');
        gl = c.getContext('webgl2') || c.getContext('webgl');
        /* BRAK KONTEKSTU TO NIE JEST „NIE WIEM".
           `evkWbBezAkceleracji()` celowo odpowiada `false`, gdy nie da się
           odczytać nazwy sterownika — od zgadywania jest drabina jakości. Ale
           gdy płótno nie dostaje kontekstu W OGÓLE (Firefox z `webgl.disabled`,
           Safari z wyłączonym WebGL, stary sprzęt), odpowiedź jest pewna:
           three.js nie ma na czym rysować i `new THREE.WebGLRenderer()` rzuci
           wyjątkiem. Bez tego warunku element pobierał 287 KB tylko po to, żeby
           się wywrócić, i zostawiał w układzie puste miejsce. */
        if (!gl) return true;
        return evkWbBezAkceleracji(gl);
    } catch (e) {
        /* Wyjątek z `getContext` znaczy to samo co jego brak. */
        return true;
    } finally {
        try {
            const strata = gl && gl.getExtension('WEBGL_lose_context');
            if (strata) strata.loseContext();
        } catch (e) { /* nie ma czego zwalniać */ }
    }
}

// ── Perlin noise GLSL — identyczny z referencją ───────────────────────────────
const perlinGLSL = `
vec2 fade(vec2 t){return t*t*t*(t*(t*6.0-15.0)+10.0);}
vec4 permute(vec4 x){return mod(((x*34.0)+1.0)*x,289.0);}
float cnoise21(vec2 P){
  vec4 Pi=floor(P.xyxy)+vec4(0.,0.,1.,1.);
  vec4 Pf=fract(P.xyxy)-vec4(0.,0.,1.,1.);
  Pi=mod(Pi,289.0);
  vec4 ix=Pi.xzxz,iy=Pi.yyww,fx=Pf.xzxz,fy=Pf.yyww;
  vec4 i=permute(permute(ix)+iy);
  vec4 gx=2.0*fract(i*0.0243902439)-1.0,gy=abs(gx)-0.5,tx=floor(gx+0.5);
  gx=gx-tx;
  vec2 g00=vec2(gx.x,gy.x),g10=vec2(gx.y,gy.y),g01=vec2(gx.z,gy.z),g11=vec2(gx.w,gy.w);
  vec4 norm=1.79284291400159-0.85373472095314*vec4(dot(g00,g00),dot(g01,g01),dot(g10,g10),dot(g11,g11));
  g00*=norm.x;g01*=norm.y;g10*=norm.z;g11*=norm.w;
  float n00=dot(g00,vec2(fx.x,fy.x)),n10=dot(g10,vec2(fx.y,fy.y)),n01=dot(g01,vec2(fx.z,fy.z)),n11=dot(g11,vec2(fx.w,fy.w));
  vec2 fade_xy=fade(Pf.xy);
  vec2 n_x=mix(vec2(n00,n01),vec2(n10,n11),fade_xy.x);
  return 2.3*mix(n_x.x,n_x.y,fade_xy.y);
}`;

// ── Vertex shader siatki — port 1:1 ──────────────────────────────────────────
const vertexShader = `
    varying vec2 uPos;
    varying vec2 vUv;
    uniform vec2 uRayMouse;
    uniform float uMouseEffect;
    uniform float uRatio;
    float uTrailWidth = 0.15;
    float PI = ${Math.PI};
    void main(){
        vUv = uv;
        vec2 direction = normalize(position.xy - uRayMouse);
        float distanceToMouse = length(position.xy - uRayMouse);
        float falloff = smoothstep(0., uTrailWidth, distanceToMouse);
        float displacement = uMouseEffect * 0.1 * falloff;
        vec3 newPosition = vec3(position.xy - direction * displacement / 2., position.z);
        uPos = direction * displacement * 2.;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`;

// ── Fragment shader siatki — port 1:1 ────────────────────────────────────────
const fragmentShader = `
    uniform float uTime;
    uniform vec2 uRayMouse;
    uniform float uMouseEffect;
    uniform float uNoiseAmount;
    uniform float uAmount;
    uniform float uPow;
    uniform float uAlpha;
    varying vec2 vUv;
    varying vec2 uPos;
    uniform vec3 uColor[6];
    float PI = ${Math.PI};
    ${perlinGLSL}
    void main(){
        vec3 firstColor = uColor[0];
        vec2 seed = (vUv * -uPos) * mix(vUv, uPos, 30. * uAmount);
        float ml = pow(6., 0.5) * -0.01;
        float n = cnoise21(seed) + 1. * uTime;
        vec3 color;
        color = mix(firstColor, firstColor, cnoise21(seed) / 1000.);
        for(int i = 1; i < 5; i++){
            float amount = (float(i) + 1.) * 0.09;
            float n2 = smoothstep(amount*uTime+ml, amount*uTime+ml+amount*uTime, n*uTime);
            color = mix(color, uColor[i], n2);
        }
        float alpha = uAlpha * pow(sin(vUv.x * PI), uPow);
        alpha *= pow(sin(vUv.y * PI), uPow);
        gl_FragColor = vec4(color, alpha);
    }`;

                shapeAmount:      CONFIG.customBg.shapeAmount,
                distortionAmount: CONFIG.customBg.distortionAmount,
                speedMultiplier:  CONFIG.customBg.speedMultiplier,
                timeStart:        CONFIG.customBg.timeStart,
              }
            : BACKGROUNDS[CONFIG.variation] || BACKGROUNDS[0];

        this.width         = container.offsetWidth;
        this.height        = container.offsetHeight;
        this.positionZ     = 4000;
        this.time          = this.bg.timeStart;
        this.uTime         = 0.1;
        this.reverseUTime  = false;
        this.allowRayMouse = false;
        /* Zbiór powodów wstrzymania. Zastąpił flagę `paused` w 1.151.0 —
           powody są niezależne i nie mogą się nawzajem odkręcać. */
        this.powody        = new Set();
        this.obserwator    = null;
        this.bezAkceleracji = false;
        /* Drabina jakości: 0 pełna, 1 bez post-processingu, 2 dodatkowo w połowie
           rozdzielczości, 3 nieruchomy kadr. `probki` zbiera odstępy klatek. */
        this.poziom        = 0;
        this.probki        = [];
        this.ostatniaKlatka = 0;
        this.rafId         = null;

        this.settings = {
            mouseEffect:      CONFIG.mouseEffect,
            distortionAmount: this.bg.distortionAmount,
            shapeAmount:      this.bg.shapeAmount,
            speedMultiplier:  this.bg.speedMultiplier,
        };

        // Scene
        this.scene = new THREE.Scene();

        // Renderer — alpha:true, przezroczyste tło; kontener może mieć własne CSS background
        //
        // preserveDrawingBuffer: element bywa tłem dla treści z mix-blend-mode.
        // Tryb mieszania zmusza przeglądarkę do odczytania pikseli płótna, a przy
        // domyślnym `false` WebGL wolno je porzucić zaraz po wyświetleniu — odczyt
        // trafia wtedy na pusty bufor i treść miesza się z niczym zamiast z falą.
        // Objawia się to migotaniem na czarno/biało co kilka sekund.
        //
        // OD 1.151.0 DOMYŚLNIE WYŁĄCZONY i przestawiany kontrolką. Komentarz stał
        // tu wcześniej razem z oszacowaniem kosztu na „jedną kopię bufora na
        // klatkę" — POMIAR TEGO NIE POTWIERDZIŁ: 133,3 ms wobec 133,4 ms bez
        // niego, czyli różnica w szumie. Włączamy go więc tam, gdzie naprawdę
        // jest potrzebny, a nie wszędzie na wszelki wypadek.
        this.renderer = new THREE.WebGLRenderer({
            alpha: true,
            powerPreference: 'high-performance',
            /* PRZY „OGRANICZ RUCH" WYMUSZONY, i to nie jest ozdoba.
               Bez akceleracji i przy ograniczonym ruchu rysujemy JEDEN kadr
               i nie zamawiamy następnego — a przy `preserveDrawingBuffer:false`
               przeglądarce wolno porzucić zawartość płótna zaraz po
               wyświetleniu. Przy działającej pętli nikt tego nie zauważy, bo
               następna klatka zaraz domaluje; przy jednym kadrze wystarczy
               przewinięcie albo powrót do karty i zostaje puste miejsce.
               Koszt zmierzony wcześniej: 133,3 wobec 133,4 ms, czyli żaden. */
            preserveDrawingBuffer: CONFIG.preserveBuffer || evkWbReduced(),
        });
        this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, CONFIG.pixelRatioCap));

        /* Sprawdzamy KONTEKST, którego naprawdę używamy, a nie nowe płótno obok. */
        this.bezAkceleracji = CONFIG.autoJakosc && evkWbBezAkceleracji(this.renderer.getContext());
        this.renderer.setSize(this.width, this.height);
        this.renderer.setClearColor(0x000000, 0);
        container.appendChild(this.renderer.domElement);

        // Camera
        this.camera = new THREE.PerspectiveCamera(40, this.width / this.height, 10, 10000);
        this.camera.position.z = this.positionZ;
        this.camera.aspect     = this.width / this.height;
        this.camera.fov        = 2 * Math.atan(this.height / 2 / this.positionZ) * (180 / Math.PI);
        this.camera.updateProjectionMatrix();

        // Mouse
        this.uMouse    = new THREE.Vector2(0, 0);
        this.rayMouse  = new THREE.Vector2(1, 1);
        this.raycaster = new THREE.Raycaster();
        this.rayXTo = gsap.quickTo(this.rayMouse, 'x', { duration: 0.75, ease: 'power1' });
        this.rayYTo = gsap.quickTo(this.rayMouse, 'y', { duration: 0.75, ease: 'power1' });

        this.initPostProcessing();
        this.addObjects();
        this.resize();
        this.render();
        this.setupResize();
        this.followMouse();
    }

    initPostProcessing() {
        this.composer = new EffectComposer(this.renderer);
        this.composer.addPass(new RenderPass(this.scene, this.camera));
        this.effect1 = new ShaderPass(dotScreenShader());
        this.effect1.uniforms.uAmount.value       = this.settings.distortionAmount;
        this.effect1.uniforms.uMouseEffect.value  = this.settings.mouseEffect;
        this.effect1.uniforms.uNoiseEnabled.value  = CONFIG.noiseEnabled ? 1.0 : 0.0;
        this.effect1.uniforms.uNoiseIntensity.value = CONFIG.noiseIntensity;
        this.effect1.uniforms.uNoiseSpread.value    = CONFIG.noiseSpread || 0;
        this.composer.addPass(this.effect1);
    }

    addObjects() {
        this.material = new THREE.ShaderMaterial({
            uniforms: {
                uTime:        { value: 0 },
                uNoiseAmount: { value: 0 },
                uRayMouse:    { value: this.uMouse },   // zastępowane w render() przez rayMouse
                uAmount:      { value: this.settings.shapeAmount },
                uPow:         { value: 3 },
                uAlpha:       { value: 0 },
                uColor:       { value: COLORS },
                uMouseEffect: { value: this.settings.mouseEffect },
                uVelocity:    { value: 0 },
                uRatio:       { value: 1 },
            },
            side: THREE.DoubleSide,
            transparent: true,
            vertexShader,
            fragmentShader,
        });
        this.geometry = new THREE.PlaneGeometry(1, 1, 128, 128);
        this.plane    = new THREE.Mesh(this.geometry, this.material);
        this.camera.rotation.z = -this.bg.rotation;  // negacja — referencja renderuje w przeciwnym kierunku
        this.initResponsivePositioning();
        this.scene.add(this.plane);
    }

    initResponsivePositioning() {
        this.plane.scale.x = this.bg.widthMultiplier  * this.width;
        this.plane.scale.y = this.bg.heightMultiplier * 1.25 * this.height;
        this.plane.scale.z = this.bg.widthMultiplier  * this.width;
        this.camera.position.x = this.bg.position.x  * this.width;
        this.camera.position.y = -this.bg.position.y  * this.height;
        this.material.uniforms.uRatio.value = this.plane.scale.x / this.plane.scale.y;
    }

    setupResize() {
        // Referencja trzymana w polu: .bind() tworzy za każdym wywołaniem NOWĄ
        // funkcję, więc removeEventListener z osobnym .bind() nigdy niczego nie
        // zdejmował i nasłuch przeżywał destroy().
        this.onResize = this.resize.bind(this);
        window.addEventListener('resize', this.onResize);
    }

    resize() {
        this.width  = this.container.offsetWidth;
        this.height = this.container.offsetHeight;
        this.camera.aspect = this.width / this.height;
        this.camera.fov    = 2 * Math.atan(this.height / 2 / this.positionZ) * (180 / Math.PI);
        this.camera.updateProjectionMatrix();
        this.renderer.setSize(this.width, this.height);
        if (this.composer) this.composer.setSize(this.width, this.height);
        this.initResponsivePositioning();
    }

    followMouse() {
        // window — kontener ma pointer-events:none i nie odbiera eventów
        const mX = gsap.quickTo(this.uMouse, 'x', { duration: 0.5, ease: 'power1' });
        const mY = gsap.quickTo(this.uMouse, 'y', { duration: 0.5, ease: 'power1' });

        window.addEventListener('mousemove', (e) => {
            mX(e.clientX / this.width  - 0.5);
            mY(e.clientY / this.height - 0.5);
            this.checkPositionOnPlane(e);
        });
    }

    checkPositionOnPlane(e) {
        // NDC z window — jak w referencji
        const ndc = new THREE.Vector2(
            (e.clientX / window.innerWidth)  *  2 - 1,
            (e.clientY / window.innerHeight) * -2 + 1
        );
        this.raycaster.setFromCamera(ndc, this.camera);
        const hits = this.raycaster.intersectObject(this.plane);
        if (hits.length > 0 && this.allowRayMouse) {
            this.rayXTo(hits[0].point.x / this.plane.scale.x);
            this.rayYTo(hits[0].point.y / this.plane.scale.y);
        }
    }

    /**
     * Stan, do którego dochodzi animacja wejściowa — jedno miejsce, dwa użycia.
     *
     * Wartości muszą być te same tutaj i w `animateIn()`, inaczej nieruchomy kadr
     * wyglądałby inaczej niż fala po wejściu. Stąd stała zamiast dwóch liczb
     * wpisanych osobno.
     */
    static get STAN_KONCOWY() { return { uPow: 1.5, uAlpha: 1 }; }

    /**
     * Ustawia stan końcowy od razu, bez animacji.
     *
     * POTRZEBNE WSZĘDZIE TAM, GDZIE RYSUJEMY JEDEN KADR I KOŃCZYMY.
     * `uAlpha` startuje od ZERA i dochodzi do jedynki dopiero animacją wejściową
     * — pojedyncza klatka narysowana przed nią jest więc CAŁKOWICIE NIEWIDOCZNA.
     * Dotyczyło to także ścieżki `prefers-reduced-motion`, która obiecywała
     * w komentarzu, że „gradient zostaje na ekranie", a w rzeczywistości nie
     * rysowała nic. Znalezione przy dokładaniu kadru dla maszyn bez akceleracji.
     */
    ustawStanKoncowy() {
        const k = EvkWaveBackground.STAN_KONCOWY;
        this.material.uniforms.uPow.value   = k.uPow;
        this.material.uniforms.uAlpha.value = k.uAlpha;
    }

    animateIn(duration, delay) {
        const k = EvkWaveBackground.STAN_KONCOWY;
        /* Bez animacji nie ma czego animować — od razu stan końcowy, żeby fala
           była widoczna. */
        if (evkWbReduced()) {
            this.ustawStanKoncowy();
            this.rysujRaz();
            return;
        }
        gsap.to(this.material.uniforms.uPow,   { value: k.uPow,   duration, delay, ease: 'power4.out' });
        gsap.to(this.material.uniforms.uAlpha, { value: k.uAlpha, duration, delay, ease: 'power4.out' });
        this.allowRayMouse = false;
        gsap.to(this.rayMouse, {
            x: -0.4, y: -0.4,
            duration,
            ease: 'power1.out',
            immediateRender: false,   // jak w referencji
            onComplete: () => { this.allowRayMouse = true; },
        });
    }

    /** Jedna klatka, bez zamawiania następnej. */
    rysujRaz() {
        if (this.poziom === 0) this.composer.render();
        else                   this.renderer.render(this.scene, this.camera);
    }

    render() {
        this.time += 0.01;

        if (this.reverseUTime) {
            this.uTime -= 0.001;
            if (this.uTime < 0.1) this.reverseUTime = false;
        } else {
            this.uTime += 0.001;
            if (this.uTime > 0.5) this.reverseUTime = true;
        }

        this.material.uniforms.uTime.value     = this.uTime;
        this.material.uniforms.uRayMouse.value = this.rayMouse;
        this.effect1.uniforms.uMouse.value     = this.uMouse;
        this.effect1.uniforms.uTime.value      = this.time * this.settings.speedMultiplier;
        if (CONFIG.noiseEnabled) {
            this.effect1.uniforms.uNoiseSeed.value = Math.random();
        }

        // Tylko composer. Referencja wołała tu jeszcze renderer.render(), ale
        // ostatni ShaderPass i tak renderuje na ekran przez setRenderTarget(null)
        // nieprzezroczystym materiałem, więc nadpisuje wszystko — sprawdzone
        // porównaniem zrzutów: obraz jest identyczny co do piksela. Był to pełny,
        // wyrzucany przebieg sceny na każdą klatkę, czyli podwojona praca
        // shadera przy dwukrotnym DPR na telefonie.
        /* Od pierwszego szczebla w dół rysujemy scenę wprost, z pominięciem
           `EffectComposer`. Znika wtedy przebieg z szumem, zniekształceniem
           i reakcją na mysz — to jest cena, którą płaci maszyna bez GPU. */
        if (this.poziom === 0) this.composer.render();
        else                   this.renderer.render(this.scene, this.camera);

        this.zmierzKlatke();

        // Redukcja ruchu: jedna klatka i koniec. Gradient zostaje na ekranie —
        // to element dekoracyjny, więc jego zniknięcie zmieniłoby układ strony —
        // ale pętla rAF nie startuje. Wspólna polityka: includes/anim/motion.php.
        if (evkWbReduced()) return;

        /* Wstrzymanie mogło przyjść w trakcie tej klatki — wtedy nie zamawiamy
           następnej i zerujemy uchwyt, żeby `wznow()` wiedział, że pętla stoi. */
        if (this.powody.size) { this.rafId = 0; return; }

        this.rafId = requestAnimationFrame(() => this.render());
    }

    /**
     * Mierzy odstępy między klatkami i schodzi o szczebel, gdy jest za wolno.
     *
     * DLACZEGO ODSTĘP, A NIE CZAS `render()`. Zmierzone: samo `composer.render()`
     * wraca po 1,5 ms, bo WebGL tylko kolejkuje polecenia — prawdziwa praca
     * dzieje się poza tym wywołaniem i przy renderowaniu programowym ląduje
     * na wątku głównym dopiero potem. Odstęp między klatkami widzi CAŁY koszt,
     * łącznie z rasteryzacją i składaniem obrazu.
     *
     * MEDIANA, NIE ŚREDNIA — i dlatego pierwszych klatek NIE odcinamy.
     * Kompilacja shaderów kosztuje jednorazowo 152 ms (zmierzone), ale jedna
     * duża próbka na dwadzieścia pięć nie rusza mediany. Stało tu wcześniej
     * pomijanie pięciu pierwszych klatek; mutacja pokazała, że nie pilnuje
     * niczego, bo mediana i tak jest na taki wyskok odporna.
     *
     * SCHODZIMY TYLKO W DÓŁ. Powrót w górę po chwilowym zwolnieniu dawałby
     * migotanie jakości przy każdym cięższym momencie strony.
     */
    zmierzKlatke() {
        if (!CONFIG.autoJakosc || this.poziom >= 3) return;

        const teraz = performance.now();
        if (this.ostatniaKlatka) this.probki.push(teraz - this.ostatniaKlatka);
        this.ostatniaKlatka = teraz;

        if (this.probki.length < 25) return;

        const posortowane = this.probki.slice().sort((a, b) => a - b);
        const mediana = posortowane[Math.floor(posortowane.length / 2)];
        this.probki = [];
        this.ostatniaKlatka = 0;

        if (mediana <= CONFIG.budzetKlatki) return;
        this.obnizJakosc(mediana);
    }

    obnizJakosc(mediana) {
        this.poziom++;

        if (this.poziom === 2) {
            /* Połowa rozdzielczości to czterokrotnie mniej pikseli do policzenia.
               `resize()` przelicza rozmiary pod nowy współczynnik. */
            this.renderer.setPixelRatio(0.5);
            this.resize();
        }

        if (this.poziom >= 3) {
            /* Ostatni szczebel: nieruchomy kadr. Gradient zostaje na ekranie —
               element jest dekoracyjny, więc jego zniknięcie zmieniłoby układ
               strony. Ta sama polityka co przy `prefers-reduced-motion`. */
            this.wstrzymaj('jakosc');
        }

        /* Diagnostyka na żądanie, tak jak `?evk-anim-debug=1` w Animatorze —
           bez tego zejście o szczebel jest niewidoczne i nie da się go zgłosić. */
        if (evkWbDebug()) {
            console.log('[EVK Wave] ' + Math.round(mediana) + ' ms na klatkę przy budżecie '
                + CONFIG.budzetKlatki + ' ms — schodzę na poziom ' + this.poziom
                + (this.poziom >= 3 ? ' (nieruchomy kadr)' : ''));
        }
    }

    /**
     * Wstrzymanie i wznowienie pętli — ZBIÓR POWODÓW, nie flaga.
     *
     * Powody są dwa i niezależne: próg przewinięcia (`scrollPauseEnabled`)
     * i wyjście elementu poza ekran. Przy zwykłej fladze ten, który wznawia,
     * odkręcałby także pauzę tego drugiego. Warunek na `rafId` pilnuje osobnej
     * rzeczy: podwójne wznowienie wystartowałoby DWIE pętle rAF na tym samym
     * obiekcie i element renderowałby się dwa razy na klatkę.
     */
    wstrzymaj(powod) {
        /* Samo dopisanie powodu — pętlę zatrzymuje `render()`, kiedy go zobaczy.
         *
         * Stało tu jeszcze `cancelAnimationFrame`, ale mutacja pokazała, że oba
         * mechanizmy zasłaniają się nawzajem: zdjęcie któregokolwiek z osobna
         * nie zmieniało niczego mierzalnego. Został ten, który jest poprawny
         * w OBU przypadkach. Samo anulowanie nie wystarcza, gdy pauza przyjdzie
         * w trakcie klatki: uchwyt jest już zużyty, anulowanie go nic nie robi,
         * a `render()` na końcu zamawia następną klatkę i pętla leci dalej.
         * Cena tego uproszczenia to najwyżej jedna klatka po pauzie. */
        this.powody.add(powod);
    }

    wznow(powod) {
        this.powody.delete(powod);
        if (this.powody.size || this.rafId) return;
        this.rafId = requestAnimationFrame(() => this.render());
    }

    destroy() {
        window.removeEventListener('resize', this.onResize);
        if (this.obserwator) this.obserwator.disconnect();
        cancelAnimationFrame(this.rafId);
        this.plane.geometry.dispose();
        this.plane.material.dispose();
        this.renderer.dispose();
        if (this.container.contains(this.renderer.domElement)) {
            this.container.removeChild(this.renderer.domElement);
        }
    }

    initScrollBehavior() {
        if (CONFIG.scrollFadeEnabled) {
            const thr = CONFIG.scrollFadeThreshold;
            let lastState = null;
            this.container.style.transition = `opacity ${CONFIG.scrollFadeDuration}ms ease`;
            const onScroll = () => {
                const state = window.scrollY >= thr ? 'out' : 'in';
                if (state === lastState) return;
                lastState = state;
                this.container.style.opacity = state === 'out' ? CONFIG.scrollFadeOpacity : '';
            };
            window.addEventListener('scroll', onScroll, { passive: true });
            onScroll();
        }

        if (CONFIG.scrollPauseEnabled) {
            const thr = CONFIG.scrollPauseThreshold;
            window.addEventListener('scroll', () => {
                if (window.scrollY >= thr) this.wstrzymaj('scroll');
                else                       this.wznow('scroll');
            }, { passive: true });
        }

        /* ZATRZYMANIE POZA EKRANEM.
         *
         * Zmierzone przed tą zmianą: pętla chodziła z pełną prędkością także
         * po przewinięciu o 3000 px — 30 klatek na 3 sekundy tak samo w polu
         * widzenia, jak i daleko poza nim. Element dekoracyjny w nagłówku
         * liczył więc falę przez cały czas czytania strony.
         *
         * Obserwator, a nie próg przewinięcia: próg nie wie, gdzie element
         * naprawdę jest — przy fali w stopce albo w środku strony myliłby się
         * w obie strony. `rootMargin` daje zapas, żeby fala była już policzona,
         * zanim wjedzie w kadr. */
        if (CONFIG.pauseOffscreen && 'IntersectionObserver' in window) {
            this.obserwator = new IntersectionObserver((wpisy) => {
                wpisy.forEach((w) => {
                    if (w.isIntersecting) this.wznow('ekran');
                    else                  this.wstrzymaj('ekran');
                });
            }, { rootMargin: '200px' });
            this.obserwator.observe(this.container);
        }
    }
}

// ── Boot ──────────────────────────────────────────────────────────────────────
/**
 * Zastępnik na maszynę bez akceleracji: gradient CSS z TEJ SAMEJ palety.
 *
 * Kąt i rozkład przystanków przybliżają pasmo, które rysuje shader — nie jest to
 * ta sama fala i nie udaje, że jest. Chodzi o to, żeby na maszynie, która i tak
 * dostałaby jeden nieruchomy kadr, dostać go ZA DARMO: bez 287 KB biblioteki
 * i bez kompilacji shaderów.
 *
 * Maska (`mask-image` z krzywej S) siedzi już na kontenerze, więc wygaszenie
 * krawędzi działa na gradiencie tak samo jak działało na płótnie.
 */
function evkWbGradientZastepczy(container) {
    /* WŁASNY OBRAZ WYGRYWA. Kadr wyeksportowany z prawdziwej fali wygląda tak,
       jak ona — gradient poniżej tylko ją przypomina. Cudzysłowy i ukośniki
       uciekamy, bo adres wchodzi do wartości arkusza jako `url("…")`. */
    const obraz = CONFIG.zastepnikObraz || '';
    if (obraz) {
        container.style.backgroundImage    = 'url("' + obraz.replace(/["\\]/g, '\\$&') + '")';
        container.style.backgroundSize     = 'cover';
        container.style.backgroundPosition = 'center';
        container.style.backgroundRepeat   = 'no-repeat';
        container.setAttribute('data-evk-wb-zastepnik', '1');
        return true;
    }

    const k = CONFIG.colors || [];
    if (k.length < 2) return false;

    /* Barwa po ułamku palety, nie po indeksie — palety mają dziś po sześć
       kolorów, ale własna może mieć mniej i wtedy `k[4]` byłoby `undefined`,
       czyli łańcuch „undefinedcc" w arkuszu i cała warstwa wypadałaby po cichu. */
    const barwa = (u) => k[Math.min(k.length - 1, Math.round(u * (k.length - 1)))];
    const krem = barwa(0), cyan = barwa(0.2), fiolet = barwa(0.4),
          roz  = barwa(0.6), magenta = barwa(0.8);

    /* PASMO WCHODZI Z PRAWEJ, TŁO ZOSTAJE PRZEZROCZYSTE.
     *
     * Rysowane z fotografii prawdziwej fali: lewa połowa kadru to czysty kolor
     * sekcji, mniej więcej w połowie szerokości wchodzi kremowe czoło, za nim
     * wąska smuga cyjanu, a prawą stronę wypełniają dwa płaty magenty spięte
     * fioletem — górny przy prawej krawędzi, dolny przy dolnej.
     *
     * Poprzednia wersja kładła na to `rgba(0,0,0,0.55)` winiety „bo shader
     * wygasza brzegi". Shader wygasza KRYCIE, a nie jasność — winieta
     * przyciemniała jasną kompozycję i wychodziła z tego zupełnie inna rzecz.
     * Tu wygaszamy tak samo: przezroczystością.
     *
     * To nie jest ta sama fala i nie udaje, że jest. Chodzi o to, żeby maszyna,
     * która i tak dostałaby jeden nieruchomy kadr, dostała go ZA DARMO — bez
     * 287 KB biblioteki i bez kompilacji shaderów. Maska (`mask-image` z krzywej
     * S) siedzi już na kontenerze i wygasza krawędzie tak samo jak przy płótnie. */
    /* KOLEJNOŚĆ WARSTW JEST CZĘŚCIĄ RYSUNKU, nie porządkiem alfabetycznym:
       pierwsza w tablicy leży na wierzchu. Cyjan stoi NAD fioletem, bo na
       zdjęciu jest wyraźnym pasem na czole pasma — pod fioletem gasł i pierwsza
       wersja wyszła przez to pastelowa zamiast nasyconej. */
    container.style.backgroundImage = [
        'radial-gradient(ellipse 56% 60% at 93% 14%, ' + magenta + 'ff 0%, ' + magenta + 'b3 36%, transparent 70%)',
        'radial-gradient(ellipse 52% 50% at 77% 99%, ' + roz     + 'ff 0%, ' + roz     + 'a6 38%, transparent 72%)',
        'radial-gradient(ellipse 20% 68% at 62% 46%, ' + cyan    + 'e6 0%, ' + cyan    + '73 44%, transparent 74%)',
        'radial-gradient(ellipse 44% 78% at 87% 58%, ' + fiolet  + 'd9 0%, ' + fiolet  + '73 44%, transparent 76%)',
        'linear-gradient(112deg, transparent 33%, '    + krem    + 'e6 46%, ' + krem   + '73 57%, transparent 68%)',
    ].join(', ');
    container.setAttribute('data-evk-wb-zastepnik', '1');
    return true;
}

async function evkWbBoot(tries = 0) {
    const container = document.getElementById(CONTAINER_ID);
    if (!container) {
        if (tries < 50) setTimeout(() => evkWbBoot(tries + 1), 50);
        else console.error('EvkWaveBackground: nie znaleziono #' + CONTAINER_ID);
        return;
    }

    /* PROBKA PRZED POBRANIEM BIBLIOTEKI. Tymczasowe płótno wystarczy, żeby
       zapytać sterownik — a to jedyne, czego potrzeba, żeby wiedzieć, że
       pobieranie three.js nie ma sensu. */
    if (CONFIG.autoJakosc && evkWbBezAkceleracjiWstepnie()) {
        if (evkWbDebug()) console.log('[EVK Wave] brak akceleracji sprzętowej — gradient CSS, bez ładowania three.js');
        if (evkWbGradientZastepczy(container)) return;
    }

    /* BIBLIOTEKI JADĄ Z CUDZEGO SERWERA. Gdy esm.sh nie odpowiada — awaria,
       blokada sieci, strona za korporacyjnym filtrem — obietnica odrzuca się
       i bez tego przechwycenia element po prostu znika, zostawiając w układzie
       dziurę. Zastępnik już mamy; niech posłuży także tutaj. */
    let instance;
    try {
        /* Import RUSZA TERAZ, budowa czeka — patrz `evkWbPoczekajNaWejscie()`.
           Kolejność tych dwóch linii jest całą zmianą: odwrócona kazałaby
           pobierać bibliotekę dopiero po wejściu strony i fala pojawiałaby się
           o cały dojazd sieci później. */
        const biblioteki = evkWbZaladujBiblioteki();
        /* Odrzucenie obsługuje `await` niżej, razem z resztą budowy. Ta klamra
           jest tylko po to, żeby przeglądarka nie zgłosiła go jako nieobsłużone
           w tej chwili — obietnica czeka bez odbiorcy przez czas wejścia strony. */
        biblioteki.catch(() => {});

        const powod = await evkWbPoczekajNaWejscie();
        if (evkWbDebug()) console.log('[EVK Wave] start sceny: ' + powod);

        await biblioteki;
        instance = new EvkWaveBackground(container);
    } catch (e) {
        /* Obejmuje też BUDOWĘ sceny, nie samo pobranie. Konstruktor sięga po
           `gsap.quickTo` i po WebGL — jedno i drugie potrafi się wywrócić,
           a wtedy bez tej klamry zostawał nieobsłużony wyjątek i puste miejsce
           w układzie strony zamiast czegokolwiek. */
        console.warn('[EVK Wave] fala nie wystartowała: ' + e.message);
        /* KONSTRUKTOR ZDĄŻYŁ JUŻ WSTAWIĆ PŁÓTNO, zanim się wywrócił — dokłada je
           do kontenera na długo przed `gsap.quickTo` i przed pierwszym
           renderowaniem. Zostawione, przykrywałoby zastępnik pustym prostokątem.
           Zmierzone: bez tej linii płótno zostawało w drzewie i sprawdzenie
           „fala wystartowała" przechodziło mimo wywrotki. */
        const plotno = container.querySelector('canvas');
        if (plotno) plotno.remove();
        evkWbGradientZastepczy(container);
        return;
    }

    /* DRUGA LINIA OBRONY. Probka przed importem odpowiada „nie wiem" (czyli
       `false`), gdy nazwa sterownika jest niedostępna — i wtedy dowiadujemy się
       prawdy dopiero z kontekstu, którego renderer naprawdę używa.
       Do 1.154.0 zostawał tu ZAMROŻONY KADR i to była usterka: płótno bez
       `preserveDrawingBuffer` wolno przeglądarce wyczyścić zaraz po
       wyświetleniu, a nic go już nie odrysowywało — zostawało puste miejsce.
       Zdejmujemy więc płótno i rysujemy ten sam zastępnik co wyżej: gradient
       albo obraz z kontrolki. Deterministycznie, bez zależności od tego, kiedy
       przeglądarka zechce posprzątać bufor. */
    if (instance.bezAkceleracji) {
        if (evkWbDebug()) console.log('[EVK Wave] brak akceleracji sprzętowej — zastępnik zamiast płótna');
        instance.destroy();
        evkWbGradientZastepczy(container);
        return;
    }

    /* UCHWYT DO PORÓWNAŃ WZROKOWYCH, tylko przy `?evk-wave-debug=1`.
     *
     * PO CO. Fala rysuje kadr zależny od `this.time`, a ten zależy od tego, ile
     * razy zdążył wypaść `render()` — czyli od obciążenia maszyny. Zmierzone:
     * dwa przebiegi TEGO SAMEGO kodu dają zrzuty różniące się średnio o 10
     * poziomów jasności przy maksimum 129. To więcej niż różnica, którą chce
     * się zwykle wykryć, więc porównywanie zrzutów bez ustalonej chwili animacji
     * jest bezwartościowe — i przez chwilę wyciągałem z takich porównań wnioski.
     *
     * Uchwyt pozwala testowi ustawić chwilę wprost i narysować jeden kadr. */
    if (evkWbDebug()) window.__evkWave = instance;

    instance.initScrollBehavior();
    instance.animateIn(2, 0.5);   // jak w referencji: animateIn(2, .5)
}
evkWbBoot();
</script>
