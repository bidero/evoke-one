<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Powłoka buildera — atrapa (przyciski AI)</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #1f2229; color: #e5e7eb; }
  #bricks-toolbar-top { display: flex; justify-content: space-between; align-items: center; height: 48px; background: #23282d; color: #fff; }
  .group-wrapper { display: flex; gap: 6px; list-style: none; margin: 0; padding: 0 8px; }
  .group-wrapper button { background: none; border: 0; color: inherit; font: inherit; }
  .uklad { display: flex; }
  .bricks-panel-controls { width: 300px; padding: 8px; box-sizing: border-box; }
  .control-groups { margin: 0; padding: 0; list-style: none; }
  [data-controlkey] { margin: 0 0 10px; }
  .control-inner label { display: block; font-size: 12px; margin: 0 0 3px; }
  /* Wymiary z próby na testowej (30.09): pole tekstowe 256×32 i ⚡ 28×32 w wierszu
     flex; textarea 284×130 z ⚡ 20×20 w prawym górnym rogu, 4 px od krawędzi. */
  .has-dynamic-data[data-control="text"] { display: flex; align-items: center; position: relative; }
  .input-wrapper { flex: 1 1 auto; min-width: 0; }
  .control-inner input { display: block; width: 100%; height: 32px; box-sizing: border-box; }
  [data-control="textarea"] { display: block; position: relative; }
  [data-control="textarea"] textarea { display: block; width: 100%; height: 130px; box-sizing: border-box; padding: 8px; font: 13px/1.4 sans-serif; }
  .dynamic-tag-picker-button { flex: none; display: flex; align-items: center; justify-content: center; width: 28px; height: 32px; box-sizing: border-box; cursor: pointer; }
  [data-control="textarea"] > .dynamic-tag-picker-button { position: absolute; top: 4px; right: 4px; width: 20px; height: 20px; }
  /* Bricks stylizuje przyciski panelu — wielkie litery i marginesy (uwaga zgłaszającego). */
  .bricks-panel-controls button { text-transform: uppercase; margin: 0 4px; padding: 2px 10px; background: #333; }
  .repeater-item { margin: 6px 0 6px 10px; padding-left: 8px; border-left: 2px solid #555; }
  #bricks-builder-iframe { display: block; width: 900px; height: 700px; border: 0; background: #fff; }
</style>
</head>
<body>
<!--
  Powłoka jak w builder-podglad.html (próby 1.257: stan Vue na `div.brx-body.main`,
  pasek `#bricks-toolbar-top`, kanwa w ramce) i do tego panel w kształcie z próby
  A4 (docs/proby-builder-ai.md, 30.09): `li.control-group[data-control-group="evk_tl"]
  > div[data-controlkey="evk_tl_en__text"] > div.control.control-text >
  div.control-inner.has-label > label + div.has-dynamic-data > (div.input-wrapper
  > input) + ⚡`. Pola pozycji listy siedzą w kontrolce listy
  (`div[data-controlkey="items"]`).

  Podstawowy tekst (1.266.0, próba z 30.09): textarea z ⚡ absolutnym i drugie
  pole, „Czytaj więcej”, ukryte warunkiem — Bricks zostawia wtedy PUSTĄ
  obudowę `div[data-controlkey="evk_tl_en__readMore"]`, bez `.control`.

  Atrapa panelu robi to, co Vue: przy zmianie zaznaczenia rysuje panel od nowa
  (obce węzły znikają), a pola trzymają się ustawień jak `v-model` — pisanie
  w polu zmienia stan, zmiana stanu zmienia pole (poza polem z fokusem).
-->
<div class="brx-body main">
  <div id="bricks-toolbar-top" class="bricks-toolbar toolbar-top">
    <ul class="group-wrapper start"><li><button type="button">Elementy</button></li></ul>
    <ul class="group-wrapper center breakpoints"><li><button type="button">Komputer</button></li><li><button type="button">Telefon</button></li></ul>
    <ul class="group-wrapper end"><li><button type="button" id="zapisz">Zapisz</button></li></ul>
  </div>
  <div class="uklad">
    <div id="bricks-panel" class="bricks-panel-controls"><div class="regular-controls-wrapper"><ul class="control-groups" id="grupy"></ul></div></div>
    <iframe id="bricks-builder-iframe" title="Kanwa" src="builder-podglad-kanwa.html"></iframe>
  </div>
  <script>
    /* Elementy z `children` i `parent` jak w Bricksie. Identyfikatory h1, t1, b1,
       s1, h2, a1, k1, h3, sl1 mają węzły w kanwie (builder-podglad-kanwa.html). */
    var s9 = [];
    for (var i = 1; i <= 27; i++) s9.push({ id: 'n' + i, name: 'heading', parent: 's9', children: [], settings: { text: 'Pozycja ' + i } });
    window.__stan = {
      activeId: null,
      header: [
        { id: 'hd1', name: 'heading', parent: 0, children: [], settings: { text: 'Menu główne' } },
      ],
      footer: [],
      content: [
        { id: 's1', name: 'section', parent: 0, children: ['h2', 'a1', 'z1'], settings: {} },
        { id: 'h2', name: 'heading', parent: 's1', children: [], settings: { text: 'Oferta' } },
        { id: 'a1', name: 'accordion', parent: 's1', children: [], settings: { items: [
          { id: 'q1', title: 'Jeden', content: '<p>Pierwsza odpowiedź.</p>' },
          { id: 'q2', title: 'Dwa', content: '<p>Druga odpowiedź.</p>', evk_tl_en__title: 'Two' } ] } },
        { id: 'z1', name: 'text-basic', parent: 's1', children: [], settings: { text: '<p>ZEPSUJ <em>to</em></p>' } },
        { id: 'h1', name: 'heading', parent: 0, children: [], settings: { text: 'Grafika<br>użytkowa' } },
        { id: 't1', name: 'text-basic', parent: 0, children: [], settings: { text: 'Zapytaj o wycenę', evk_tl_en__text: 'Ask for a quote' } },
        { id: 'b1', name: 'button', parent: 0, children: [], settings: { text: 'Kontakt ai-test' } },
        { id: 'd1', name: 'heading', parent: 0, children: [], settings: { text: '{post_title}' } },
        { id: 'k1', name: 'icon-box', parent: 0, children: ['h3'], settings: { text: 'Oferta' } },
        { id: 'h3', name: 'heading', parent: 'k1', children: [], settings: { text: 'Oferta' } },
        { id: 'sl1', name: 'slider', parent: 0, children: [], settings: { title: 'Pokaz', items: [ { id: 'si1', title: 'Slajd' } ] } },
        /* Sekcja do porcji: 27 nagłówków (25 + 2), instancja komponentu (`cid`)
           i długi tekst z polskimi literami — 3100 znaków, 6200 bajtów. */
        { id: 's9', name: 'section', parent: 0, children: s9.map(function (e) { return e.id; }).concat(['kc1', 'dl1']), settings: {} },
      ].concat(s9, [
        { id: 'kc1', name: 'heading', cid: 'komp1', parent: 's9', children: [], settings: { text: 'Tekst komponentu' } },
        { id: 'dl1', name: 'text-basic', parent: 's9', children: [], settings: { text: new Array(3101).join('ł') } },
        /* Pole „Tłumaczenie EN” z edytorem (niżej: `rich`). */
        { id: 'tx1', name: 'rich-text', parent: 0, children: [], settings: { text: '<p>Treść w edytorze</p>' } },
      ]),
    };
    document.querySelector('.brx-body.main').__vue_app__ = { config: { globalProperties: { $_state: window.__stan } } };

    (function () {
      var ostatni = null;
      function el(id) {
        var w = null;
        ['content', 'header', 'footer'].forEach(function (o) {
          window.__stan[o].forEach(function (e) { if (e.id === id) w = e; });
        });
        return w;
      }
      var BOLT = '<div class="dynamic-tag-picker-button" title="Dane dynamiczne">⚡</div>';
      function pole(klucz, obj, id) {
        var d = document.createElement('div');
        d.setAttribute('data-controlkey', klucz);
        d.innerHTML = '<div class="control control-text"><div class="control-inner has-label"><label></label>'
          + '<div class="has-dynamic-data" data-control="text"><div class="input-wrapper"><input type="text" class="large"></div>' + BOLT + '</div></div></div>';
        var label = d.querySelector('label'), input = d.querySelector('input');
        input.id = id;
        label.htmlFor = id;
        label.textContent = 'Tłumaczenie ' + klucz.slice(7, 9).toUpperCase();
        input.value = typeof obj[klucz] === 'string' ? obj[klucz] : '';
        input.addEventListener('input', function () { obj[klucz] = input.value; });
        d.__obj = obj;
        d.__klucz = klucz;
        return d;
      }
      function obszar(klucz, obj, id) {
        var d = document.createElement('div');
        d.setAttribute('data-controlkey', klucz);
        /* Pole ukryte warunkiem: pusta obudowa. */
        if (/__readMore$/.test(klucz) && !obj.readMore) return d;
        d.innerHTML = '<div class="control control-textarea"><div class="control-inner has-label"><label></label>'
          + '<div data-control="textarea"><textarea rows="6"></textarea>' + BOLT + '</div></div></div>';
        var label = d.querySelector('label'), ta = d.querySelector('textarea');
        ta.id = id;
        label.htmlFor = id;
        label.textContent = 'Tłumaczenie ' + klucz.slice(7, 9).toUpperCase();
        ta.value = typeof obj[klucz] === 'string' ? obj[klucz] : '';
        ta.addEventListener('input', function () { obj[klucz] = ta.value; });
        d.__obj = obj;
        d.__klucz = klucz;
        return d;
      }
      /* Edytor TinyMCE w polu (typ `editor` w Bricksie): atrapa bez śledzenia
         stanu — treść ustawiona przy rysowaniu panelu zostaje, dopóki ktoś jej
         nie podmieni przez `tinymce.get(id).setContent()`. */
      window.tinymce = { edytory: {}, get: function (id) { return window.tinymce.edytory[id] || null; } };
      function edytor(klucz, obj, id) {
        var d = document.createElement('div');
        d.setAttribute('data-controlkey', klucz);
        d.innerHTML = '<div class="control control-editor"><div class="control-inner has-label"><label></label>'
          + '<textarea hidden></textarea><iframe title="Edytor"></iframe></div></div>';
        d.querySelector('label').textContent = 'Tłumaczenie ' + klucz.slice(7, 9).toUpperCase();
        d.querySelector('label').htmlFor = id;
        d.querySelector('textarea').id = id;
        d.querySelector('iframe').id = id + '_ifr';
        var tresc = typeof obj[klucz] === 'string' ? obj[klucz] : '';
        window.tinymce.edytory[id] = { id: id, getContent: function () { return tresc; }, setContent: function (v) { tresc = v; } };
        return d;
      }
      function rysuj() {
        var g = document.getElementById('grupy');
        g.innerHTML = '';
        var e = el(window.__stan.activeId);
        var mapa = (window.__EVK_TL_DANE || {}).mapa || {};
        var def = e && mapa[e.name];
        if (!def) return;
        var li = document.createElement('li');
        li.className = 'control-group open tab-content';
        li.setAttribute('data-control-group', 'evk_tl');
        window.tinymce.edytory = {};
        ['en', 'de'].forEach(function (j) {
          (def.pola || []).forEach(function (p) {
            var rodzaj = e.name === 'rich-text' ? edytor : (e.name === 'text-basic' ? obszar : pole);
            li.appendChild(rodzaj('evk_tl_' + j + '__' + p, e.settings, 'evk_tl_' + j + '__' + p));
          });
        });
        Object.keys(def.listy || {}).forEach(function (lista) {
          var r = document.createElement('div');
          r.setAttribute('data-controlkey', lista);
          r.className = 'control control-repeater';
          (e.settings[lista] || []).forEach(function (poz, i) {
            var it = document.createElement('div');
            it.className = 'repeater-item';
            ['en', 'de'].forEach(function (j) {
              def.listy[lista].forEach(function (p) { it.appendChild(pole('evk_tl_' + j + '__' + p, poz, lista + '-' + i + '-evk_tl_' + j + '__' + p)); });
            });
            r.appendChild(it);
          });
          li.appendChild(r);
        });
        g.appendChild(li);
      }
      /* Test wymusza przerysowanie panelu (jak Vue po zmianie zakładki). */
      window.__rysuj = rysuj;
      setInterval(function () {
        if (window.__stan.activeId !== ostatni) { ostatni = window.__stan.activeId; rysuj(); return; }
        document.querySelectorAll('#grupy input[type="text"], #grupy textarea:not([hidden])').forEach(function (i) {
          var d = i.closest('[data-controlkey]');
          var v = typeof d.__obj[d.__klucz] === 'string' ? d.__obj[d.__klucz] : '';
          if (document.activeElement !== i && i.value !== v) i.value = v;
        });
      }, 50);
    })();
  </script>
</div>
</body>
</html>
