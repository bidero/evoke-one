<style>
  body { margin: 0; font: 16px system-ui; }
  .spacer { height: 2400px; background: linear-gradient(#fff, #eee); }
</style>

<!-- Marquee daleko pod ekranem: przy pauzie ma stać, przy wyłączonej — jechać.
     Górna rozpórka ma identyfikator, bo przy `?grow=` PUCHNIE JUŻ PO STARCIE
     skryptu — odwzorowanie strony, na której obrazki bez wymiarów spychają
     treść w dół dopiero po załadowaniu. -->
<div class="spacer" id="gora"></div>
<div class="evk-marquee-container" id="m">
  <div class="evk-marquee-track">
    <span class="evk-marquee-item">Alfa</span>
    <span class="evk-marquee-item">Beta</span>
    <span class="evk-marquee-item">Gamma</span>
  </div>
</div>
<div class="spacer"></div>

<link rel="stylesheet" href="../../includes/bricks-elements/evoke-marquee/assets/marquee.css">
<script>
/* Konfiguracja z ?cfg= — odwzorowanie atrybutu, który drukuje element.php.
 * Ustawiamy ją PRZED marquee.js, bo silnik czyta atrybut na DOMContentLoaded.
 */
(function () {
  var q   = new URLSearchParams(location.search);
  var raw = q.get('cfg') || '{}';
  document.getElementById('m').setAttribute('data-evk-marquee', raw);

  /* Układ, który ROŚNIE po inicjalizacji. Marquee mieści się w kadrze, gdy
     skrypt liczy jego położenie, a dopiero potem zostaje zepchnięte daleko
     w dół. ScrollTrigger ma wtedy zmierzone stare położenie — i to jest
     najpoważniejszy kandydat na zgłoszone „nie pauzuje się dalej w treści". */
  var grow = parseInt(q.get('grow'), 10);
  if (grow) {
    document.getElementById('gora').style.height = '300px';
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.getElementById('gora').style.height = grow + 'px';
      }, 300);
    });
  }

  // Ile razy Observer realnie zareagował na przewijanie. To ta praca kosztuje
  // procesor, gdy marquee stoi poza kadrem — samo wstrzymanie osi czasu nie.
  window.__work = 0;
  var origKill = null;
  window.addEventListener('load', function () {
    origKill = gsap.killTweensOf;
    gsap.killTweensOf = function () {
      window.__work++;
      return origKill.apply(gsap, arguments);
    };
  });

  /* Wysokość dokumentu zmieniana NA ŻĄDANIE. `?grow=` wyżej rośnie raz, samo
     z siebie; tutaj chodzi o zmianę dokładnie w chwili, gdy test patrzy — bo
     obserwator wysokości ma reagować inaczej na dotyku niż na desktopie. */
  window.__urosnij = function (px) {
    document.getElementById('gora').style.height = px + 'px';
  };

  /* Dwa różne pomiary, bo to dwie różne rzeczy.
     
     `__prosby` — ile razy silnik POPROSIŁ wspólny helper o odświeżenie. Tym
     mierzymy pominięcie zmian samej wysokości: marquee ma nie zawołać wcale.
     
     `__odswiezenia` — ile razy wyzwalacze NAPRAWDĘ się przeliczyły. Tym
     mierzymy ścieżkę zapasową: gdy helpera na stronie nie ma, prośba nie ma
     gdzie trafić, a odświeżenie i tak musi nastąpić. */
  window.__prosby = 0;
  if (window.evkOdswiez) {
    var helper = window.evkOdswiez;
    window.evkOdswiez = function () {
      window.__prosby++;
      return helper.apply(this, arguments);
    };
  }

  window.__odswiezenia = 0;
  window.addEventListener('load', function () {
    var origRefresh = ScrollTrigger.refresh;
    ScrollTrigger.refresh = function () {
      window.__odswiezenia++;
      return origRefresh.apply(this, arguments);
    };
  });

  window.__pos = function () {
    var el = document.querySelector('#m .evk-marquee-item');
    return Math.round(el.getBoundingClientRect().left);
  };
})();
</script>
<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../assets/vendor/gsap/Observer.min.js"></script>
<script src="../../includes/bricks-elements/evoke-marquee/assets/marquee.js"></script>
