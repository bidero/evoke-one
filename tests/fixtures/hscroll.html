<!--
  Horizontal Scroll — fixture.

  Element ma dwa układy, które łatwo ze sobą pomylić:

    „slajder"  — element przypina SAM SIEBIE, panele dostają narzuconą szerokość
                 i wysokość (100% elementu albo 100vw, `--evk-panel-h`);
    „sekcja"   — przypina się PRZODEK z nagłówkiem, a pod nagłówkiem jedzie
                 taśma kart WĘŻSZYCH od ekranu, o rozmiarach z buildera.

  Strona odwzorowuje drugi układ: sekcja z nagłówkiem, pod nim cztery karty.
  Przed sekcją i za nią jest treść — bez niej nie da się sprawdzić ani tego, że
  sekcja staje przy górze ekranu, ani tego, że po dojechaniu taśmy strona jedzie
  dalej.

  DWIE TAKIE SEKCJE, nie jedna. Selektor PRZODKA szuka się przez `closest()`,
  a nie `document.querySelector()` — różnicę widać dopiero wtedy, gdy pasujących
  sekcji jest więcej niż jedna.

  TRZY KONTENERY WSKAŹNIKA POZA ELEMENTEM (1.101.0). Leżą PRZED sekcją, a nie
  w jej nagłówku, choć w praktyce trafiają właśnie tam: przypięta sekcja ma
  prostokąt przyklejony do zera i nie da się na niej zmierzyć, czy kontener
  został wyrwany z przepływu. Tutaj stoją między dwoma znacznikami w `.ramka`
  i wystarczy popatrzeć, czy znacznik pod spodem nie podjechał do góry.

  Parametry przez query: pin, sel, width, prog, style, target, len, lena, segon,
  scrub, snap, below.
-->
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px system-ui; }

  .przed, .po { height: 1200px; background: #eee; padding: 20px; }

  /* Sekcja-rodzic: to ona ma być przypięta w nowym układzie. */
  .sekcja { background: #4c1d95; color: #fff; padding: 40px 0 60px; }
  .naglowek { padding: 0 40px 30px; }
  .naglowek h2 { margin: 0; font-size: 40px; }

  /* Karty WĘŻSZE od ekranu i o własnej wysokości — dokładnie to, czego tryb
     „z buildera" ma nie ruszać. */
  /* 500 px, nie 300: przy węższych kartach cała taśma przesuwa się o niecałe
     sto pikseli i nie ma kiedy zmierzyć jej W RUCHU — sekcja odpina się
     natychmiast po przypięciu. Zmierzone: zakres wychodził 72 px. */
  /* Sekcja na cały ekran — wtedy pod nią nie zostaje ani piksel i podgląd
     nie ma czego pokazać. */
  body.wysoka .sekcja { min-height: 100vh; }

  .karta {
    width: 500px;
    height: 260px;
    margin-right: 24px;
    background: rgba(255, 255, 255, .12);
    border-radius: 16px;
    padding: 20px;
  }

  /* ── Miejsce na wskaźnik POZA elementem ──────────────────────────────────
     `position: relative` na ramce jest tu celowo: gdyby kontener wskaźnika
     dostał `position: absolute`, przykleiłby się do jej krawędzi i wypadł
     z przepływu — a wtedy `#po-wskazniku` podjeżdża do góry. Na tym stoi
     sprawdzenie „kontener zostaje w przepływie". */
  .ramka { position: relative; width: 600px; padding: 20px; background: #ddd; }
  .znacznik { height: 30px; background: #bbb; }
  /* Wysokość własna, żeby wypadnięcie z przepływu było widać gołym pomiarem. */
  #zewn-pusty, #zewn-wlasny, #zewn-krotki { min-height: 40px; }
  .poz { padding: 4px 8px; background: #999; }
</style>

<link rel="stylesheet" href="../../includes/bricks-elements/evoke-horizontal-scroll/assets/hscroll.css">

<div class="przed">treść przed sekcją</div>

<div class="ramka">
  <div class="znacznik" id="przed-wskaznikiem"></div>

  <!-- PUSTY — skrypt ma go wypełnić sam. -->
  <div id="zewn-pusty"></div>

  <!-- Z WŁASNĄ treścią, tyle dzieci, ile kart — skrypt ma tylko podświetlać. -->
  <div id="zewn-wlasny">
    <span class="poz">01 · ROZMOWA</span>
    <span class="poz">02 · KIERUNEK</span>
    <span class="poz">03 · PROJEKT</span>
    <span class="poz">04 · WDROŻENIE</span>
  </div>

  <!-- Za mało dzieci — dwa ostatnie stany nie mają czego podświetlić. -->
  <div id="zewn-krotki">
    <span class="poz">A</span>
    <span class="poz">B</span>
  </div>

  <div class="znacznik" id="po-wskazniku"></div>
</div>

<section class="sekcja" id="sekcja-1">
  <div class="naglowek">
    <h2 id="tytul-1">JAK PRACUJEMY</h2>
  </div>
  <div class="evk-hscroll" id="hs-1">
    <div class="evk-hscroll__progress evk-hscroll__progress--top">
      <div class="evk-hscroll__progress-bar"></div>
    </div>
    <div class="evk-hscroll__track">
      <div class="karta" id="k1">01 · ROZMOWA</div>
      <div class="karta" id="k2">02 · KIERUNEK</div>
      <div class="karta" id="k3">03 · PROJEKT</div>
      <div class="karta" id="k4">04 · WDROŻENIE</div>
    </div>
  </div>
</section>

<div class="po" id="pod-1">treść pomiędzy</div>

<!-- DRUGA taka sama sekcja — patrz komentarz na górze. -->
<section class="sekcja" id="sekcja-2">
  <div class="naglowek"><h2 id="tytul-2">DRUGA SEKCJA</h2></div>
  <div class="evk-hscroll" id="hs-2">
    <div class="evk-hscroll__track">
      <div class="karta">A</div>
      <div class="karta">B</div>
      <div class="karta">C</div>
    </div>
  </div>
</section>

<div class="po">treść po sekcji</div>

<script>
(function () {
  var q = new URLSearchParams(location.search);

  /* Konfiguracja tak, jak wystawia ją element.php: jeden atrybut z JSON-em.
     Skrypt nie czyta niczego innego, więc test podaje ją dokładnie w tej
     postaci, w jakiej wychodzi z buildera. */
  var cfg = {
    widthMode    : q.get('width') || 'auto',
    pinTarget    : q.get('pin')   || 'selector',
    pinSelector  : q.get('sel') === null ? '.sekcja' : q.get('sel'),
    scrub        : q.get('scrub') === null ? 0 : parseFloat(q.get('scrub')),
    startOffset  : 'top top',
    // Domyślnie BEZ snapowania: przyciąganie do najbliższej karty przestawia
    // pozycję po pomiarze i „taśma stoi na tyle, ile przewinięto" przestaje być
    // prawdą. Sekcje mierzące snap włączają go jawnie.
    snap         : q.get('snap') === '1',
    snapDuration : 0.2,
    disableBelow : q.get('below') === null ? 0 : parseInt(q.get('below'), 10),
    progressBar  : q.get('prog') === '1',
    progressStyle: q.get('style') || 'bar',
    progressTarget: q.get('target') || '',
    currentRest  : q.get('rest') || 'hide',
    peekNext     : q.get('peek') === '1',
  };

  /* DRUGA sekcja bywa zawadą: jest przypinana, więc podgląd treści pod spodem
     słusznie odmawia działania (przesuwanie treści rozłożyłoby tamten pin).
     `solo=1` ją usuwa — bez tego samego podglądu nie da się zmierzyć. */
  if (q.get('solo') === '1') {
    var s2 = document.getElementById('sekcja-2');
    if (s2) s2.remove();
  }
  if (q.get('tall') === '1') document.body.classList.add('wysoka');
  document.getElementById('hs-1').setAttribute('data-evk-hscroll', JSON.stringify(cfg));

  /* DRUGA taśma bez wskaźnika. Z tą samą konfiguracją obie sięgnęłyby po ten
     sam kontener zewnętrzny: pierwsza by go wypełniła, druga zastałaby go
     „z własną treścią" i pomiary przestałyby cokolwiek znaczyć. */
  var cfg2 = JSON.parse(JSON.stringify(cfg));
  cfg2.progressBar = false;
  cfg2.progressTarget = '';
  // Przy `solo=1` drugiej sekcji już nie ma — patrz wyżej.
  var hs2 = document.getElementById('hs-2');
  if (hs2) hs2.setAttribute('data-evk-hscroll', JSON.stringify(cfg2));

  /* Zmienne CSS tam, gdzie zapisuje je Bricks: NA KORZENIU elementu. Do
     kontenera spoza elementu nie dojdą inaczej niż przepisane przez skrypt —
     i o to właśnie chodzi w sprawdzeniu „zmienne docierają". */
  var root = document.getElementById('hs-1');
  var ZM = {
    len: '--evk-seg-len', lena: '--evk-seg-len-active',
    segon: '--evk-seg-on', segoff: '--evk-seg-off',
    segh: '--evk-seg-h', segr: '--evk-seg-radius',
    numsize: '--evk-num-size', numweight: '--evk-num-weight',
    progbg: '--evk-prog-bg', progpad: '--evk-prog-pad', progr: '--evk-prog-radius',
    gap: '--evk-prog-gap'
  };
  Object.keys(ZM).forEach(function (k) {
    if (q.get(k)) root.style.setProperty(ZM[k], q.get(k));
  });

  /* Modyfikator pozycji NA KORZENIU — dokładnie tak, jak drukuje go element.php
     przy włączonym wskaźniku. To z niego arkusz odsuwa taśmę o zadany odstęp,
     a JS ma go zdjąć, gdy wskaźnik przenosi się poza element. */
  if (q.get('prog') === '1') root.classList.add('evk-hscroll--prog-top');
})();
</script>

<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script src="../../includes/bricks-elements/evoke-horizontal-scroll/assets/hscroll.js"></script>

<script>
/** Przesunięcie taśmy w poziomie — 0 znaczy „na starcie". */
function txOf(el) {
  var m = getComputedStyle(el).transform;
  return (m && m !== 'none') ? Math.round(parseFloat(m.replace(/^matrix\(|\)$/g, '').split(',')[4])) : 0;
}

/**
 * Wszystko o jednym elemencie W JEDNYM ODCZYCIE.
 *
 * Prostokąty sekcji, nagłówka i taśmy muszą pochodzić z tej samej klatki
 * układu — inaczej przy przypiętej sekcji porównywałoby się położenia z dwóch
 * różnych chwil i wychodziłby z tego szum.
 */
window.__hs = function (nr) {
  var root  = document.getElementById('hs-' + nr);
  var sek   = document.getElementById('sekcja-' + nr);
  var tytul = document.getElementById('tytul-' + nr);
  var track = root.querySelector('.evk-hscroll__track');
  var karta = track.children[0];

  return {
    // Przesunięcie taśmy i ile go maksymalnie może być.
    x:      txOf(track),
    zakres: Math.round(track.scrollWidth - root.clientWidth),

    // Górna krawędź sekcji i nagłówka względem okna. Przypięta sekcja stoi
    // przy zerze, a nagłówek razem z nią.
    sekcjaTop: Math.round(sek.getBoundingClientRect().top),
    tytulTop:  Math.round(tytul.getBoundingClientRect().top),

    // Prawa krawędź OSTATNIEJ karty względem prawej krawędzi kadru. Zero na
    // końcu przewijania znaczy „ostatnia karta stanęła przy krawędzi".
    ogonek: Math.round(track.children[track.children.length - 1].getBoundingClientRect().right
                       - root.getBoundingClientRect().right),

    // Czy skrypt narzucił rozmiary. W trybie „z buildera" oba mają zostać puste.
    stylW: karta.style.width,
    stylH: karta.style.height,
    // Zmierzone, nie deklarowane — reguła z arkusza też potrafi narzucić rozmiar.
    szer:  Math.round(karta.getBoundingClientRect().width),
    wys:   Math.round(karta.getBoundingClientRect().height),

    aktywny: root.classList.contains('evk-hscroll--active'),
    auto:    root.classList.contains('evk-hscroll--auto'),

    // Ile karta stoi od górnej krawędzi elementu. Wskaźnik wewnętrzny leży NA
    // taśmie, więc bez odstępu przykrywa górę pierwszej karty.
    odKrawedzi: Math.round(karta.getBoundingClientRect().top - root.getBoundingClientRect().top),
    // Czy modyfikator pozycji wskaźnika został na korzeniu.
    modPozycji: root.classList.contains('evk-hscroll--prog-top')
             || root.classList.contains('evk-hscroll--prog-bottom'),
    // Czy zapasowy wskaźnik z PHP-a jeszcze tu jest.
    maWewnetrzny: !!root.querySelector('.evk-hscroll__progress'),

    // Co naprawdę przypięto: ScrollTrigger owija przypięty element w rodzica
    // z klasą `pin-spacer`.
    przypiety: (function () {
      if (sek.parentElement && sek.parentElement.classList.contains('pin-spacer')) return 'sekcja';
      if (root.parentElement && root.parentElement.classList.contains('pin-spacer')) return 'element';
      return 'nic';
    })(),
  };
};

/**
 * Wskaźnik postępu — jeden odczyt o dowolnym kontenerze.
 *
 * Bez argumentu patrzy na wskaźnik WEWNĄTRZ pierwszego elementu; z selektorem
 * na wskazany kontener zewnętrzny. Dzięki temu jedno i to samo sprawdzenie
 * potrafi porównać oba miejsca.
 */
window.__w = function (sel) {
  var box = document.querySelector(sel || '#hs-1 .evk-hscroll__progress');
  if (!box) return null;

  var dzieci = Array.prototype.slice.call(box.children);
  var bar    = box.querySelector('.evk-hscroll__progress-bar');
  var st     = getComputedStyle(box);

  // Widoczność MIERZONA, nie zakładana: w trybie „tylko bieżący" chowa arkusz,
  // a nie skrypt, więc atrybuty na elemencie niczego by nie dowiodły.
  var widoczne = dzieci.filter(function (d) { return getComputedStyle(d).display !== 'none'; });
  var akt      = dzieci.find(function (d) { return d.classList.contains('is-active'); });

  return {
    dzieci:    dzieci.length,
    klasy:     box.className,
    pozycja:   st.position,
    // Kreski (`--evk-hscroll__progress-seg`) tylko wtedy, gdy narysował je skrypt.
    kresek:    box.querySelectorAll('.evk-hscroll__progress-seg').length,
    numerow:   box.querySelectorAll('.evk-hscroll__progress-num').length,
    aktywny:   dzieci.findIndex(function (d) { return d.classList.contains('is-active'); }),
    teksty:    dzieci.map(function (d) { return d.textContent.trim(); }),
    widocznych: widoczne.length,
    tekstWidoczny: widoczne.length === 1 ? widoczne[0].textContent.trim() : null,
    szerBox:   Math.round(box.getBoundingClientRect().width),
    szeroko:   dzieci.map(function (d) { return Math.round(d.getBoundingClientRect().width); }),
    wysoko:    dzieci.map(function (d) { return Math.round(d.getBoundingClientRect().height); }),

    // Wygląd pudełka — mierzony, nie odczytany z atrybutu: te wartości jadą
    // zmiennymi CSS i przy kontenerze zewnętrznym muszą zostać przepisane.
    tlo:       st.backgroundColor,
    padding:   st.paddingTop,
    zaokrBox:  st.borderTopLeftRadius,

    zaokrSeg:  dzieci.length ? getComputedStyle(dzieci[0]).borderTopLeftRadius : null,
    pismo:     dzieci.length
      ? getComputedStyle(dzieci[0]).fontSize + ' / ' + getComputedStyle(dzieci[0]).fontWeight
      : null,

    kolorAkt:  akt ? getComputedStyle(akt).backgroundColor : null,
    // Przy numerach barwę niesie `color`, nie tło — stąd oba odczyty.
    tekstAkt:  akt ? getComputedStyle(akt).color : null,
    tekstNieakt: (function () {
      var inny = dzieci.find(function (d) { return !d.classList.contains('is-active'); });
      return inny ? getComputedStyle(inny).color : null;
    })(),
    wSrodku:   document.getElementById('hs-1').contains(box),
    pasek:     bar ? getComputedStyle(bar).transform : null,
  };
};

/**
 * Treść tuż pod pierwszą sekcją — w JEDNYM odczycie razem z sekcją.
 *
 * Prostokąty muszą pochodzić z tej samej klatki: przy przypiętej sekcji
 * porównywanie „gdzie stoi treść" z „gdzie kończy się sekcja" z dwóch różnych
 * chwil daje sam szum.
 */
window.__pod = function () {
  var el  = document.getElementById('pod-1');
  var sek = document.getElementById('sekcja-1');
  var r   = el.getBoundingClientRect();

  return {
    top:        Math.round(r.top),
    // Dolna krawędź PRZYPIĘTEJ sekcji — do niej ma się przykleić treść.
    sekcjaDol:  Math.round(sek.getBoundingClientRect().bottom),
    wKadrze:    r.top < window.innerHeight,
    // Transformacja mierzona, nie zakładana: po wyjściu z zakresu ma zniknąć
    // CAŁKIEM, bo nawet zerowa tworzy blok zawierający dla `position: fixed`.
    transform:  getComputedStyle(el).transform,
  };
};

/** Czy kontener wskaźnika nadal zajmuje miejsce w przepływie. */
window.__uklad = function () {
  var a = document.getElementById('przed-wskaznikiem').getBoundingClientRect();
  var b = document.getElementById('po-wskazniku').getBoundingClientRect();
  return { odstep: Math.round(b.top - a.bottom) };
};

/** Przewinięcie na zadaną pozycję i odczekanie klatki. */
window.__doPozycji = function (y) {
  window.scrollTo(0, y);
};

/** Gdzie zaczyna się sekcja w dokumencie — punkt odniesienia dla przewijania. */
window.__gdzieSekcja = function (nr) {
  var sek = document.getElementById('sekcja-' + nr);
  return Math.round(sek.getBoundingClientRect().top + window.scrollY);
};
</script>
