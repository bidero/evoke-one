<!-- Parametry przez query: stagger, space, shrink, dim -->
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px system-ui; }
  .before, .after { height: 600px; background: #eee; }
  .card { height: 100vh; background: #345; color: #fff; font-size: 40px; padding: 20px; }
  .card:nth-child(2) { background: #576; }
  .card:nth-child(3) { background: #853; }
</style>
<div class="before">before</div>
<div class="evk-sc" id="sc"><div class="card">1</div><div class="card">2</div><div class="card">3</div></div>
<div class="after" id="after">after</div>

<link rel="stylesheet" href="../../includes/bricks-elements/evoke-stacking-cards/assets/stacking-cards.css">
<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>
<script>
  var q = new URLSearchParams(location.search);
  document.getElementById('sc').setAttribute('data-evk-sc', JSON.stringify({
    offsetTop: '80px', gap: '40px',
    stagger: +(q.get('stagger') || 40),
    shrink: q.get('shrink') !== '0', minScale: 0.9,
    dim: +(q.get('dim') === null ? 0.25 : q.get('dim')),
    shadow: true, shadowValue: '0 -8px 30px rgba(0,0,0,.18)',
    bottomSpace: q.get('space') || '',
    disableBelow: 768,
  }));
  // Licznik wymuszonych refreshów — regresja 1.27.3 (zacinanie na telefonie).
  window.__refresh = 0;
  var _r = ScrollTrigger.refresh.bind(ScrollTrigger);
  ScrollTrigger.refresh = function () { window.__refresh++; return _r.apply(null, arguments); };
</script>
<script src="../../includes/bricks-elements/evoke-stacking-cards/assets/stacking-cards.js"></script>
<script>
  var root = document.getElementById('sc');
  window.__m = function () {
    var cards = [].slice.call(root.querySelectorAll('.card'));
    var a = document.getElementById('after').getBoundingClientRect();
    var sp = root.querySelector('.evk-sc-space');
    return {
      tops: cards.map(function (c) { return Math.round(c.getBoundingClientRect().top); }),
      lastBottom: Math.round(cards[2].getBoundingClientRect().bottom),
      afterTop: Math.round(a.top),
      spacer: sp ? Math.round(sp.getBoundingClientRect().height) : null,
      pad: getComputedStyle(root).paddingBottom,
      active: root.classList.contains('is-active'),
      cardPos: getComputedStyle(cards[0]).position,
      vis: getComputedStyle(cards[0]).visibility,
      refresh: window.__refresh,
    };
  };
</script>
