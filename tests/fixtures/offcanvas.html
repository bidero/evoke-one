<script>

     builder. `?builder=1` przestawia ją na kanwę — bez tego cała gałąź

<!-- NAGŁÓWEK: opakowanie wokół menu, dokładnie takie, jakie bywa na stronie.
     Przy `?trap=1` dostaje `transform` — a przodek z transformem TWORZY BLOK
     ZAWIERAJĄCY dla `position: fixed` i zamyka w sobie całą powłokę menu.
     To jest zgłoszona usterka, odtworzona: nie „menu się nie otwiera", tylko
     „otwiera się w prostokącie nagłówka".
     Bez tego opakowania ta klasa usterek jest poza zasięgiem pomiaru — powłoka

         rolę `generic`, a ta nie ma prawa mieć nazwy. Bez tego przypadku

<script>
  var root = document.getElementById('root');
  root.setAttribute('data-mode',       q.get('mode')   || 'levels');
  root.setAttribute('data-side',       q.get('side')   || 'right');
  // Efekt otwierania: 'slide' (wysuwanie, domyślny) albo 'reveal' (odsłanianie).
  root.setAttribute('data-effect',     q.get('effect') || 'slide');
  // Siła wygięcia — czytana tylko przy `effect=curve`.
  root.setAttribute('data-curve-intensity',
    q.get('curveint') === null ? '1' : q.get('curveint'));
  // Domyślnie tak jak element: kadr się poszerza. Sekcje mierzące
  // wyjeżdżanie rodzica podają ?levels=slide jawnie.
  root.setAttribute('data-level-style', q.get('levels') || 'expand');
  root.setAttribute('data-duration',   q.get('dur') || '0');
  // Krzywe przychodzą z listy Animatora, czyli w zapisie GSAP („power2.out").
  // CSS takiej wartości nie zna: nieznana funkcja czasu unieważnia CAŁĄ
  // deklarację `transition`, więc wybranie krzywej gasiło przejście do zera.
  // Test podaje je dokładnie w tej postaci, w jakiej wychodzą z buildera.
  root.setAttribute('data-easing',     q.get('ease') || '');
  root.setAttribute('data-panel-duration', q.get('pdur') || '');
  root.setAttribute('data-sub-delay', q.get('sdelay') === null ? '' : q.get('sdelay'));
  root.setAttribute('data-panel-easing',   q.get('pease') || '');
  root.setAttribute('data-start',      '');
  root.setAttribute('data-trigger',    q.get('trig') || '');
  root.setAttribute('data-toggle-class', q.get('tclass') || '');
  root.setAttribute('data-esc-back',   q.get('esc')    === '0' ? '0' : '1');
  root.setAttribute('data-close-link', '0');
  root.setAttribute('data-lock',       q.get('lock')   === '0' ? '0' : '1');
  root.setAttribute('data-anim-exit',  q.get('exit')   === '1' ? '1' : '0');
  // Puste = „cały czas animacji". Jawne zero MUSI przejść jako '0'.
  root.setAttribute('data-exit-wait',  q.get('exitwait') === null ? '' : q.get('exitwait'));
  root.setAttribute('data-portal',     q.get('portal') === '0' ? '0' : '1');
  root.setAttribute('data-open-builder', '0');

  var r2 = document.getElementById('root2');
  ['data-mode','data-side','data-effect','data-curve-intensity',
   'data-duration','data-esc-back','data-close-link','data-level-style',
   'data-lock','data-portal','data-open-builder','data-anim-exit',
   'data-panel-duration','data-panel-easing','data-sub-delay'].forEach(function (a) {
    r2.setAttribute(a, root.getAttribute(a));
  });
  r2.setAttribute('data-start', '');
  r2.setAttribute('data-trigger', '');

  // Nagłówek zamykający `position: fixed` w sobie — patrz `#naglowek.pulapka`.
  if (q.get('trap') === '1') document.getElementById('naglowek').classList.add('pulapka');

  /* ZRZUT KORZENIA sprzed startu skryptu — do udawania przerysowania.

     Bricks przy każdej zmianie ustawienia podmienia węzeł elementu na świeży,
     z pełną treścią i bez naszych znaczników stanu. Kopia musi więc powstać
     TERAZ: chwilę później panele są już przeniesione do powłoki, a na korzeniu
     siedzi `data-evk-oc-ready`. */
  var ZRZUT = document.getElementById('root').outerHTML;
  window.__przerysuj = function () {
    var stary = document.getElementById('root');
    var kosz  = document.createElement('div');
    kosz.innerHTML = ZRZUT;
    stary.parentNode.replaceChild(kosz.firstElementChild, stary);
    evk_offcanvas_menu_init();
  };
</script>

<script>
window.__open   = function () { document.getElementById('trigger').click(); };

/** Podział listy CSS po przecinkach NAJWYŻSZEGO POZIOMU.
 *
 *  `cubic-bezier(0.5, 1, 0.89, 1)` sam w sobie zawiera przecinki, więc zwykły
 *  `split(',')` rozerwałby jedną krzywą na cztery kawałki. Kadr ma od 1.62.0
 *  DWA przejścia naraz (`transform` i `width`), więc bez tego nie da się już
 *  odczytać, która wartość należy do której właściwości. */
function splitList(s) {
  var out = [], depth = 0, cur = '';
  for (var i = 0; i < s.length; i++) {
    var c = s[i];
    if (c === '(') depth++;
    if (c === ')') depth--;
    if (c === ',' && depth === 0) { out.push(cur.trim()); cur = ''; continue; }
    cur += c;
  }
  if (cur.trim()) out.push(cur.trim());
  return out;
}

/** Czas i krzywa przejścia DLA KONKRETNEJ właściwości. */
function transitionOf(el, prop) {
  var cs    = getComputedStyle(el);
  var props = splitList(cs.transitionProperty);
  var durs  = splitList(cs.transitionDuration);
  var eases = splitList(cs.transitionTimingFunction);
  var i = props.indexOf(prop);
  if (i < 0) return { transition: '0s', ease: 'ease' };
  return { transition: durs[i % durs.length], ease: eases[i % eases.length] };
}

function shiftX(el) {
  var m = getComputedStyle(el).transform;
  return (m && m !== 'none')
    ? Math.round(parseFloat(m.replace(/^matrix\(|\)$/g, '').split(',')[4])) : 0;
}

/** Przesunięcie kadru paneli w poziomie — 0 znaczy „na miejscu". */
window.__slide = function () {
  var w = shellOf(0).querySelector('.evk-oc-frame');
  if (!w) return null;
  var t = transitionOf(w, 'transform');
  return { x: shiftX(w), transition: t.transition, ease: t.ease,
           visible: getComputedStyle(w).visibility };
};

/** Czas i krzywa POSZERZANIA kadru — osobne przejście, osobne tempo. */
window.__frameWidth = function () {
  var w = shellOf(0).querySelector('.evk-oc-frame');
  var t = transitionOf(w, 'width');
  return { w: Math.round(w.getBoundingClientRect().width),
           transition: t.transition, ease: t.ease };
};
window.__isOpen = function () { return shellOf(0).classList.contains('is-open'); };

/** Który panel jest bieżący i które są odcięte od tabulatora. */
/* Powłoki jadą do <body>, więc po przeniesieniu nie da się ich zawęzić
   korzeniem. Kolejność jest jednak stała: pierwsza powłoka należy do
   pierwszego korzenia. Bez tego zawężenia drugi korzeń wchodził do pomiaru
   pierwszego i „bieżący jest dokładnie jeden" świeciło na czerwono. */
function shellOf(i) { return document.querySelectorAll('.evk-oc-shell')[i]; }

window.__state = function () {
  var out = [];
  shellOf(0).querySelectorAll('.evk-oc-panel').forEach(function (p) {
    out.push({
      id:      p.getAttribute('data-panel'),
      current: p.classList.contains('is-current'),
      inert:   p.hasAttribute('inert'),
    });
  });
  return out;
};

/** Przezroczystość animowanego elementu w panelu startowym. */
window.__animOpacity = function () {
  return +parseFloat(getComputedStyle(document.getElementById('anim')).opacity).toFixed(2);
};

window.__click = function (id) { document.getElementById(id).click(); };
window.__key   = function (key) {
  document.dispatchEvent(new KeyboardEvent('keydown', { key: key, bubbles: true, cancelable: true }));
};

window.__focusId = function () { return document.activeElement ? document.activeElement.id : null; };

/** Stan blokady przewijania.
 *
 *  `gap` to szerokość, jaką pasek przewijania zabiera układowi. W tym harnessie
 *  wychodzi 0 — headless Chromium rysuje pasek nakładkowy — więc kompensaty
 *  paddingiem NIE DA SIĘ tu zmierzyć i test tego nie udaje. Mierzalne i warte
 *  pilnowania jest to, czy blokada w ogóle się zakłada i czy się ZDEJMUJE. */
window.__lock = function () {
  return {
    /* Klasa WSPÓLNEGO zamka (includes/96-scroll-lock.php). Do 1.94.0 offcanvas
       trzymał własną `evk-oc-locked` — i właśnie dlatego dwa panele otwarte
       naraz nie miały jak się dogadać, kto ją jeszcze trzyma. */
    locked:  document.documentElement.classList.contains('evk-scroll-locked'),
    padding: document.body.style.paddingRight || '',
    gap:     window.innerWidth - document.documentElement.clientWidth,
    trzyma:  window.evkScroll ? window.evkScroll.trzymajacy() : null,
  };
};

window.__ariaExpanded = function () {
  return document.getElementById('trigger').getAttribute('aria-expanded');
};

/** Klik w zewnętrzny trigger — ten wskazany selektorem `data-trigger`. */
window.__zew = function () { document.getElementById('zew-btn').click(); };

/** Stan na KORZENIU — tym językiem mówi Bricks o otwartym elemencie. */
window.__rootKlasy = function () { return document.getElementById('root').className; };
window.__rootBrx   = function () {
  return document.getElementById('root').classList.contains('brx-open');
};

/**
 * Stan przełącznika o podanym ID: klasy i aria.
 *
 * `brx-open` to klasa, na której wisi cała animacja burgera zbudowanego
 * w Bricksie. Bez niej przycisk zostaje burgerem przy otwartym menu.
 */
window.__stanPrzycisku = function (id) {
  var el = document.getElementById(id);
  return {
    klasy: el.className,
    brx:   el.classList.contains('brx-open'),
    // Konwencja samych burgerów — na niej stoi większość animacji kresek.
    act:   el.classList.contains('is-active'),
    aria:  el.getAttribute('aria-expanded'),
  };
};

/** Czy powłoka wylądowała w <body> (portal), czy została w korzeniu. */
window.__shellParent = function () {
  var s = shellOf(0);
  return s ? s.parentElement.tagName.toLowerCase() : null;
};

/** Czy panel widocznie leży w kadrze — do sprawdzenia redukcji ruchu. */
/** Pierwszy panel PIERWSZEJ powłoki — do pomiarów stylu. */
window.__firstPanel = function () { return shellOf(0).querySelector('.evk-oc-panel'); };

window.__panelVisible = function () {
  var p = shellOf(0).querySelector('.evk-oc-panel.is-current');
  if (!p) return false;
  var cs = getComputedStyle(p);
  if (cs.visibility === 'hidden') return false;
  var r = p.getBoundingClientRect();
  return r.width > 10 && r.right > 0 && r.left < window.innerWidth
      && parseFloat(cs.opacity) > 0.9;
};

/** Taśma paneli: przesunięcie i własny czas przejścia. */
window.__track = function () {
  var el = shellOf(0).querySelector('.evk-oc-track');
  var t  = transitionOf(el, 'transform');
  return { x: shiftX(el), transition: t.transition, ease: t.ease,
           willChange: getComputedStyle(el).willChange };
};

/** Lewa krawędź panelu o podanym ID, względem kadru.
 *
 *  To po niej widać różnicę między WYPYCHANIEM a ZASŁANIANIEM: przy wypychaniu
 *  panel startowy odjeżdża w lewo (wartość maleje), przy zasłanianiu stoi
 *  w miejscu, a drugi kładzie się na nim. */
window.__panelLeft = function (id) {
  var frame = shellOf(0).querySelector('.evk-oc-frame');
  var p = shellOf(0).querySelector('.evk-oc-panel[data-panel="' + id + '"]');
  if (!p || !frame) return null;
  return Math.round(p.getBoundingClientRect().left - frame.getBoundingClientRect().left);
};

/** Geometria trybu POSZERZANIA.
 *
 *  Tu wszystko mierzy się WZGLĘDEM OKNA, nie względem kadru: przy poszerzaniu
 *  rusza się sam kadr, więc pomiar względem niego pokazywałby rodzica wiecznie
 *  na zerze i przesunięcia w ogóle nie byłoby widać. */
window.__expand = function () {
  var f = shellOf(0).querySelector('.evk-oc-frame');
  var fr = f.getBoundingClientRect();
  var out = {
    frameW: Math.round(fr.width), frameRight: Math.round(fr.right),
    frameLeft: Math.round(fr.left),
    frameBg: getComputedStyle(f).backgroundColor,
    panels: [],
  };
  shellOf(0).querySelectorAll('.evk-oc-panel').forEach(function (p) {
    var cs = getComputedStyle(p);
    var r  = p.getBoundingClientRect();
    out.panels.push({
      id:      p.getAttribute('data-panel'),
      shown:   cs.display !== 'none',
      order:   cs.order,
      z:       cs.zIndex,
      opacity: +parseFloat(cs.opacity).toFixed(2),
      // Przesunięcie WŁASNE panelu — jedyna wiarygodna miara jego ruchu
      // w trakcie przejścia szerokości kadru (patrz __bare niżej).
      tx:      Math.round(txOf(p)),
      w:       Math.round(r.width),
      left:    Math.round(r.left),
      inert:   p.hasAttribute('inert'),
      current: p.classList.contains('is-current'),
      sub:     p.classList.contains('is-sub'),
    });
  });
  return out;
};

/** Ile pikseli kadru NIE jest przykrytych żadnym panelem.
 *
 *  To po tym widać „biały kolor przy zamykaniu": panel, który znika od razu,
 *  zostawia odsłonięty kawałek kadru, a kadr ma własne tło.
 *
 *  WSZYSTKO LICZONE W UKŁADZIE TAŚMY, nie z prostokątów na ekranie — i to
 *  jest tu istotne, nie kosmetyczne. Zmierzone w tym harnessie: gdy na kadrze
 *  trwa przejście `width`, `getBoundingClientRect()` POTOMKÓW zwraca pozycję
 *  z innej klatki niż prostokąt samego kadru (kadr 583, taśma −60, przy
 *  `offsetLeft` taśmy równym 0). Pomiar z prostokątów mierzyłby więc szum.
 *  Szerokość samego kadru i transformacje są wiarygodne, więc liczymy z nich. */
/** Macierz transformacji jako liczby — [a, b, c, d, tx, ty]. */
function matrixOf(el) {
  var m = getComputedStyle(el).transform;
  if (!m || m === 'none') return [1, 0, 0, 1, 0, 0];
  return m.replace(/^matrix\(|\)$/g, '').split(',').map(parseFloat);
}

function txOf(el) {
  var m = getComputedStyle(el).transform;
  return (m && m !== 'none') ? parseFloat(m.replace(/^matrix\(|\)$/g, '').split(',')[4]) : 0;
}

/** Druga kolumna i panel, który z niej wyjeżdża.
 *
 *  Kolumna ma własne pudełko z `overflow: hidden` — bez niego wyjeżdżający
 *  panel kładłby się na treści obok zamiast zniknąć za krawędzią. */
window.__column = function () {
  var sh = shellOf(0);
  var s  = sh.querySelector('.evk-oc-slot');
  var u  = sh.querySelector('.evk-oc-panel.is-leaving, .evk-oc-panel.is-carried');
  return {
    slot:         s ? Math.round(s.getBoundingClientRect().width) : null,
    slotLeft:     s ? Math.round(s.getBoundingClientRect().left) : null,
    slotOverflow: s ? getComputedStyle(s).overflowX : null,
    under:        u ? { left: Math.round(u.getBoundingClientRect().left) } : null,
    underTx:      u ? Math.round(txOf(u)) : null,
  };
};

/** Ile procent kadru zajmuje dany panel — i czy kadr się nie przewinął.
 *
 *  Jedna miara dla WSZYSTKICH CZTERECH krawędzi: przy menu z góry i z dołu
 *  panele jadą w pionie, więc pomiar samego `left` nic by tam nie powiedział.
 *  Część wspólna prostokątów odpowiada na to samo pytanie niezależnie od osi.
 *
 *  `scroll` to druga połowa sprawdzenia. Kadr NIE MA prawa się przewijać:
 *  gdy się przewinie, panele stoją tam, gdzie mają, a mimo to widać nie te,
 *  co trzeba — a pomiar samych przesunięć taśmy pokazywałby wtedy zieleń. */
window.__cover = function (id) {
  var sh = shellOf(0);
  var fe = sh.querySelector('.evk-oc-frame');
  var f  = fe.getBoundingClientRect();
  var p  = sh.querySelector('.evk-oc-panel[data-panel="' + id + '"]');
  var r  = p.getBoundingClientRect();
  var w  = Math.max(0, Math.min(r.right, f.right) - Math.max(r.left, f.left));
  var h  = Math.max(0, Math.min(r.bottom, f.bottom) - Math.max(r.top, f.top));
  return {
    pct:    Math.round((w * h) / (f.width * f.height) * 100),
    scroll: Math.round(fe.scrollTop) + '/' + Math.round(fe.scrollLeft),
  };
};

window.__bare = function () {
  var sh = shellOf(0);
  var fw = sh.querySelector('.evk-oc-frame').getBoundingClientRect().width;
  var basis = parseFloat(getComputedStyle(sh).getPropertyValue('--evk-oc-panel-basis')) || fw;
  // Okno kadru w układzie taśmy — taśma bywa przesunięta na wąskim ekranie.
  var win0 = -txOf(sh.querySelector('.evk-oc-track'));
  var win1 = win0 + fw;

  var segs = [];
  sh.querySelectorAll('.evk-oc-panel').forEach(function (p) {
    var cs = getComputedStyle(p);
    if (cs.display === 'none') return;
    // Główny panel siedzi na taśmie od zera; podrzędne w slocie, czyli
    // o szerokość jednego panelu dalej.
    var at = p.closest('.evk-oc-slot') ? basis : 0;
    var tx = txOf(p);
    segs.push([at + tx, at + tx + basis]);
  });

  var bare = 0;
  for (var x = win0 + 2; x < win1; x += 4) {
    var covered = segs.some(function (s) { return x >= s[0] && x < s[1]; });
    if (!covered) bare += 4;
  }
  return Math.round(bare);
};

/**
 * ODSŁANIANIE: gdzie stoi treść, a gdzie kadr — w JEDNYM odczycie.
 *
 * Oba prostokąty czytane w tym samym wywołaniu, więc pochodzą z tej samej
 * klatki układu. To nie jest kosmetyka: fixture ostrzega przy `__bare`, że
 * w trakcie przejścia na kadrze `getBoundingClientRect()` potomków potrafi
 * pochodzić z innej klatki niż prostokąt samego kadru. Porównywanie dwóch
 * osobnych odczytów mierzyłoby wtedy szum, a nie efekt.
 *
 * `oś` skraca zapis testu: przy menu z lewej i z prawej liczy się pozioma,
 * przy górze i dole pionowa — a pytanie jest w obu przypadkach to samo.
 */
window.__odslona = function () {
  var sh = shellOf(0);
  var f  = sh.querySelector('.evk-oc-frame');
  var h  = sh.querySelector('.evk-oc-hold');
  var p  = sh.querySelector('.evk-oc-panel[data-panel="start"]');
  if (!f || !h || !p) return null;

  var fr = f.getBoundingClientRect();
  var pr = p.getBoundingClientRect();
  var pion = sh.classList.contains('is-side-top') || sh.classList.contains('is-side-bottom');

  var th = transitionOf(h, 'transform');
  var tf = transitionOf(f, 'transform');

  return {
    /* Krawędź WIODĄCA na osi ruchu — ta, po której widać, czy coś jechało. */
    kadr:  Math.round(pion ? fr.top : fr.left),
    tresc: Math.round(pion ? pr.top : pr.left),
    pion:  pion,
    /* Przesunięcie własne opakowania NA OSI RUCHU — miara reguły, nie objawu.
       Zero przy wysuwaniu, niezerowe przy odsłanianiu w stanie zamkniętym.
       Oś, nie sam X: przy menu z góry i z dołu cała rzecz dzieje się w pionie
       i pomiar samego X pokazywałby wtedy zero niezależnie od kodu. */
    holdTx: Math.round(matrixOf(h)[pion ? 5 : 4]),
    holdTransform: getComputedStyle(h).transform,
    /* Tempo obu. Ma być IDENTYCZNE — rozjechane znaczy drganie treści. */
    holdTime:  th.transition, holdEase:  th.ease,
    frameTime: tf.transition, frameEase: tf.ease,
    reveal: sh.classList.contains('is-reveal'),
  };
};

/**
 * Czy powłoka NAPRAWDĘ leży na całym oknie.
 *
 * To jest pomiar zgłoszonego objawu, a nie reguły: „otwiera się w świetle
 * bloku" znaczy dokładnie tyle, że prostokąt powłoki jest mniejszy od okna.
 * Sama klasa czy rodzic tego nie powiedzą — powłoka może siedzieć gdziekolwiek
 * i mimo to być uwięziona przez przodka z transformem.
 */
window.__oknoPowloki = function () {
  var s = shellOf(0);
  if (!s) return null;
  var r = s.getBoundingClientRect();
  return {
    w: Math.round(r.width), h: Math.round(r.height),
    x: Math.round(r.left),  y: Math.round(r.top),
    oknoW: window.innerWidth, oknoH: window.innerHeight,
    /* Czy pokrywa okno co do kilku pikseli. Tolerancja, bo pasek przewijania
       i zaokrąglenia potrafią zabrać kilkanaście. */
    naCaleOkno: Math.abs(r.width - window.innerWidth) <= 20
             && Math.abs(r.height - window.innerHeight) <= 20
             && Math.abs(r.left) <= 2 && Math.abs(r.top) <= 2,
    rodzic: s.parentElement ? s.parentElement.tagName.toLowerCase() : null,
  };
};

/**
 * Powłoka NALEŻĄCA do danego korzenia, adresowana odciskiem, a nie kolejnością.
 *
 * `shellOf(i)` bierze po kolejności w dokumencie i wszędzie indziej wystarcza —
 * ale po przerysowaniu kolejność się zmienia: świeża powłoka ląduje w <body>
 * jako ostatnia, więc „pierwsza" przestaje należeć do pierwszego korzenia.
 * Zmierzone: bez tego „menu po przerysowaniu nadal się otwiera" świeciło na
 * czerwono, choć menu otwierało się poprawnie.
 */
window.__otwarteDlaKorzenia = function (id) {
  var r = document.getElementById(id || 'root');
  var uid = r && r.dataset.evkOcUid;
  var s = uid ? document.querySelector('.evk-oc-shell[data-evk-oc-owner="' + uid + '"]') : null;
  return !!s && s.classList.contains('is-open');
};

/**
 * WYGIĘTA ŚCIANA — kształt krawędzi wiodącej, mierzony dwojako.
 *
 * `glebokosc` to REGUŁA: promień narożnika na krawędzi wjazdu, w pikselach.
 * Zero znaczy prostą ścianę.
 *
 * `wRogu` / `naSrodku` to OBJAW, i to on jest tu ważniejszy: czy treść jest
 * w danym punkcie NAPRAWDĘ widoczna. Wygięta ściana ma być obcięta przy rogu
 * i sięgać pełnej krawędzi na środku — a że `border-radius` obcina potomków
 * tylko przy `overflow: clip`, sam niezerowy promień niczego by nie dowodził.
 * Pomiar idzie `elementFromPoint`, czyli tym, co widzi kliknięcie.
 *
 * Punkty liczone od PROSTOKĄTA KADRU w tej chwili, bo kadr w trakcie wjazdu
 * jedzie — współrzędne wpisane na sztywno mierzyłyby raz treść, raz tło strony.
 */
window.__wygiecie = function () {
  var sh = shellOf(0);
  var f  = sh.querySelector('.evk-oc-frame');
  var cs = getComputedStyle(f);
  var r  = f.getBoundingClientRect();

  var pion = sh.classList.contains('is-side-top') || sh.classList.contains('is-side-bottom');
  var strona = sh.classList.contains('is-side-right')  ? 'right'
             : sh.classList.contains('is-side-left')   ? 'left'
             : sh.classList.contains('is-side-top')    ? 'top' : 'bottom';

  /* Krawędź WIODĄCA to przeciwna do tej, z której menu wjeżdża, a rogi na niej
     to te dwa, które ją tworzą. */
  var rogi = {
    right:  ['borderTopLeftRadius',    'borderBottomLeftRadius'],
    left:   ['borderTopRightRadius',   'borderBottomRightRadius'],
    top:    ['borderBottomLeftRadius', 'borderBottomRightRadius'],
    bottom: ['borderTopLeftRadius',    'borderTopRightRadius'],
  }[strona];

  // Pierwsza liczba to promień wzdłuż osi ruchu przy lewej/prawej, druga przy
  // górze/dole — czyli zawsze GŁĘBOKOŚĆ wygięcia.
  var pierwszy = parseFloat(cs[rogi[0]].split(' ')[pion ? 1 : 0]) || 0;

  // Punkt tuż przy krawędzi wiodącej: 2 px w głąb kadru.
  var przyKrawedzi = {
    right:  function (t) { return [r.left + 2,  r.top + r.height * t]; },
    left:   function (t) { return [r.right - 2, r.top + r.height * t]; },
    top:    function (t) { return [r.left + r.width * t, r.bottom - 2]; },
    bottom: function (t) { return [r.left + r.width * t, r.top + 2]; },
  }[strona];

  var wKadrze = function (t) {
    var p = przyKrawedzi(t);
    if (p[0] < 0 || p[1] < 0 || p[0] > window.innerWidth || p[1] > window.innerHeight) return null;
    var el = document.elementFromPoint(p[0], p[1]);
    return !!(el && f.contains(el));
  };

  return {
    glebokosc: Math.round(pierwszy),
    /* UWAGA: `border-radius` w procentach NIE JEST rozwiązywany do pikseli
       w wartości obliczonej — przeglądarka zwraca „30%". Ta liczba jest więc
       procentem, nie pikselami, i nadaje się do porównań („rośnie", „zero"),
       a nie do geometrii. Kształt mierzymy obrazem, patrz __punktyWygiecia. */
    wRogu:     wKadrze(0.03),
    naSrodku:  wKadrze(0.5),
    krzywa:    sh.classList.contains('is-curve'),
    zamyka:    sh.classList.contains('is-closing'),
    animacja:  cs.animationName,
    czas:      cs.animationDuration,
    kierunek:  cs.animationDirection,
  };
};

/**
 * Zamraża kadr, żeby kształt dało się w ogóle zmierzyć.
 *
 * Bez tego pomiar jest nierzetelny i to zmierzone, nie teoretyczne: kadr jedzie,
 * więc zrzut ekranu i `getBoundingClientRect()` pochodzą z RÓŻNYCH chwil —
 * różnica sięgała 25 px i próbka trafiała obok kształtu, pokazując tło zamiast
 * panelu.
 *
 * Przejścia przewijamy na KONIEC (kadr staje na miejscu), a animację wygięcia
 * na zadany ułamek jej czasu. Kształt jest wtedy dokładnie ten, który chcemy
 * zmierzyć, i nie zmienia się między odczytami.
 */
/**
 * Ścieżka obcięcia wygiętej ściany — i sposób na ustawienie jej wprost.
 *
 * Kształty bierzemy Z WTYCZKI (`evk_oc_sciezki_wygiecia`), nie z kopii tutaj:
 * przepisane do fixture'a przestałyby cokolwiek dowodzić o tym, co rysuje się
 * na stronie.
 */
window.__sciezkaWyg = function () {
  var el = shellOf(0).querySelector('clipPath path');
  return el ? el.getAttribute('d') : null;
};

window.__ustawWyg = function (ktora) {
  var sh = shellOf(0);
  var el = sh.querySelector('clipPath path');
  if (!el) return false;
  var strona = sh.classList.contains('is-side-right')  ? 'right'
             : sh.classList.contains('is-side-left')   ? 'left'
             : sh.classList.contains('is-side-top')    ? 'top' : 'bottom';
  var sila = parseFloat(document.getElementById('root').getAttribute('data-curve-intensity'));
  // Oś czasu GSAP-a nadpisałaby nasz atrybut w następnej klatce.
  if (window.gsap) gsap.globalTimeline.pause();
  el.setAttribute('d', evk_oc_sciezki_wygiecia(strona, isNaN(sila) ? 1 : sila)[ktora]);
  return true;
};

window.__zamroz = function (ulamek) {
  /* CAŁA powłoka, nie sam kadr. Przyciemnienie ma własne przejście i w połowie
     drogi jest ledwie widoczne — próbka „poza kształtem" wychodziła wtedy
     prawie tak jasna jak panel (692 wobec 765) i próg robił się loteryjny.
     Przewinięte na koniec daje pełne przyciemnienie i różnicę nie do pomylenia. */
  shellOf(0).getAnimations({ subtree: true }).forEach(function (a) {
    a.pause();
    var d = a.effect ? a.effect.getComputedTiming().duration : 0;
    // CSSAnimation ma `animationName`, CSSTransition nie — po tym je różnimy.
    a.currentTime = a.animationName ? d * ulamek : d;
  });
};

/**
 * Dwa punkty na krawędzi WIODĄCEJ: przy rogu i na środku.
 *
 * Przy wygiętej ścianie róg ma być obcięty, a środek sięgać pełnej krawędzi.
 * Punkty liczone od prostokąta kadru W TEJ CHWILI — po zamrożeniu nie zmienia
 * się już do końca pomiaru.
 *
 * Hit-testem tego zmierzyć NIE MOŻNA: `elementFromPoint` zwraca panel także
 * tam, gdzie obrazu nie ma (zmierzone). Liczy się to, co widać, więc próbkujemy
 * piksele zrzutu ekranu.
 */
window.__punktyWygiecia = function () {
  var sh = shellOf(0);
  var r  = sh.querySelector('.evk-oc-frame').getBoundingClientRect();
  var K  = 8;   // ile pikseli od rogu wzdłuż krawędzi
  var strona = sh.classList.contains('is-side-right')  ? 'right'
             : sh.classList.contains('is-side-left')   ? 'left'
             : sh.classList.contains('is-side-top')    ? 'top' : 'bottom';

  /* DWIE linie skanu, nie punkty — i to jest zmiana wobec 1.98.0.
     
     Wtedy kształt robił `border-radius`, więc brzeg zawsze dotykał krawędzi
     kadru na środku i wystarczyło zapytać o jeden punkt tuż przy niej. Teraz
     robi go obcięcie ścieżką, która ROŚNIE: w połowie drogi brzeg stoi w środku
     panelu, więc przy samej krawędzi nie ma treści na żadnej wysokości i taki
     pomiar pokazywałby ciemno zawsze.
     
     Mierzy się więc GŁĘBOKOŚĆ brzegu na dwóch wysokościach: przy rogu i na
     środku. Wygięcie to różnica między nimi — na środku brzeg wyprzedza, więc
     jego głębokość jest MNIEJSZA. Przy prostym brzegu obie są równe. */
  /* Jeden piksel W GŁĄB od krawędzi wiodącej. `getBoundingClientRect().right`
     i `.bottom` są WYŁĄCZNE — próbka dokładnie na nich pada już poza kadrem.
     Zmierzone: przy menu z lewej i z góry pełne otwarcie wychodziło wtedy
     „4 px obcięcia" zamiast zera, choć obcięcia nie było. */
  var wGlab = {
    right:  function (d, t) { return [r.left + 1 + d,  r.top + t]; },
    left:   function (d, t) { return [r.right - 1 - d, r.top + t]; },
    top:    function (d, t) { return [r.left + t,  r.bottom - 1 - d]; },
    bottom: function (d, t) { return [r.left + t,  r.top + 1 + d]; },
  }[strona];

  var wzdluz = (strona === 'top' || strona === 'bottom') ? r.width : r.height;
  var wGlebokosc = (strona === 'top' || strona === 'bottom') ? r.height : r.width;
  var KROK = 4;

  var linia = function (t) {
    var out = [];
    for (var d = 0; d <= wGlebokosc; d += KROK) out.push(wGlab(d, t));
    return out;
  };

  return {
    skanRog:    linia(K),
    skanSrodek: linia(wzdluz / 2),
    krok: KROK,
  };
};

/** Ile powłok leży w dokumencie — po przerysowaniu ma NIE przybywać. */
window.__ilePowlok = function () { return document.querySelectorAll('.evk-oc-shell').length; };

/** Ile z nich jest osierocona: nosi odcisk korzenia, którego już nie ma. */
window.__ileOsieroconych = function () {
  return Array.prototype.filter.call(
    document.querySelectorAll('.evk-oc-shell[data-evk-oc-owner]'),
    function (s) {
      return !document.querySelector('[data-evk-oc-uid="' + s.getAttribute('data-evk-oc-owner') + '"]');
    }).length;
};

/**
 * Co silnik zrobił z elementem, który uczynił sterowaniem.
 *
 * `aria-label` na elemencie BEZ ROLI jest zabroniony — rola domyślna
 * (`generic`) nie ma prawa mieć nazwy. Rola `button` ten zarzut zdejmuje
 * i jednocześnie jest prawdą o tym, czym ten span się stał.
 */
window.__sterowanie = function (id) {
  var el = document.getElementById(id) || shellOf(0).querySelector('#' + id);
  if (!el) return null;
  return {
    rola:     el.getAttribute('role'),
    tabindex: el.getAttribute('tabindex'),
    aria:     el.getAttribute('aria-label'),
    // Czy pułapka fokusu w ogóle go widzi — po tym poznać, czy klawiaturą
    // da się w podmenu wejść.
    wPulapce: !!el.matches('a[href], button:not([disabled]), input:not([disabled]), select, textarea, [tabindex]:not([tabindex="-1"])'),
  };
};

/** Naciśnięcie klawisza NA KONKRETNYM elemencie — nie na dokumencie. */
window.__klawiszNa = function (id, key) {
  var el = document.getElementById(id) || shellOf(0).querySelector('#' + id);
  if (!el) return false;
  el.focus();
  el.dispatchEvent(new KeyboardEvent('keydown', { key: key, bubbles: true, cancelable: true }));
  return true;
};

/* ── SONDA OTWIERANIA ──────────────────────────────────────────────────────
 *
 * Wariant `?evk-oc-proba=anim` ma NIE prosić Animatora o odegranie treści.
 * Mierzymy to licznikiem wywołań, a nie objawem: po odegraniu krycie wraca
 * do jedynki i wygląda dokładnie tak samo jak wtedy, gdy nic nie zagrało —
 * pomiar z krycia byłby więc zielony w obie strony.
 *
 * Owijka staje między Animatorem a menu: menu czyta `window.evkAnimatorReplay`
 * w chwili wołania, więc podmiana tutaj jest dla niego niewidoczna. */
window.__ileReplay = 0;
(function () {
  var org = window.evkAnimatorReplay;
  window.evkAnimatorReplay = function () {
    window.__ileReplay++;
    return typeof org === 'function' ? org.apply(this, arguments) : 0;
  };
})();

/** Treść tablicy sondy — albo null, gdy sondy na stronie nie ma. */
window.__proba = function () {
  var el = document.querySelector('[data-evk-oc-proba]');
  return el ? el.textContent : null;
};

/** Dotknięcie przełącznika. Grzanie wisi na NIM, nie na kliknięciu — cały
 *  jego sens jest w przerwie między jednym a drugim. */
window.__dotknij = function () {
  document.getElementById('trigger')
    .dispatchEvent(new PointerEvent('pointerdown', { bubbles: true }));
};

/**
 * Stan grzania — i to, czego przy nim widać NIE MA.
 *
 * Sama klasa nic by nie dowodziła: grzanie zdejmuje `visibility: hidden`,
 * czyli robi powłokę malowalną, i całe pytanie brzmi, czy przy okazji czegoś
 * nie pokazuje. Stąd obok flag prostokąt kadru i krycie przyciemnienia.
 */
window.__grzanie = function () {
  var s = shellOf(0);
  var f = s.querySelector('.evk-oc-frame');
  var c = s.querySelector('.evk-oc-scrim');
  var r = f.getBoundingClientRect();
  return {
    armed:      s.classList.contains('is-armed'),
    open:       s.classList.contains('is-open'),
    widocznosc: getComputedStyle(s).visibility,
    kliki:      getComputedStyle(s).pointerEvents,
    willFrame:  getComputedStyle(f).willChange,
    willScrim:  getComputedStyle(c).willChange,
    krycieZaslony: +parseFloat(getComputedStyle(c).opacity).toFixed(2),
    // Kadr ma stać POZA oknem — grzanie nie ma prawa niczego pokazać.
    kadrWOknie: r.right > 1 && r.left < window.innerWidth - 1,
  };
};

/** Czy przyciemnienie w ogóle się rysuje. */
window.__zaslonaWidoczna = function () {
  return getComputedStyle(shellOf(0).querySelector('.evk-oc-scrim')).display !== 'none';
};

/** Stan drugiego korzenia — panele bez nazw, adresowane kolejnością. */
window.__open2  = function () { document.getElementById('trigger2').click(); };
window.__state2 = function () {
  var panels = shellOf(1).querySelectorAll('.evk-oc-panel');
  return Array.prototype.map.call(panels, function (p, i) {
    return { i: i, current: p.classList.contains('is-current'),
             text: (p.textContent || '').trim().slice(0, 14) };
  });
};
</script>
