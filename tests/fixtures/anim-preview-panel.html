<script>
/* Zakładka z PRAWDZIWEGO tab-animator.php i presety z PRAWDZIWEGO
   evk_anim_presets() — oba przez window.__* z testu.

   Ten fixture pilnuje SZWU: czy interfejs, który admin.js dokłada do wiersza,
   trafia w markup zakładki i czy kliknięcie ▶ realnie uruchamia silnik.
   Testy jednostkowe podglądu wołają silnik wprost i tego szwu nie dotykają —
   a to on rozjedzie się najszybciej, bo obie strony żyją w osobnych plikach. */
document.getElementById('panel').innerHTML = window.__tab;
window.evoOneAnimData = { rowStart: 100, url: '/fake-ajax', nonce: 'n', saveNonce: 's' };
window.evkAnimator    = { library: {}, presets: window.__presets };
jQuery.post = function () {
  var api = { done: function () { return api; }, fail: function () { return api; } };
  return api;
};
</script>

<script src="../../assets/js/animator.js"></script>
<script>
/* Zapamiętujemy oś czasu zwróconą przez podgląd. Próbkowanie opacity po czasie
   NIE odróżnia „czas trwania 3 s" od „0,8 s" — po 0,7 s obie są w połowie drogi
   i sprawdzenie przechodzi w obu przypadkach (potwierdzone celowym zepsuciem,
   które nie zapaliło niczego). Czas trwania trzeba odczytać, nie zgadywać. */
window.__lastTl = null;
var origPreview = window.evkAnimatorPreview;
window.evkAnimatorPreview = function (el) {
  var tl = origPreview(el);
  window.__lastTl = tl;
  return tl;
};
</script>
<script src="../../assets/admin/admin.js"></script>

<script>
window.__rows = function () {
  return document.querySelectorAll('#evo-anim-repeater-container > .evo-anim-row').length;
};

/** Czy panel dołożył interfejs podglądu do każdego wiersza. */
window.__ui = function () {
  return Array.prototype.map.call(
    document.querySelectorAll('#evo-anim-repeater-container > .evo-anim-row'),
    function (r) {
      var play  = r.querySelector('.evo-anim-play');
      var stage = r.querySelector('.evo-anim-preview-stage');
      var frame = r.querySelector('.evo-anim-preview-frame');
      var pr = play  && play.getBoundingClientRect();
      var fr = frame && frame.getBoundingClientRect();
      return {
        play:  !!play,
        stage: !!stage,
        text:  stage ? stage.textContent.trim() : '',
        // Przycisk ma stać PRZY KADRZE, nie w nagłówku wiersza. W nagłówku
        // znika z pola widzenia, gdy akordeon jest rozwinięty: pasek zostaje
        // u góry, a pudełko z przykładem jest kilkaset pikseli niżej.
        inPreview: !!(play && play.closest('.evo-anim-preview')),
        // Odstęp poziomy od kadru — dodatni, gdy ▶ stoi po prawej stronie
        // kadru; ujemny znaczy, że go nachodzi.
        gapToFrame: (pr && fr) ? Math.round(pr.left - fr.right) : 9999,
        // Ile pikseli wspólnej wysokości mają ▶ i kadr. Sam odstęp poziomy
        // nie wystarczy: przycisk zwinięty POD kadrem też ma mały odstęp,
        // a wtedy „obok" jest nieprawdą.
        vOverlap: (pr && fr)
          ? Math.round(Math.min(pr.bottom, fr.bottom) - Math.max(pr.top, fr.top)) : 0,
        playH: pr ? Math.round(pr.height) : 0,
      };
    });
};

/** Ile scena WIDOCZNIE wychodzi poza wiersz.
 *
 *  `getBoundingClientRect()` ignoruje obcięcie, więc sama geometria nic tu nie
 *  mówi: scena zawsze „wystaje", bo GSAP ją przesuwa. Liczy się to, co widać —
 *  czyli scena przycięta przez wszystkich przodków z `overflow: hidden`. */
window.__overflowOut = function (i) {
  var st  = document.querySelectorAll('.evo-anim-preview-stage')[i || 0];
  var row = document.querySelectorAll('#evo-anim-repeater-container > .evo-anim-row')[i || 0];
  var s = st.getBoundingClientRect(), o = row.getBoundingClientRect();
  var left = -1e9, right = 1e9;
  for (var n = st.parentElement; n; n = n.parentElement) {
    if (getComputedStyle(n).overflowX === 'hidden') {
      var c = n.getBoundingClientRect();
      left  = Math.max(left, c.left);
      right = Math.min(right, c.right);
    }
  }
  return {
    raw:     Math.round(Math.max(0, o.left - s.left, s.right - o.right)),
    visible: Math.round(Math.max(0, o.left - Math.max(s.left, left),
                                    Math.min(s.right, right) - o.right)),
    docScroll: document.documentElement.scrollWidth,
    win: window.innerWidth,
  };
};

window.__stageState = function (i) {
  var st = document.querySelectorAll('.evo-anim-preview-stage')[i || 0];
  var s  = getComputedStyle(st);
  return { opacity: s.opacity, transform: s.transform, text: st.textContent, kids: st.children.length };
};

window.__note = function (i) {
  var n = document.querySelectorAll('.evo-anim-preview-note')[i || 0];
  return n ? n.textContent.trim() : null;
};

/** Ustawia wartość pola wiersza — podgląd ma czytać ŻYWE wartości. */
window.__setField = function (i, key, val) {
  var row = document.querySelectorAll('#evo-anim-repeater-container > .evo-anim-row')[i];
  var f   = row.querySelector('[name$="[' + key + ']"]');
  if (!f) return false;
  f.value = val;
  return true;
};

/** Czas trwania osi czasu z ostatniego odegrania — mierzony, nie próbkowany. */
window.__lastDuration = function () {
  return window.__lastTl ? window.__lastTl.duration() : null;
};

window.__collapsed = function (i) {
  return document.querySelectorAll('#evo-anim-repeater-container > .evo-anim-row')[i]
    .classList.contains('is-collapsed');
};
</script>
