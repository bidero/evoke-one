<!--
  Taśma mierzona na obrazach, których jeszcze nie ma.

  `getAmount()` to `track.scrollWidth − root.clientWidth`, a w trybie
  „z buildera" (`widthMode: auto`) `scrollWidth` bierze się WPROST z treści
  paneli. Lazy-loader podstawia tam na start zastępcze `data:image/svg+xml`
  — zmierzone na evoke.pl: 50 z 54 obrazów taśmy bez `width`/`height`.

  Karty NIE MAJĄ tu narzuconej szerokości: bierze się ona z obrazu i tylko
  z niego. Bez tego zmiana rozmiaru obrazu nie ruszyłaby `scrollWidth`
  i sprawdzenia przechodziłyby, choć poprawki by nie było.

  Obrazy zaczynają jako wąskie (150 px) i dojeżdżają na `__dojedz()` — wtedy
  robi się z nich 400 px. Osiem kart: 8×174 = 1392 przy oknie 1200 daje zapas
  192, a po dojechaniu 8×424 = 3392, czyli 2192. Różnica jest o rząd wielkości
  większa niż jakikolwiek błąd pomiaru.

  ANIMATOR PRZED HSCROLLEM — tak samo jak na evoke.pl i tak samo jak
  w anim-po-hs.html. W odwrotnej kolejności błąd nie ma jak wyjść.

  Parametry: odrazu (obrazy od razu docelowe — kontrola negatywna),
             pozno  (hscroll wpięty DOPIERO po zdarzeniu `load`).
-->
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px system-ui; }
  .przed { height: 900px; background: #eee; }
  .sekcja { background: #4c1d95; color: #fff; padding: 20px 0; }
  /* Ani szerokości, ani `flex` — rozmiar karty ma pochodzić z obrazu.
     `flex: 0 0 auto` tylko po to, żeby flexbox jej nie ścisnął. */
  .karta { flex: 0 0 auto; margin-right: 24px; background: rgba(255,255,255,.12); }
  .karta img { display: block; }
  /* Szerokość zmieniona STYLEM, bez żadnego `load` — tak zachowują się
     webfonty w panelu. Łapie to wyłącznie `ResizeObserver`. */
  body.rozepchnij .karta img { width: 700px; }
  .po { height: 300px; background: #ddd; }
  #cel { height: 200px; background: #345; color: #fff; }
  .ogon { height: 1500px; background: #eee; }
</style>

<link rel="stylesheet" href="../../includes/bricks-elements/evoke-horizontal-scroll/assets/hscroll.css">

<div class="przed">treść przed sekcją</div>

<section class="sekcja" id="sekcja-1">
  <div class="evk-hscroll" id="hs-1">
    <div class="evk-hscroll__track" id="tasma"></div>
  </div>
</section>

<div class="po">tuż pod sekcją</div>
<div id="cel">CEL — ANIMACJA W KADRZE</div>
<div class="ogon"></div>

<script src="../../assets/vendor/gsap/gsap.min.js"></script>
<script src="../../assets/vendor/gsap/ScrollTrigger.min.js"></script>

<script>
/* ── Obrazy ──────────────────────────────────────────────────────────────
   SVG z atrybutami `width`/`height` ma rozmiar własny, więc karta bez
   narzuconej szerokości bierze go wprost. Podmiana `src` wywołuje `load`
   normalnie — dokładnie jak podmiana robiona przez lazy-loader. */
function obrazek(w) {
  return 'data:image/svg+xml;utf8,'
    + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="' + w
      + '" height="200"><rect width="100%" height="100%" fill="#8b5cf6"/></svg>');
}

var ODRAZU = new URLSearchParams(location.search).get('odrazu') === '1';
var WASKI = 150, SZEROKI = 400;

(function () {
  var t = document.getElementById('tasma');
  for (var i = 1; i <= 8; i++) {
    var k = document.createElement('div');
    k.className = 'karta';
    var img = document.createElement('img');
    img.className = 'obraz';
    img.src = obrazek(ODRAZU ? SZEROKI : WASKI);
    k.appendChild(img);
    t.appendChild(k);
  }
})();

/* Dojazd obrazów. Przy `odrazu=1` nie ma czego podmieniać — i o to chodzi:
   kontrola negatywna ma pokazać, że różnica w pomiarze bierze się z obrazów,
   a nie z upływu czasu. */
window.__dojedz = function () {
  if (ODRAZU) return 0;
  var lista = document.querySelectorAll('#tasma .obraz');
  lista.forEach(function (img) { img.src = obrazek(SZEROKI); });
  return lista.length;
};

/* Rozepchnięcie kart BEZ obrazu — do sprawdzenia gałęzi `ResizeObserver`.
   Nie leci tu żadne `load`, więc nasłuch na obrazach tego nie zobaczy. */
window.__rozepchnij = function () { document.body.classList.add('rozepchnij'); };

/* ── Licznik przeliczeń ─────────────────────────────────────────────────
   Do sprawdzenia ścieżki „`load` już poleciał". Tam nie chodzi o to, jaki
   wyjdzie układ, tylko o to, CZY przeliczenie w ogóle się odbywa — bez tej
   gałęzi nasłuch wiesza się na zdarzeniu, którego nikt już nie wywoła. */
window.__ile = 0;
(function () {
  var oryg = ScrollTrigger.refresh.bind(ScrollTrigger);
  ScrollTrigger.refresh = function () { window.__ile++; return oryg.apply(null, arguments); };
})();
</script>

<script>
/* `top 100%` daje arytmetykę bez reszty: punkt startu to dokładnie „pozycja
   elementu w dokumencie minus wysokość okna". Preset bez przesunięcia — sama
   przezroczystość, żeby stan początkowy nie zniekształcał prostokąta. */
window.evkAnimator = {
  library: {
    wkadrze: { slug: 'wkadrze', preset: 'fade-up', trigger: 'viewport',
               duration: 0.4, delay: 0, stagger: 0, easing: 'none', order: 0,
               start: 'top 100%', targets: 'self', selector: '', pin: 0 },
  },
  presets: { 'fade-up': { from: { opacity: 0 }, to: { opacity: 1 }, duration: 0.4 } },
  reducedMotion: false, needsFonts: false,
};
document.getElementById('cel').setAttribute('data-evk-anim', 'wkadrze');
</script>

<!-- ANIMATOR PRZED HSCROLLEM — patrz komentarz na górze. -->
<script src="../../assets/js/animator.js"></script>

<script>
document.getElementById('hs-1').setAttribute('data-evk-hscroll', JSON.stringify({
  widthMode: 'auto', pinTarget: 'selector', pinSelector: '.sekcja',
  scrub: 0, startOffset: 'top top', snap: false, disableBelow: 0,
  progressBar: false, peekNext: false,
}));

/* `pozno=1` — hscroll dojeżdża DOPIERO po `load`, czyli w chwili, gdy nasłuch
   na `load` nie ma się już do czego podpiąć. Tak zachowują się pliki z cache. */
(function () {
  var src = '../../includes/bricks-elements/evoke-horizontal-scroll/assets/hscroll.js';
  if (new URLSearchParams(location.search).get('pozno') !== '1') {
    document.write('<script src="' + src + '"><\/script>');
    return;
  }
  window.addEventListener('load', function () {
    setTimeout(function () {
      var s = document.createElement('script');
      s.src = src;
      document.body.appendChild(s);
    }, 50);
  });
})();
</script>

<script>
/**
 * Prawdziwa pozycja w dokumencie — z łańcucha `offsetTop`, NIE z prostokąta:
 * `getBoundingClientRect()` wlicza transformację.
 */
function pozycjaUkladu(el) {
  var y = 0;
  for (var n = el; n; n = n.offsetParent) y += n.offsetTop;
  return Math.round(y);
}

window.__stan = function () {
  var cel = document.getElementById('cel');
  var doc = pozycjaUkladu(cel);
  var st  = ScrollTrigger.getAll().filter(function (t) { return t.trigger === cel; })[0];
  var pin = ScrollTrigger.getAll().filter(function (t) { return t.pin; })[0];

  return {
    // Długość przewijania taśmy — to ona zależy od szerokości obrazów.
    droga: pin ? Math.round(pin.end - pin.start) : null,
    pinKoniec: pin ? Math.round(pin.end) : null,
    pozycjaCelu: doc,
    oczekiwanyStart: doc - window.innerHeight,
    start: st ? Math.round(st.start) : null,
    // Bez tego „droga się zmieniła" byłoby prawdą także wtedy, gdyby obrazy
    // w ogóle nie dojechały.
    szerokoscTasmy: Math.round(document.getElementById('tasma').scrollWidth),
    przeliczen: window.__ile,
  };
};

window.__doPozycji = function (y) { window.scrollTo(0, y); };
</script>
